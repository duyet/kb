title = "kb — secret & PII scanner"

[extend]
useDefault = true

# Too noisy in markdown prose
disabledRules = ["generic-api-key"]

# --- Global allowlist ---------------------------------------------------------
# Files that legitimately contain the very tokens the custom rules below match:
# the scanner/hook sources that DEFINE the patterns, and viz.html — a generated
# artifact rebuilt from the memory notes (which ARE scanned as the source of
# truth, so scanning the derived single-line blob only produces noise).
[allowlist]
paths = [
  '''\.gitleaks\.toml''',
  '''scripts/lint\.sh''',
  '''scripts/bootstrap\.sh''',
  '''githooks/pre-commit''',
  '''viz\.html''',
]

# --- Custom rules for hostnames, IPs, internal names --------------------------

[[rules]]
id = "private-ip-address"
description = "Private/internal IP address"
regex = '''(?:(?:10\.\d{1,3}\.\d{1,3}\.\d{1,3})|(?:172\.(?:1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3})|(?:192\.168\.\d{1,3}\.\d{1,3}))'''
tags = ["ip", "network"]

[[rules]]
id = "ssh-user-host"
description = "SSH user@host pattern"
regex = '''[a-z_][a-z0-9_-]*@[a-z0-9][a-z0-9.-]+\.[a-z]{2,}'''
tags = ["ssh", "hostname"]
  # NOTE: gitleaks 8.18 uses the SINGULAR [rules.allowlist] table; the plural
  # [[rules.allowlists]] array is 8.19+ and is silently ignored on 8.18, which
  # is why these allow-lists must stay singular to match the pinned CI version.
  [rules.allowlist]
  regexTarget = "line"
  # Allow public GitHub commit author emails and public source URLs:
  regexes = [
    '''github\.com''',
    '''gitlab\.com''',
    '''npmjs\.com''',
    '''pypi\.org''',
    '''crates\.io''',
    '''duyet\.net''',
    '''duyet\.dev''',
  ]

[[rules]]
id = "aws-access-key"
description = "AWS Access Key ID"
regex = '''AKIA[0-9A-Z]{16}'''
tags = ["aws", "key"]

[[rules]]
id = "location-coordinates"
description = "GPS coordinates (lat/lng with 4+ decimal precision)"
regex = '''[-+]?\d{1,3}\.\d{4,}\s*,\s*[-+]?\d{1,3}\.\d{4,}'''
tags = ["location", "pii"]

[[rules]]
id = "tailscale-magicdns-host"
description = "Tailscale MagicDNS / private DNS hostname (*.ts.net, .internal, .lan, .local)"
regex = '''(?i)[a-z0-9]([a-z0-9-]*[a-z0-9])?\.(ts\.net|internal|lan|local)\b'''
tags = ["hostname", "network", "tailscale"]
  [rules.allowlist]
  regexTarget = "line"
  # Legit dev-file names / standard DNS suffixes that end in a private-DNS-looking
  # token (Kubernetes `*.svc.cluster.local`, `.env.local`, `~/.local/`, …).
  regexes = [
    '''\.env\.local''',
    '''\.local/''',
    '''cluster\.local''',
    '''conf\.local''',
    '''secrets\.local''',
    '''settings\.local''',
  ]
