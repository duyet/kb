<meta charset="utf-8">

<title>duyet-kb — OKF Bundle Viewer</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;font-size:14px;color:#0f172a;background:#f8fafc;display:flex;flex-direction:column;height:100vh}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:#fff;border-bottom:1px solid #e2e8f0;flex-shrink:0}
.title strong{font-size:16px;margin-right:8px}
.muted{color:#64748b;font-size:12px}
.legend{display:flex;gap:12px;font-size:12px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:middle}
main{display:flex;flex:1;min-height:0}
#graph{flex:1 1 60%;background:#fff;border-right:1px solid #e2e8f0;min-width:0;position:relative}
#detail{flex:0 0 40%;overflow-y:auto;padding:18px 22px;background:#fff}
#detail h1{font-size:18px;margin:0 0 6px}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;color:#fff}
#detail .desc{color:#475569;margin:8px 0 12px}
#detail .tags{margin-bottom:12px}
#detail .tags span{font-size:11px;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:4px;padding:2px 6px;margin:0 4px 4px 0;display:inline-block}
#detail .body{line-height:1.55}
#detail .body pre{background:#0f172a;color:#e2e8f0;padding:10px;border-radius:6px;overflow:auto}
#detail .body code{background:#f1f5f9;padding:1px 4px;border-radius:3px;font-size:13px}
#detail .body pre code{background:none;padding:0}
#detail .body table{border-collapse:collapse;margin:8px 0}
#detail .body th,#detail .body td{border:1px solid #e2e8f0;padding:4px 8px}
#detail .body a{color:#2563eb}
#detail h2{font-size:13px;margin-top:18px;color:#64748b;text-transform:uppercase;letter-spacing:.04em}
#backlinks ul{padding-left:18px;margin:4px 0}
#backlinks a{color:#2563eb;cursor:pointer}
.hint{position:absolute;bottom:10px;left:12px;color:#94a3b8;font-size:12px}
</style>
</head>
<body>
<header>
  <div class="title"><strong>duyet-kb</strong><span class="muted">OKF v0.1 bundle viewer</span></div>
  <div class="legend" id="legend"></div>
</header>
<main>
  <div id="graph"><div class="hint">scroll = zoom · drag = pan · click a node</div></div>
  <section id="detail"><p class="muted">Select a node to read it.</p></section>
</main>

for mechanical work; reserve expensive models for hard reasoning.\n\n**Why:** parallel fan-out multiplies cost.\n**How to apply:** pass explicit cheaper model on dispatch. Related: [[tech-agent-loop-cheap-subagents]], [[feedback-working-style]].", "feedback-concise-english": "Use simple, short English. No filler (\"comprehensive\", \"elaborate\").\n\n**Why:** faster review, clearer agent output.\n**How to apply:** trim adverbs; prefer lists; match [[feedback-semantic-commits]].", "feedback-disambiguate-repo": "Duyet multi-homes work: chmonitor, AnyRouter, AgentState, AnyWorker, OMA, monorepo, kb, homelab.\n\n**How to apply:** if the chat is ambiguous, ask or infer from cwd/path; never assume monorepo. Index: [[user-duyet-active-projects]], [[user-duyet-multi-project]].", "feedback-docs-driven-development": "Pattern:\n\n1. [[feedback-docs-router-tiny]] \u2014 keep CLAUDE.md/AGENTS.md short\n2. [[feedback-docs-kb-is-brain]] \u2014 structured notes are the memory\n3. [[feedback-docs-read-on-entry]] \u2014 index first\n4. [[feedback-docs-write-on-exit]] \u2014 capture before context dies\n\nImplemented by [[project-kb]]. Owner stance: [[user-duyet-ai-stance]].", "feedback-docs-kb-is-brain": "A public/shared kb persists across tools and sessions. This repo is that brain: [[project-kb]].\n\n**How to apply:** atomic notes + `MEMORY.md` index + [[tech-okf-bundle]].", "feedback-docs-read-on-entry": "Trigger: session start / new task \u2192 open MEMORY.md, then only matching notes.\n\n**How to apply:** never bulk-load entire memory/. See [[feedback-docs-write-on-exit]].", "feedback-docs-router-tiny": "Router files rot if they hold feature contracts. Point to notes instead.\n\n**How to apply:** put durable facts in [[project-kb]] notes; keep routers as indexes. See [[feedback-docs-driven-development]].", "feedback-docs-write-on-exit": "Trigger: learned durable public fact \u2192 note or inbox, then lint/sync.\n\n**How to apply:** public-only (AGENTS.md \u00a73). Pair with [[feedback-docs-read-on-entry]].", "feedback-fail-loud": "Surface uncertainty and skipped work. \"Tests pass\" is false if any were skipped.\n\n**How to apply:** list what was not verified. Pair with [[feedback-logic-change-update-tests]].", "feedback-logic-change-update-tests": "If you rename contracts or change behavior tests lock, grep tests and update expected values in the same PR.\n\n**Why:** green \"new code only\" still breaks CI.\n**How to apply:** run related suite before claiming done. See [[feedback-fail-loud]], [[tech-codebase-maintenance-loop]].", "feedback-never-auto-merge-release-please": "Do not arm auto-merge on release-please PRs (`chore(main): release X.Y.Z`, branches `release-please--*`).\n\n**How to apply:** fix/CI babysit only; human merges releases. See [[tech-release-please-basics]], [[project-open-managed-agents]].", "feedback-public-kb-only": "This repo is public. Store durable, generic, public facts only.\n\n**Ban:** credentials, hostnames, IPs, machine names, employer-internal codenames, private topology.\n**Allow:** public `duyet/*` GitHub repos, published blog/CV facts, reusable tech patterns.\nSee AGENTS.md \u00a73. Hub: [[project-kb]].", "feedback-semantic-commits": "Conventional Commits style. Subject: lowercase, short. Body only when needed.\n\n**How to apply:** `feat(scope): \u2026`, `fix(scope): \u2026`, `chore: \u2026`. Related: [[tech-release-please-pr-title]], [[feedback-concise-english]].", "feedback-simple-code": "Ship the smallest correct change. No unused flexibility.\n\n**Why:** less debt, easier agent diffs.\n**How to apply:** delete speculative layers; match [[feedback-surgical-changes]].", "feedback-surgical-changes": "Every changed line must map to the user request. Mention unrelated dead code; don't delete it unless asked.\n\n**How to apply:** read callers first; avoid formatting-only churn. See [[feedback-simple-code]].", "feedback-working-style": "Agent working-style index:\n\n- [[feedback-concise-english]] \u00b7 [[feedback-simple-code]] \u00b7 [[feedback-semantic-commits]]\n- [[feedback-surgical-changes]] \u00b7 [[feedback-fail-loud]]\n- [[feedback-docs-driven-development]] \u00b7 [[feedback-cheap-models-subagents]]\n- [[feedback-logic-change-update-tests]] \u00b7 [[feedback-never-auto-merge-release-please]]\n\n- [[feedback-disambiguate-repo]] \u2014 multi-product sessions\n\nOwner: [[user-duyet-profile]].", "project-agentstate": "github.com/duyet/agentstate \u00b7 https://agentstate.app\n\nFleet **state/coordination** API (not an agent framework \u2014 [[tech-agentstate-not-a-framework]]). Five primitives: [[tech-agentstate-five-primitives]].\n\nSDKs: npm `@agentstate/sdk`, PyPI `agentstate`. MCP available. MIT, self-hostable.\nPortfolio: [[user-duyet-active-projects]]. Related: [[project-anyworker]], [[project-open-managed-agents]], [[tech-ai-agent-stack]].", "project-anyrouter-openai-compat": "AnyRouter accepts OpenAI Chat Completions-shaped clients (and Anthropic Messages). Integrate by changing base URL + model id.\n\nProduct hub: [[project-anyrouter]]. Gateway lessons: [[tech-llm-gateway-quota-as-retryable]].", "project-anyrouter": "https://anyrouter.dev \u2014 **universal AI model router**: one API, many providers/models, OpenAI Chat Completions + Anthropic Messages compatible.\n\nProduct traits (public): multi-provider routing, BYOK, pricing/latency comparison, Cloudflare-edge deploy.\nPackages mentioned publicly: `@anyr/sdk`, `@anyr/cli`.\n\nAPI shape: [[project-anyrouter-openai-compat]]. Patterns: [[tech-llm-gateway-byok-sibling]], [[tech-llm-gateway-quota-as-retryable]], [[tech-cloudflare-ai-gateway-transparent]], [[tech-workers-cache-enabled]].\nPortfolio: [[user-duyet-active-projects]]. Related products: [[project-agentstate]], [[project-anyworker]].", "project-anyworker-local-agent": "---\nname: project-anyworker-local-agent\ntitle: AnyWorker local agent + GUI\ndescription: \"Product path: Python agent server plus React GUI; web is separate marketing app\"\ntype: project\ncategory: agents\ntags: [project, anyworker, llm-agents]\nrelated: [\"[[project-anyworker]]\", \"[[project-agentstate]]\", \"[[user-duyet-ai-stance]]\"]\ncreated: 2026-08-10\nupdated: 2026-08-10\ntimestamp: 2026-08-10T18:00:00Z---\n\n[[project-anyworker]] splits **marketing Worker** (`apps/web`) from **local agent product** (`apps/anyworker` server + GUI).\n\nRelated: [[project-agentstate]], [[user-duyet-ai-stance]].", "project-anyworker": "github.com/duyet/anyworker \u00b7 https://anyworker.dev\n\nOpen \u201cAI that does the work\u201d product. Split: marketing Worker vs local agent+GUI ([[project-anyworker-local-agent]]).\n\npnpm monorepo; TanStack Start web ([[tech-tanstack-start-ssg]]). Related: [[project-agentstate]], [[project-anyrouter]].\nRelease: [[feedback-never-auto-merge-release-please]]. Portfolio: [[user-duyet-active-projects]].", "project-charts": "github.com/duyet/charts \u2014 public Helm charts, tested with KinD. Related: [[user-duyet-infra-kubernetes]], [[reference-duyet-github]].", "project-chmonitor-advisor": "chmonitor advisor mode is **recommend-only** \u2014 projections, skip indexes, partitions, MVs \u2014 never silent schema mutations.\n\nHub: [[project-clickhouse-monitoring]]. Safety culture: [[feedback-fail-loud]].", "project-clickhouse-monitoring": "github.com/chmonitor/chmonitor \u00b7 https://chmonitor.dev \u00b7 docs.chmonitor.dev\n\n**chmonitor** \u2014 ClickHouse operational advisor + real-time monitoring, MCP, AI chat. Advisor is recommend-only ([[project-chmonitor-advisor]]).\n\nOSS self-host and hosted Cloud from one product family ([[tech-one-codebase-oss-saas]], [[tech-single-source-env]]).\nFocus: [[user-duyet-focus-clickhouse]]. Portfolio: [[user-duyet-active-projects]].", "project-duyetbot": "duyetbot maintains [[project-monorepo]] within scope: code, design system, deploy config.\n\nOut of scope without human direction: authored blog posts and curated timeline research facts.\nLoops: [[tech-improvement-loop]], [[tech-agent-loop-cycle]]. Memory model: [[feedback-docs-driven-development]].", "project-homelab": "github.com/duyet/homelab \u2014 public personal homelab configs/experiments.\n\nRelated: [[user-duyet-homelab]], [[project-charts]], [[user-duyet-site-homelab]].\nKeep kb notes generic \u2014 no private inventory.", "project-kb-site": "Public site for [[project-kb]]. Graph + llms.txt endpoints for agents. Pattern: [[feedback-docs-driven-development]]. Link: [[user-duyet-site-kb]].", "project-kb": "github.com/duyet/kb \u2014 this repository. Protocol: AGENTS.md. Index: MEMORY.md. Graph: [[tech-okf-bundle]].\n\nPattern: [[feedback-docs-driven-development]]. Site: [[user-duyet-site-kb]] / [[project-kb-site]]. Scope: [[feedback-public-kb-only]].", "project-llm-timeline": "App in [[project-monorepo]]: https://llm-timeline.duyet.net \u2014 large static timeline (1950\u2013present).\n\nUses [[tech-tanstack-start-ssg]], [[tech-flat-design-hairline]]. Curated model data is human-owned research.", "project-monorepo": "github.com/duyet/monorepo \u2014 public web monorepo (blog, CV, timeline apps, shared packages).\n\nStack: Bun, Turborepo, TanStack Start SSG, Cloudflare Pages.\nRelated: [[project-llm-timeline]], [[project-duyetbot]], [[tech-tanstack-start-ssg]], [[tech-flat-design-hairline]].", "project-open-managed-agents": "github.com/duyet/oma \u00b7 https://oma.duyet.net \u00b7 docs: https://docs.oma.duyet.net\n\nOpen-source reimplementation of a **Managed Agents**-style API. Meta-harness: platform prepares tools/skills/sandbox/credentials; pluggable harness drives the model loop.\n\nRuns two ways: Cloudflare (Workers + Durable Objects) or self-host Node/`docker compose` \u2014 same business logic.\nInvariants: [[tech-oma-credentials-out-of-sandbox]], [[tech-prompt-cache-byte-sensitive]].\nRelease: [[feedback-never-auto-merge-release-please]]. Portfolio: [[user-duyet-active-projects]].", "reference-ai-sdk-uimessage": "Vercel AI SDK `UIMessage` = `{id, role, parts[], metadata?}`. Renderer switches on `part.type` and drops unknowns.\n\nNative tool parts: `dynamic-tool` / `tool-${name}` with `{state, input, output}`.\nSee [[tech-ai-sdk-history-dto-convert]], [[tech-ai-agent-stack]].", "reference-cloudflare-acquires-astro": "---\nname: reference-cloudflare-acquires-astro\ntitle: Cloudflare acquired Astro (2026)\ndescription: \"Jan 2026: Astro team joined Cloudflare; Flue agent framework context\"\ntype: reference\ncategory: industry\ntags: [reference, cloudflare, llm-agents]\nrelated: [\"[[tech-flue-register-in-initializer]]\", \"[[user-duyet-infra-cloudflare]]\"]\nsources: [\"https://blog.cloudflare.com/astro-joins-cloudflare/\"]\ncreated: 2026-08-10\nupdated: 2026-08-10\ntimestamp: 2026-08-10T12:00:00Z---\n\nCloudflare acquired The Astro Technology Company (announced 2026-01-16). Astro stays open source.\n\nFlue (`withastro/flue`) is from that team post-acquisition. Related: [[tech-flue-register-in-initializer]], [[user-duyet-infra-cloudflare]].", "reference-duyet-blog": "Themes by volume: ClickHouse \u00b7 Rust \u00b7 AI agents \u00b7 data eng (Airflow, DuckDB) \u00b7 tooling.\n\nSite: [[user-duyet-site-blog]]. Stance: [[user-duyet-ai-stance]]. Focus: [[user-duyet-focus-clickhouse]].", "reference-duyet-github": "---\nname: reference-duyet-github\ntitle: Notable public GitHub repos\ndescription: \"Catalog of notable public duyet/* and related OSS repos\"\ntype: reference\ncategory: projects\ntags: [reference, duyet, github]\nrelated: [\"[[user-duyet-github]]\", \"[[project-anyrouter]]\", \"[[project-clickhouse-monitoring]]\"]\nsources: [\"https://github.com/duyet\"]\ncreated: 2026-08-10\nupdated: 2026-08-10\ntimestamp: 2026-08-10T12:00:00Z---\n\nNotable public repos (non-exhaustive):\n\n| Area | Repos |\n|------|-------|\n| ClickHouse | [[project-clickhouse-monitoring]], `clickhouse-udf-rs` |\n| LLM / agents | [[project-anyrouter]], [[project-agentstate]], [[project-anyworker]], [[project-open-managed-agents]] |\n| Web | [[project-monorepo]], [[project-kb]] |\n| Homelab / infra | [[project-homelab]], [[project-charts]], `gaxy` |\n| Older popular | `bruteforce-database`, `pricetrack` |\n\nHub: [[user-duyet-github]]. Stack: [[user-duyet-stack]].", "tech-pin-github-actions": "Actions run with repo secrets. Prefer `@vX.Y.Z` or commit SHA pins; avoid floating `@v0`.\n\nIncident reference: trivy-action tags force-pushed (2026). Related: [[tech-trivy-two-phase]], [[feedback-public-kb-only]].", "tech-release-please-basics": "release-please maintains a release PR and CHANGELOG from conventional commits. Merging releases tags/publishes.\n\nPrefer release-published workflows over raw tag push to avoid duplicates. Related: [[tech-release-please-pr-title]], [[feedback-never-auto-merge-release-please]].", "tech-release-please-pr-title": "Invalid PR titles are silently dropped from bumps. Guard titles with the same commitlint config as local hooks.\n\nRelated: [[tech-release-please-basics]], [[feedback-semantic-commits]], [[tech-release-please-pre1-minor]].", "tech-release-please-pre1-minor": "In 0.x with `bump-patch-for-minor-pre-major: true`, plain `feat` \u2192 patch. Need `feat!:` or BREAKING CHANGE for minor.\n\nRelated: [[tech-release-please-basics]], [[tech-release-please-pr-title]].", "tech-trivy-two-phase": "Phase 1: scan with exit 0 for artifacts. Phase 2: fail on CRITICAL/HIGH, ideally reusing setup.\n\nRelated: [[tech-pin-github-actions]], [[tech-codebase-maintenance-loop]].", "tech-cloudflare-ai-gateway-transparent": "AI Gateway routes by provider/prefix and forwards model strings. \"Invalid model ID\" is usually upstream or unknown provider prefix.\n\nCustom providers: base URL + slug; model path appended. Related: [[project-anyrouter]], [[tech-llm-gateway-quota-as-retryable]].", "tech-cloudflare-pages-deploy": "Habit: commit \u2192 push \u2192 deploy the changed Pages app \u2192 verify HTTP 200.\n\nHazard: scripts that rename local env files mid-deploy must not run in parallel.\nRelated: [[tech-tanstack-start-ssg]], [[project-monorepo]], [[feedback-semantic-commits]].", "tech-forwardauth-preserve-status": "When Traefik forwardAuth + OAuth2 Proxy sit behind error middleware, ensure 302 challenges are not replaced by generic error pages.\n\nPattern: explicit redirect path for auth challenges. Generic edge auth lesson \u2014 no private hostnames.", "tech-workers-cache-enabled": "Workers Cache sits in front of a Worker. Enable: `cache: { enabled: true }` in wrangler.\n\nSafe default: only responses with explicit public `Cache-Control` are stored. Auth headers auto-bypass.\nSee [[tech-workers-cache-swr]], [[tech-workers-cache-hit-skips-cpu]].", "tech-workers-cache-hit-skips-cpu": "A cache HIT is served from the edge tier without invoking the Worker isolate.\n\nGreat for SSR-as-origin frameworks. Enable carefully with public CC only: [[tech-workers-cache-enabled]].", "tech-workers-cache-swr": "Use `Cache-Control: public, max-age=\u2026, stale-while-revalidate=\u2026` so users rarely wait on origin re-render.\n\nPair with [[tech-workers-cache-enabled]], [[tech-workers-cache-tags]].", "tech-workers-cache-tags": "Set `Cache-Tag` on responses; purge by tag after content updates.\n\nRelated: [[tech-workers-cache-enabled]], [[tech-workers-cache-swr]].", "tech-qdrant-config-at-create": "Don't assume live config edits always apply retroactively. Prefer correct create params; use `update_collection` when supported.\n\nRelated: [[tech-qdrant-hnsw-timeout]].", "tech-qdrant-hnsw-timeout": "---\nname: tech-qdrant-hnsw-timeout\ntitle: \"Qdrant: high-dim full scan timeouts\"\ndescription: Large float32 collections without HNSW/quantization can time out\ntype: tech\ncategory: databases\ntags: [tech, qdrant, vector, databases]\nrelated: [\"[[tech-qdrant-config-at-create]]\", \"[[tech-rag-metadata-key-drift]]\"]\ncreated: 2026-08-10\nupdated: 2026-08-10\ntimestamp: 2026-08-10T12:00:00Z---\n\nHigh-dimension float32 collections can devolve to expensive scans. Tune HNSW + consider INT8 quantization.\n\nConfig timing: [[tech-qdrant-config-at-create]]. Related: [[tech-rag-metadata-key-drift]].", "tech-agentstate-five-primitives": "[[project-agentstate]] exposes five fleet primitives: **states**, **leases**, **claims**, **capability tokens**, **conversations**.\n\nUse when multi-agent systems need shared state/locking/delegation without reinventing a backend.\nSee also [[tech-agentstate-not-a-framework]]. Related: [[tech-ai-agent-stack]], [[project-anyworker]].", "tech-agentstate-not-a-framework": "AgentState does **not** replace LangGraph/AI SDK/etc. It is the state/coordination layer agents call.\n\nRelated: [[project-agentstate]], [[tech-agentstate-five-primitives]], [[tech-ai-agent-stack]].", "tech-ai-agent-stack": "Common public stack pieces:\n\n| Piece | Role |\n|-------|------|\n| Vercel AI SDK | streaming UI + tools |\n| LangGraph / LangChain | graphs & chains |\n| Cloudflare Agents SDK | Workers + DO agents |\n| MCP | tool servers |\n| Flue / Hermes | agent runtimes |\n\nStance: [[user-duyet-ai-stance]]. Runtimes: [[tech-eve-filesystem-agents]], [[tech-hermes-custom-provider]], [[tech-hermes-steer-mode]], [[tech-hermes-dashboard-auth-gate]]. Projects: [[project-anyrouter]], [[project-agentstate]], [[project-anyworker]], [[project-open-managed-agents]], [[project-duyetbot]].", "tech-ai-sdk-history-dto-convert": "Map `tool-call`/`args`/`result` \u2192 `dynamic-tool` with `input`/`output` and correct `state`. Map annotations \u2192 `data-*` parts.\n\nKeep one endpoint for multiple clients until legacy dies. Related: [[reference-ai-sdk-uimessage]], [[tech-ai-sdk-uimessage-native-tools]].", "tech-ai-sdk-uimessage-native-tools": "Live streams use native part types; history DTOs often use `tool-call` + `annotations` and disappear on reload.\n\nConvert at the client boundary: [[tech-ai-sdk-history-dto-convert]]. Shape: [[reference-ai-sdk-uimessage]].", "tech-eve-filesystem-agents": "Filesystem-first agents keep prompts, memory, and tool config as files \u2014 greppable and PR-reviewable.\n\nAligns with [[feedback-docs-driven-development]]. Stack map: [[tech-ai-agent-stack]].", "tech-flue-register-in-initializer": "---\nname: tech-flue-register-in-initializer\ntitle: \"Flue: register providers in initializer\"\ndescription: Custom gateways must register from agent init with ctx.env; module load has empty env\ntype: tech\ncategory: agents\ntags: [tech, llm-agents, cloudflare]\nrelated: [\"[[reference-cloudflare-acquires-astro]]\", \"[[project-anyrouter]]\", \"[[tech-cloudflare-ai-gateway-transparent]]\"]\ncreated: 2026-08-10\nupdated: 2026-08-10\ntimestamp: 2026-08-10T12:00:00Z---\n\nFlue addresses models as `provider/model`. Register custom providers inside `defineAgent` initializer using `ctx.env`.\n\n`process.env` is empty at module load on workerd. Debug with Node target when errors hide. Related: [[reference-cloudflare-acquires-astro]], [[project-anyrouter]].", "tech-hermes-custom-provider": "Hermes-style agents: declare `custom_providers` then select `provider: custom` (or named id). Keep keys in env vars, not notes.\n\nRelated: [[tech-ai-agent-stack]], [[tech-cloudflare-ai-gateway-transparent]].", "tech-hermes-dashboard-auth-gate": "Generic lesson: localhost/insecure allowlists must not outrank real auth on exposed binds.\n\nPrefer explicit bind address + auth plugin order tests. Related: [[feedback-public-kb-only]], [[tech-forwardauth-preserve-status]].", "tech-hermes-steer-mode": "Steer mode: in-flight agent incorporates new user messages into the current task.\n\nRelated: [[tech-hermes-custom-provider]], [[tech-ai-agent-stack]].", "tech-llm-gateway-byok-sibling": "If user keys ride a platform backend path, add an explicit `-byok` (or equivalent) route before disabling that backend.\n\nLearned on multi-provider routers like [[project-anyrouter]]. Related: [[tech-llm-gateway-quota-as-retryable]].", "tech-llm-gateway-quota-as-retryable": "Some upstreams return `budget_exceeded` as HTTP 400. Classify as retryable/failover, not terminal client error.\n\nAlso: zero-byte full timeouts are terminal per backend per request \u2014 don't burn identical retries. See [[project-anyrouter]].", "tech-oma-credentials-out-of-sandbox": "Invariant for managed agent runtimes: tool sandboxes must not see raw credentials; an outbound proxy injects them.\n\nProject: [[project-open-managed-agents]]. Related: [[feedback-public-kb-only]].", "tech-prompt-cache-byte-sensitive": "Prompt caching keys on exact prefix bytes. Unstable timestamps, random IDs, or reordered system text kill hit rates.\n\nRelated: [[project-open-managed-agents]], [[tech-ai-agent-stack]].", "tech-rag-citation-guards": "Don't accept a citation because the URL exists. Require retrieved passage support for the claim.\n\nRelated: [[tech-rag-toc-pollution]], [[feedback-fail-loud]].", "tech-rag-metadata-key-drift": "If ingest writes `source_url` and query filters `url`, retrieval silently degrades.\n\nLock a schema; test filters. Related: [[tech-rag-toc-pollution]], [[tech-qdrant-config-at-create]].", "tech-rag-toc-pollution": "---\nname: tech-rag-toc-pollution\ntitle: \"RAG: TOC docs pollute retrieval\"\ndescription: Table-of-contents pages rank well but answer poorly \u2014 filter or downweight\ntype: tech\ncategory: rag\ntags: [tech, llm-agents, rag]\nrelated: [\"[[tech-rag-citation-guards]]\", \"[[tech-rag-metadata-key-drift]]\"]\ncreated: 2026-08-10\nupdated: 2026-08-10\ntimestamp: 2026-08-10T12:00:00Z---\n\nTOC/index pages often dominate vector search without answering the question.\n\nMitigate: exclude TOCs, chunk body-only, or metadata filters. Related: [[tech-rag-citation-guards]], [[tech-rag-metadata-key-drift]].", "tech-note-atomic": "Atomic = one concept per note, short body, dense wikilinks.\n\n**How to apply:** if >~25 lines or multiple independent claims, split. Index: MEMORY.md. See [[tech-note-frontmatter]], [[tech-okf-bundle]].", "tech-note-frontmatter": "Required: `name` (== filename), `description`, `type`, `tags`, `created`, `updated`, `timestamp` (ISO 8601).\n\nOptional: `title`, `category`, `aliases`, `related`, `sources`. No nested `metadata:`.\nLint: `kb lint`. Template: memory/_TEMPLATE.md. See [[tech-note-atomic]].", "tech-okf-bundle": "This repo follows an OKF-inspired layout: `memory/` concepts, generated `index.md`/`log.md`, required `timestamp`.\n\nTools: `kb gen` regenerates indexes + viz. Protocol: [[project-kb]], [[feedback-docs-kb-is-brain]].\nSpec pointer: https://github.com/GoogleCloudPlatform/knowledge-catalog", "tech-unit-suffix-vs-scale": "If a formatter shows `min`/`h`/`ms`, it must not convert magnitudes unless the multiplier is explicit.\n\nSmell: values that can never reach \"60 minutes\" if unit is wrong. Related: [[tech-flat-design-semantic-tokens]].", "tech-flat-design-hairline": "---\nname: tech-flat-design-hairline\ntitle: \"Flat design: hairline borders\"\ndescription: Prefer hairline borders over heavy shadows for public site UI\ntype: tech\ncategory: design\ntags: [tech, web, design]\nrelated: [\"[[tech-flat-design-semantic-tokens]]\", \"[[project-monorepo]]\"]\ncreated: 2026-08-10\nupdated: 2026-08-10\ntimestamp: 2026-08-10T12:00:00Z---\n\nFlat/hairline look: borders over drop shadows; lucide (or Phosphor) icons; dark mode supported.\n\nRelated: [[tech-flat-design-semantic-tokens]], [[project-monorepo]], [[project-llm-timeline]].", "tech-flat-design-semantic-tokens": "Prefer semantic tokens (`bg-card`, `text-muted-foreground`) so themes/dark mode stay coherent.\n\nRelated: [[tech-flat-design-hairline]], [[tech-shadcn-base]], [[tech-unit-suffix-vs-scale]].", "tech-kumo-rsc-createcontext": "If a UI kit uses `createContext` at import time, every importer may need `\"use client\"` (RSC).\n\nPrefer kits that stay server-safe or isolate client entrypoints. Related: [[tech-shadcn-base]].", "tech-og-images-build-time": "One registry feeds both image generation (e.g. Satori) and route head links. Avoid dual sources of truth.\n\nRelated: [[tech-og-meta-in-prerender]], [[tech-tanstack-start-ssg]].", "tech-og-meta-in-prerender": "Put OG/Twitter meta into prerendered HTML. Client-only `useEffect` head injection is invisible to most crawlers.\n\nRelated: [[tech-og-images-build-time]], [[tech-tanstack-start-ssg]].", "tech-rust-wasm-when": "---\nname: tech-rust-wasm-when\ntitle: When Rust WASM is worth it\ndescription: \"WASM usually wins only when the TS path is >~1ms hot work\"\ntype: tech\ncategory: web\ntags: [tech, web, rust, wasm]\nrelated: [\"[[tech-wasm-prerender-ci]]\", \"[[user-duyet-lang-rust]]\", \"[[project-monorepo]]\"]\ncreated: 2026-08-10\nupdated: 2026-08-10\ntimestamp: 2026-08-10T12:00:00Z---\n\nPrefer TypeScript for most UI/data shaping. Use Rust\u2192WASM when profiling shows >~1ms hot paths.\n\nCI trap: [[tech-wasm-prerender-ci]]. Language context: [[user-duyet-lang-rust]].", "tech-shadcn-base": "Default component kit for public apps: shadcn/ui with CVA variants. Pair with [[tech-flat-design-semantic-tokens]].\n\nUsed in [[project-anyrouter]], [[project-monorepo]]. RSC pitfall: [[tech-kumo-rsc-createcontext]].", "tech-tanstack-stale-chunks": "After deploy, old tabs may request deleted lazy chunks \u2192 runtime error on `component`.\n\nMitigations: soft reload on chunk load failure; keep critical shells prerendered. See [[tech-tanstack-start-ssg]], [[project-anyrouter]].", "tech-tanstack-start-ssg": "Prerender routes to static HTML so crawlers and edge hosts see real content without relying on client JS alone.\n\nPairs with [[tech-og-meta-in-prerender]], [[tech-tanstack-stale-chunks]], [[tech-cloudflare-pages-deploy]].\nUsed by [[project-monorepo]], [[project-llm-timeline]].", "tech-wasm-prerender-ci": "SSG pipelines that import WASM must build release WASM in CI before prerender. Silent empty pages are worse than hard fail.\n\nRelated: [[tech-rust-wasm-when]], [[tech-tanstack-start-ssg]], [[tech-cloudflare-pages-deploy]].", "tech-agent-loop-cheap-subagents": "Mechanical PR fixes and checklist reviews \u2192 cheaper models. Hard architecture stays on the main/high tier.\n\nPolicy: [[feedback-cheap-models-subagents]]. Cycle: [[tech-agent-loop-cycle]].", "tech-agent-loop-cycle": "Pattern: recurring cycle scans open PRs/issues, classifies, dispatches workers, merges when safe.\n\nCost control: [[tech-agent-loop-cheap-subagents]]. Related: [[project-duyetbot]], [[feedback-never-auto-merge-release-please]].", "tech-codebase-maintenance-loop": "Priority order often: build > tests > lint > deploy > quality > features.\n\nSafe dead-code removal only with proof. Related: [[tech-improvement-loop]], [[feedback-logic-change-update-tests]], [[project-duyetbot]].", "tech-improvement-loop": "Loop: pick highest priority \u2192 implement \u2192 lint/test/build \u2192 commit \u2192 deploy \u2192 log.\n\nPersona: [[project-duyetbot]]. Deploy: [[tech-cloudflare-pages-deploy]]. Cheap fan-out: [[feedback-cheap-models-subagents]].", "tech-one-codebase-oss-saas": "Pattern: single high-level deployment mode (`oss|cloud`) that resolves auth/storage defaults. Unset/junk \u2192 OSS so open source never degrades.\n\nNever gate core product features behind cloud-only. Example product: [[project-clickhouse-monitoring]]. Env: [[tech-single-source-env]].", "tech-single-source-env": "Dual sources (hand-maintained wrangler vars vs Vite `VITE_*`) drift silently. Canonical names \u2192 derive client + deploy targets.\n\nSecrets never in committed env files. Related: [[tech-one-codebase-oss-saas]], [[feedback-public-kb-only]].", "tech-tmux-pane-labels": "Use tmux `pane-current-command` \u2192 icon mapping so multi-agent sessions are glanceable.\n\nGeneric DX only \u2014 no hostnames. Related: [[user-duyet-local-dev]], [[user-duyet-ai-claude-code]].", "user-duyet-active-projects": "Duyet builds **many products in parallel** (not single-app focus).\n\n| Area | Projects |\n|------|----------|\n| ClickHouse | [[project-clickhouse-monitoring]] |\n| LLM / agents | [[project-anyrouter]] \u00b7 [[project-agentstate]] \u00b7 [[project-anyworker]] \u00b7 [[project-open-managed-agents]] \u00b7 [[project-duyetbot]] |\n| Personal / platform | [[project-monorepo]] \u00b7 [[project-kb]] \u00b7 [[project-llm-timeline]] \u00b7 [[user-duyet-homelab]] \u00b7 [[project-charts]] |\n\nAlso: [[user-duyet-multi-project]], [[feedback-disambiguate-repo]], [[reference-duyet-github]], [[user-duyet-ai-stance]].", "user-duyet-ai-claude-code": "Claude Code is the daily driver after trying many tools. Tools remain disposable \u2014 [[user-duyet-ai-tools-disposable]]. Index: [[user-duyet-ai-stance]].", "user-duyet-ai-stance": "AI practice index:\n\n- [[user-duyet-ai-vibe-codes]] \u2014 agents drive production work\n- [[user-duyet-ai-claude-code]] \u2014 Claude Code as daily driver\n- [[user-duyet-ai-tools-disposable]] \u2014 tools change; don't lock dogma\n- [[tech-ai-agent-stack]] \u2014 SDK ecosystem\n- [[project-duyetbot]] \u2014 autonomous monorepo agent persona\n\nRelated: [[user-duyet-focus-llm-agents]], [[feedback-docs-driven-development]].", "user-duyet-ai-tools-disposable": "Do not enshrine one IDE/agent forever. Prefer portable patterns: [[feedback-docs-driven-development]], [[tech-ai-agent-stack]].", "user-duyet-ai-vibe-codes": "---\nname: user-duyet-ai-vibe-codes\ntitle: Vibe-codes production\ndescription: \"Public stance: agents write most production code; Markdown tops Wakatime\"\ntype: user\ncategory: ai\ntags: [user, duyet, llm-agents, coding-agents]\nrelated: [\"[[user-duyet-ai-stance]]\", \"[[feedback-docs-driven-development]]\"]\ncreated: 2026-08-10\nupdated: 2026-08-10\ntimestamp: 2026-08-10T12:00:00Z---\n\nPublic practice: vibe-codes for production; agents write more than hand-typed code. See [[user-duyet-ai-stance]], [[feedback-docs-driven-development]].", "user-duyet-data-clickhouse": "---\nname: user-duyet-data-clickhouse\ntitle: \"Data: ClickHouse\"\ndescription: ClickHouse as primary analytics engine in public work\ntype: user\ncategory: stack\ntags: [user n-pin-github-actions", "target": "tech-release-please-squash-pipeline"}}, {"data": {"id": "tech-tanstack-stale-route-chunks__project-anyrouter", "source": "tech-tanstack-stale-route-chunks", "target": "project-anyrouter"}}, {"data": {"id": "tech-tanstack-stale-route-chunks__tech-cloudflare-pages-deploy", "source": "tech-tanstack-stale-route-chunks", "target": "tech-cloudflare-pages-deploy"}}, {"data": {"id": "tech-tanstack-stale-route-chunks__tech-tanstack-start-ssg", "source": "tech-tanstack-stale-route-chunks", "target": "tech-tanstack-start-ssg"}}, {"data": {"id": "tech-tanstack-start-ssg__project-duyet-net", "source": "tech-tanstack-start-ssg", "target": "project-duyet-net"}}, {"data": {"id": "tech-tanstack-start-ssg__tech-cloudflare-pages-deploy", "source": "tech-tanstack-start-ssg", "target": "tech-cloudflare-pages-deploy"}}, {"data": {"id": "tech-tanstack-start-ssg__tech-rust-wasm-prerender", "source": "tech-tanstack-start-ssg", "target": "tech-rust-wasm-prerender"}}, {"data": {"id": "tech-tmux-pane-status-labels__tech-agent-loop-autonomous-pr-management", "source": "tech-tmux-pane-status-labels", "target": "tech-agent-loop-autonomous-pr-management"}}, {"data": {"id": "tech-traefik-forwardauth-oauth2-proxy__user-duyet-stack", "source": "tech-traefik-forwardauth-oauth2-proxy", "target": "user-duyet-stack"}}, {"data": {"id": "user-duyet-ai-stance__feedback-docs-driven-development", "source": "user-duyet-ai-stance", "target": "feedback-docs-driven-development"}}, {"data": {"id": "user-duyet-ai-stance__user-duyet-profile", "source": "user-duyet-ai-stance", "target": "user-duyet-profile"}}, {"data": {"id": "user-duyet-ai-stance__user-duyet-stack", "source": "user-duyet-ai-stance", "target": "user-duyet-stack"}}, {"data": {"id": "user-duyet-profile__feedback-working-style", "source": "user-duyet-profile", "target": "feedback-working-style"}}, {"data": {"id": "user-duyet-profile__user-duyet-stack", "source": "user-duyet-profile", "target": "user-duyet-stack"}}, {"data": {"id": "user-duyet-profile__user-duyet-web-presence", "source": "user-duyet-profile", "target": "user-duyet-web-presence"}}, {"data": {"id": "user-duyet-stack__user-duyet-profile", "source": "user-duyet-stack", "target": "user-duyet-profile"}}, {"data": {"id": "user-duyet-stack__user-duyet-web-presence", "source": "user-duyet-stack", "target": "user-duyet-web-presence"}}, {"data": {"id": "user-duyet-web-presence__user-duyet-profile", "source": "user-duyet-web-presence", "target": "user-duyet-profile"}}, {"data": {"id": "user-duyet-web-presence__user-duyet-stack", "source": "user-duyet-web-presence", "target": "user-duyet-stack"}}], "bodies": {"feedback-cheap-models-subagents": "When dispatching sub-agents (Agent tool) or Workflow agents \u2014 especially in\nbatch/parallel fan-out (e.g. babysitting/fixing/merging many PRs at once) \u2014\ndefault them to a **cheaper model** (`sonnet`, or `haiku` for trivial/mechanical\nwork) rather than inheriting Opus.\n\n**Why:** Opus across many concurrent agents is expensive and usually overkill for\nmechanical, well-scoped work (fix-CI-then-merge, search, refactor-to-spec). Duyet\nflagged cost during a 13-agent parallel PR batch.\n\n**How to apply:**\n- Pass `model: \"sonnet\"` on `Agent` calls; `opts.model` in Workflow scripts.\n- Use `haiku` for trivial/mechanical tasks; reserve **Opus** for genuinely complex\n  reasoning the main loop handles.\n- Don't restart already-running agents just to switch model \u2014 only apply to new\n  dispatches.", "feedback-docs-driven-development": "Duyet's core agent-collaboration pattern (from his blog, \"Docs-Driven Development\"):\n\n- **`CLAUDE.md`/`AGENTS.md` stays tiny** \u2014 short, stable rules + a router pointing\n  at the right doc. Cramming architecture/feature contracts in there rots the file.\n- **A versioned, grep-able `kb` is the brain** \u2014 structured by the question being\n  asked; the same docs serve Duyet, teammates, and every coding agent.\n- **Make read/write reflexive, phrased as triggers not requests:** read the index\n  on the way *in* (before answering anything non-trivial), write back on the way\n  *out* (before forgetting). \"Remember to write docs\" doesn't work \u2014 triggers do.\n\n**Why:** rules-in-prompt evaporate between sessions; a structured external brain\npersists and is reviewable in a PR.\n\n**How to apply:** this is exactly the model this repo implements \u2014 read `MEMORY.md`\nfirst, grep `memory/`, write durable facts back automatically. Don't bloat the\nrouter files; put knowledge in notes.", "feedback-working-style": "Working preferences for agents collaborating with [[user-duyet-profile]].\n\n- **Language:** respond in English. (Vietnamese is native, but English is the\n  default for work.)\n- **Communication:** concise, evidence over assumption, no filler words like\n  \"comprehensive/extensive\". Surface tradeoffs and uncertainty; don't hide confusion.\n- **Code:** simplest solution that works. No speculative abstractions, no\n  features beyond what was asked. Surgical changes \u2014 touch only what's needed.\n- **Commits:** semantic format, consistent scope, simple English.\n- **Autonomy:** comfortable with `/loop` for recurring maintenance; values\n  non-disruptive operations (never destructive actions without explicit ask).\n\n**Why:** Duyet is a senior engineer who optimizes for maintainability and low\nnoise; over-engineering and verbosity waste his time.\n\n**How to apply:** default to less code and fewer words; ask before big or\nirreversible moves; match the existing codebase's conventions.", "project-anyrouter": "github.com/duyet/anyrouter \u2014 OpenAI-compatible LLM router: one API, many providers, BYOK, presets, failover.\n\n## Stack & deploy\n\n| Layer | Choice |\n|-------|--------|\n| App | TanStack Start + React, SSR on Cloudflare Workers |\n| UI | shadcn/ui (Tailwind v4, semantic tokens) + Phosphor icons \u2014 Kumo fully removed 2026-07 |\n| API | Separate `anyrouter-api` worker via service binding (3 MiB budget split) |\n| Deploy | `pnpm cf:deploy` \u2192 `pnpm ops deploy` (secrets, D1 migrate, build, deploy, prerender, purge) |\n| Docs | Customer docs in `src/content/docs/`; maintainer kb in `docs/kb/` |\n\n## Public routes (2026-06-14)\n\n- `/pricing` \u2014 Free / Pro / Team tiers (Kumo cards)\n- Homepage **LLM API Gateway** diagram: `src/components/home-sections/gateway-section.tsx` (clients \u2192 AnyRouter hub \u2192 providers)\n- Subdomain shortcuts: `pricing.anyrouter.dev` \u2192 `/pricing`, etc. (`src/worker.ts`)\n\n## Ops habits\n\n- Post-task: deploy + commit only touched paths (`git add` specific files, never `-A`)\n- Smoke: `pnpm e2e:test:prod` after deploy\n- Internal kb auto-updated under `docs/kb/` for non-trivial fixes\n\n**Why:** Agents working across repos need the deploy split, file locations, and stale-chunk trap without re-discovering from scratch.\n\n**How to apply:** Read `docs/kb/` + `AGENTS.md` in repo before coding; use Kumo docs-first; route all upstreams through CF AI Gateway.\n\n## Gateway-ops lessons (2026-07-16 autonomous issue sweep)\n\n- **CF AI Gateway unified billing can hard-zero**: error `{\"code\":2021,\"httpCode\":402,\"message\":\"Insufficient balance; add money to your gateway or use BYOK\"}` takes down every model whose only platform route is the unified `cloudflare` backend. No code fix \u2014 top up or wire a fallback platform upstream per popular model.\n- **LiteLLM-style resellers bury quota exhaustion in HTTP 400** (`{\"type\":\"budget_exceeded\",\"message\":\"ExceededBudget: ...\"}`). Routers must classify those 400s like 402/429 (fall through to next candidate), not as terminal client errors.\n- **Disabling a platform backend silently kills BYOK through it** \u2014 if user keys inject via the platform backend, add a `-byok` sibling BEFORE disabling (anyrouter's z-ai precedent; the openai/deepinfra disable missed this and broke OpenAI-key BYOK for a day).\n- **Every new backend has a registration checklist** (logo alias, byok provider map, schema-registry dialect row, intentional-free allowlist, regen). Drift tests that enumerate the registry are what catch skipped steps \u2014 worth building in any config-driven router.\n- **A full network timeout (zero bytes) is terminal per backend per request** \u2014 retrying the same origin just burns another 60s.", "project-chmonitor-one-codebase-saas": "chmonitor (open-source ClickHouse monitoring dashboard) ships BOTH the\nself-hosted (OSS) product and the hosted Cloud SaaS (dash.chmonitor.dev) from ONE\ncodebase. The difference is purely runtime config behind a fail-closed flag chain:\n`CHM_DEPLOYMENT_MODE=oss|cloud` is the single high-level switch that resolves\ndefaults for cloud mode, auth provider (Clerk), public read, and per-user D1\nstorage \u2014 unset/junk resolves to self-hosted, so OSS is never degraded.\n\n- **Cloud mode on:** env hosts become a public read-only demo; signed-in users\n  get a clean per-user workspace (connect their own ClickHouse); zero hosts \u2192\n  welcome/setup page. Billing via Polar (webhook \u2192 D1 \u2192 plan resolution, fails\n  open to Free for OSS).\n- **Self-hosted:** env hosts are the operator's real hosts, full access, no demo.\n  Invariant: never gate a core monitoring feature behind cloud mode.\n- **Connect-a-host errors** are classified into kinds (SSRF/host-not-allowed,\n  invalid URL, auth failed, DNS, refused, TLS, timeout) \u2192 title + cause + fix +\n  per-kind docs link.\n\n**Reusable env pattern (the durable lesson):** centralize all non-secret config\nto committed `.env` files as the SINGLE source of truth, consumed by BOTH the\nclient build and the server/worker runtime.\n\n**Why:** dual build-time vs runtime var sources (a Vite-inlined client flag vs a\nWorker runtime var) silently drift \u2014 a flag set only at build time but read at\nruntime breaks features in prod with no error at build.\n**How to apply:** one canonical name per setting; derive the client-inlined\n`VITE_*` from the canonical server `CHM_*` in the bundler config; generate the\ndeploy target's vars from the same `.env` file; never keep a second\nhand-maintained copy (e.g. wrangler `[vars]`). Same names work for Docker\n(`env_file`) and Helm (values \u2192 ConfigMap). Secrets stay out of committed `.env`.", "project-clickhouse-monitor": "github.com/chmonitor/chmonitor (moved from duyet/clickhouse-monitoring) \u2014 flagship ClickHouse ops UI. Monorepo on **pnpm 10** with isolated per-app workspaces (root workspace covers only `apps/mcp` + `packages/*`); **bun is the test runner only**, never the package manager.\n\n## Apps (Cloudflare Workers)\n\n| App | Role | URL |\n|-----|------|-----|\n| `apps/dashboard` | TanStack Start dashboard (the product) | dash.chmonitor.dev |\n| `apps/landing` | marketing site | chmonitor.dev |\n| `apps/docs` | **Fumadocs** on TanStack Start (content synced from `docs/content/`) | docs.chmonitor.dev |\n| `apps/blog` | blog | blog.chmonitor.dev |\n| `apps/mcp` | MCP server | dash.chmonitor.dev/api/mcp |\n| `apps/bug-handler` | Email Worker: Sentry alert emails \u2192 GitHub issues | bug@chmonitor.dev |\n| `apps/cloud-hooks` | Cloud ops Worker: Polar webhook + Telegram notifications + crons | hooks.chmonitor.dev |\n\n## Current state (2026-08)\n\n- **Cloud SaaS live**: Clerk auth, per-user D1 connections, Polar billing, `CHM_DEPLOYMENT_MODE=oss|cloud` (fail-closed to OSS) \u2014 see [[project-chmonitor-one-codebase-saas]].\n- **Published image:** `ghcr.io/chmonitor/chmonitor` (not the old `ghcr.io/duyet/chmonitor` path). Helm chart: `https://charts.chmonitor.dev`.\n- **Public dash vs self-host:** `dash.chmonitor.dev` is Cloud/demo (limited); private homelab k3s runs a full-cluster instance \u2014 see [[lessons-chmonitor-homelab-deploy]].\n- **AI agent**: Vercel AI SDK (not LangGraph), ~29 lean tools + skill recipes; AI Insights engine (collect\u2192enrich\u2192persist, stable-key dismissal).\n- **Health alerting**: dual dispatch worlds (client polling + server cron sweep), adapters (webhook/Slack/PagerDuty/Opsgenie/email), D1 routing/maintenance/ack/history; expansion epic chmonitor#2669 (Telegram/ntfy/Teams/quiet-hours/digest/smart rule suggestions).\n- **Design system**: OKLCH tokens + shadcn (Base UI), `product-design` project skill is the source of truth; smart-detection \"section-returns-null\" pattern for conditional dashboard sections.\n- Dev knowledge lives in-repo at `docs/knowledge/` (linked knowledge graph, ~25 notes) \u2014 read that first when working in the repo.\n\n**Why:** agents touching chmonitor need the right app paths, package manager, and the OSS/Cloud invariant before editing.\n**How to apply:** dashboard work \u2192 `apps/dashboard` (see its CLAUDE.md); `pnpm` for everything except `bun test`; never gate core monitoring features behind cloud mode; verify with `pnpm run build` + `pnpm run lint`.", "project-duyet-net": "`duyet/monorepo` \u2014 Bun + Turborepo hosting all of [[user-duyet-profile]]'s public\nweb apps + shared packages. Most apps are TanStack Start SSG on Cloudflare Pages\n(see [[tech-tanstack-start-ssg]], [[tech-cloudflare-pages-deploy]]).\n\n**Apps** (subdomains of duyet.net), with pre-rendered page counts:\n- `blog` (393) \u2014 TanStack Start SSG, WASM markdown, isomorphic `readPublicJson`.\n- `llm-timeline` (3700+) \u2014 see [[project-llm-timeline]].\n- `insights` (22) \u2014 AI/Claude usage analytics from CCUsage data.\n- `home` (4), `cv` (2), `photos` (2), `homelab` (1), `ai-percentage` (1).\n- `agents` \u2014 the **only** Vite SPA left; D1 Pages Functions block SSG. See [[project-duyetbot]].\n\n**Shared packages:** `components` (design system), `libs` (WASM bindings re-export),\n`wasm` (compiled Rust crates), `data-sync`, `api`, `config`, `urls`.\n\n**Design:** flat/hairline design system \u2014 see [[tech-flat-design-system]]. Palette\nvaries per app (blog white `#ffffff`, others warm cream `#fbf7f0`).\nWASM strategy: [[tech-rust-wasm-prerender]]. Maintained autonomously by [[project-duyetbot]].", "project-duyetbot": "duyetbot \u2014 the autonomous Claude Code agent persona that maintains [[project-duyet-net]].\n\n**Scope (can change without asking):** codebase, look-and-feel, deployment \u2014\nlayout, components, design tokens, deps, build/deploy config, landing-page copy.\n**Out of scope (needs human direction):** blog post content (`apps/blog/_posts/**`)\nand LLM Timeline curated data \u2014 those are Duyet's authored words/research facts.\n\n**Autonomous loops:**\n- **Improvement loop** (`/loop` or one-shot `claude -p`): measure \u2192 fix top-priority issue \u2192 verify (lint+test+build) \u2192 commit \u2192 background-deploy \u2192 log. Priority order: build > tests > lint > deploy > code quality > features. See [[tech-cloudflare-pages-deploy]].\n- **PR management loop** (`/agent-loop:resume`): runs continuously every 15 min, triages all open PRs, dispatches cheap subagents (Sonnet/Haiku) for reviews/fixes/merges. See [[tech-agent-loop-autonomous-pr-management]].\n\n**Memory hierarchy** (most\u2192least durable): commit messages \u2192 kb articles \u2192 durable\nfindings doc \u2192 session memory `.md` snapshots \u2192 transcript. Memory files are\npoint-in-time, may be stale \u2014 verify against code before acting. This is the\n[[feedback-docs-driven-development]] model. Auto-compaction welcomed; save\nto-remember context before it. Commits add a duyetbot co-author trailer.", "project-infra-optimization": "# Infra Optimization Baseline (2026-06-13)\n\n**Goal**: optimize resources, reduce complexity, fix security issues on duet-ubuntu k3s cluster.\n\n## Results\n\n| Metric | Before | After | Delta |\n|--------|--------|-------|-------|\n| Memory | 10Gi (78%) | 9.2Gi (70%) | **-1.7Gi** |\n| Disk | 372G (86%) | 363G (84%) | **-9GB** |\n| Swap files | 2 (16G) | 1 (11G) | -4G file |\n| CrashLoop pods | 1 | 0 | fixed |\n| Services without limits | cert-manager | 0 | all limited |\n| Kubeconfig perms | 644 world-readable | 640/600 | secured |\n\n## What Changed\n\n### Resource optimization (all services)\n- Key principle: set requests based on actual usage, limits at 1.5-2x peak\n- Hermes: memory limit raised 1Gi \u2192 2Gi (was being exceeded at 1212Mi)\n- PeerDB: massive over-provisioning fixed \u2014 temporal 512\u2192128Mi, flow-worker 512\u2192128Mi, total req ~1.9Gi \u2192 736Mi\n- Home Assistant: CPU limit 2 \u2192 500m (only using 10m actual)\n- Open-WebUI: memory limit 1536Mi \u2192 1Gi, CPU limit 1 \u2192 500m\n- LiteLLM: memory limit 1536 \u2192 1200Mi\n- ClickHouse: memory limit 2Gi \u2192 1536Mi, CPU limit 1 \u2192 500m\n- n8n + worker: memory limits 1Gi \u2192 512Mi\n- Portainer, Qdrant, Promptfoo, Vito, Chmonitor: all tightened\n- cert-manager: added limits to all 3 components (previously unlimited)\n\n### Security\n- Kubeconfig: `/etc/rancher/k3s/k3s.yaml` mode 640, user copy `$HOME/.kube/config.duet-homelab` mode 600\n- All Makefiles and docs updated to use new KUBECONFIG path\n- Docker daemon stopped, disabled, masked (k3s uses containerd)\n\n### Host cleanup\n- Journal logs vacuumed 876MB \u2192 100MB cap\n- Old kernel 6.8.0-110-generic removed\n- Swap consolidated: removed `/swap.img` (4G), kept `/swapfile2` (11G)\n- Failed systemd units masked: NetworkManager-wait-online, systemd-networkd-wait-online\n\n### Firecrawl fix\n- nuq-worker disabled (CrashLoopBackOff \u2014 missing NUQ cloud config, not needed for homelab)\n- Added `{{- if .Values.nuqWorker.enabled }}` guard to deployment template\n\n## Repo: `~/project/infra` (duyet/infra)\n\n**Why**: baseline for future optimization rounds. Re-run `kubectl top pods -A` to compare.\n**How to apply**: resource tuning is iterative \u2014 always measure actual usage before adjusting.", "project-kb-duyet-net": "kb.duyet.net \u2014 Duyet's public knowledge base, the rendered front-end of this\nshared brain.\n\n- **Old form:** an `apps/kb` app inside [[project-duyet-net]] \u2014 markdown articles\n  with frontmatter (category/tags/links/summary), graph view at `/graph`, machine\n  index at `/llms.txt` + `/llms-full.txt`, raw article at `/k/<slug>.md`.\n- **Now:** that monorepo app is being **replaced by THIS repo** (the shared brain).\n  The site renders the kb (including client-side full-text search, RSS, and sitemap)\n  and also serves `/scripts/bootstrap.sh` for new-device setup.\n\nEmbodies [[feedback-docs-driven-development]]: synthesized, graph-connected,\ngrep-able notes \u2014 the durable form of agent memory, distinct from point-in-time\nsession snapshots. Maintained by [[project-duyetbot]]. The 32 long-form source\narticles seeding this brain came from the old monorepo `apps/kb`.", "project-llm-timeline": "`apps/llm-timeline` ([[project-duyet-net]]) \u2014 timeline of LLM models 1950\u20132026,\n3700+ pre-rendered pages. Reference implementation for the flat/shadcn design\n(PR #1003): all `shadow-*` removed, semantic tokens only, vertical stat-card grids.\n\n**Data** (built into pages at build time, `pnpm run sync`, no runtime API):\n- Curated: ~785 models from Google Sheets, hand-maintained by Duyet (out of\n  scope for [[project-duyetbot]] \u2014 research facts + citations).\n- Epoch AI: ~3156 models (extended range back to 1950).\n- Deduped to ~3937 unique (last sync 2026-03-25).\n\n**Tech:** warm cream palette; `@tanstack/react-virtual` `useWindowVirtualizer`\nfor the scroll; WASM normalizer crate via `initSync` (kept for consistency though\nnot faster \u2014 see [[tech-rust-wasm-prerender]]); badge variants replace\ncolor-lookup functions. Design conventions: [[tech-flat-design-system]].", "project-open-managed-agents": "- What: open-source reimplementation of the Claude Managed Agents API. Meta-harness: platform (SessionDO Durable Object) prepares tools/skills/sandbox/credentials; a pluggable harness drives the model loop.\n- Runs two ways from one business logic: Cloudflare (Workers + DO + Containers) and self-host Node (`docker compose`, `apps/main-node`). pnpm monorepo (`apps/*`, `packages/*`).\n- Prod: `app.oma.duyet.net`. Deploys via GitHub Actions (`deploy-main` / `deploy-agent` / `deploy-docs` / `deploy-website` / `deploy-integrations`) on push to main, with post-deploy health assert (#245).\n- CI: `typecheck` blocks PRs; 3-suite test gate (workers-pool root vitest \u2192 node-pool packages \u2192 console) blocking since #246. Local gate before push: `pnpm typecheck && pnpm test`.\n- Key invariants: credentials never enter the sandbox (outbound proxy injects); prompt cache is byte-sensitive; internal packages ship raw .ts (no build).\n- Maintenance style: autonomous issue runs \u2014 batch triage open issues, fix in parallel branches/worktrees, squash-merge PRs `(#NNN)`, file follow-up issues for anything found.\n\n**Why:** recurring project \u2014 agents return to it for autonomous maintenance runs; conventions are strict and documented in-repo.\n**How to apply:** read repo `CLAUDE.md` + `AGENTS.md` first; never auto-merge release-please PRs; push over HTTPS (SSH:22 blocked on this network); required boot secrets `BETTER_AUTH_SECRET` + `PLATFORM_ROOT_SECRET`.", "lessons-chmonitor-homelab-deploy": "# Lessons \u2014 chmonitor on homelab k3s\n\n## Two different instances (do not conflate)\n\n| Instance | Purpose | Data |\n|----------|---------|------|\n| **Public Cloud/demo** (`dash.chmonitor.dev`) | SaaS + limited public demo | Limited tables, intentionally constrained |\n| **Homelab self-host** (private Traefik + OAuth) | Full cluster ops UI | All DBs/schemas; expected higher metrics volume |\n\nHomelab is supposed to \u201cshow more performance\u201d \u2014 that is normal, not a bug vs public.\n\n## Image (2026-08)\n\n- **Canonical:** `ghcr.io/chmonitor/chmonitor:latest` (`imagePullPolicy: Always`)\n- **Stale:** `ghcr.io/duyet/chmonitor:latest` \u2014 no longer receives CI builds; redeploy pulls same old digest forever\n- Helm chart repo: `https://charts.chmonitor.dev` (chart `chmonitor`); source repo moved to `chmonitor/chmonitor`\n\n## ClickHouse user for the dashboard\n\n- Use a **dedicated user** with **privilege-based** read-only: `GRANT SELECT, SHOW, dictGet ON *.*` (or narrower), not the server **`readonly` settings profile** (`readonly=1`).\n- chmonitor always sets **`max_execution_time`** as a **session setting** on the client. With `readonly=1` ClickHouse returns:\n\n  ```text\n  Cannot modify 'max_execution_time' setting in readonly mode\n  ```\n\n  \u2192 `/api/healthz` fails \u2192 readiness 503 \u2192 pod never Ready.\n- Prefer a normal/`monitoring` profile + grants. Homelab pattern: user `chmonitor` + role with SELECT/SHOW on all DBs.\n\n## Auth (homelab)\n\n- Behind Traefik **forwardAuth** + oauth2-proxy (GitHub via Dex). See [[tech-traefik-forwardauth-oauth2-proxy]].\n- chmonitor-scoped middleware stamps a **shared secret** header (`X-Chm-Proxy-Secret`); app trusts identity headers only when secret matches (`CHM_AUTH_PROVIDER=proxy` or `trusted` depending on image).\n- Unauthenticated external hit \u2192 **302** to the auth portal is expected.\n\n## Ops checklist\n\n1. Confirm image is `ghcr.io/chmonitor/chmonitor:\u2026` and pull/restart after new builds.\n2. Confirm CH user can run `SELECT 1 SETTINGS max_execution_time = 60`.\n3. Confirm `/api/healthz` reports host `up` and tables/overview APIs return full schema count.\n4. Do not use public-demo connection limits as the model for homelab grants.\n\n**Why:** future agents diagnose \u201cchmonitor down\u201d or \u201cempty schemas\u201d without mixing public SaaS and private cluster, and avoid the readonly-profile trap.\n**How to apply:** when redeploying or debugging homelab chmonitor, check image org + CH profile first; grant schema via SQL privileges, not `readonly=1`.", "project-self-driven-homelab": "# The Self-Driving Homelab\n\nA single-node k3s cluster that largely runs itself. An AI agent named Minh lives inside it, reachable by Telegram, and maintains the infrastructure it depends on.\n\n## The Setup\n\n**Hardware**: One self-hosted machine \u2014 16 CPU, 13Gi RAM, 457G NVMe.\n\n**Stack**: k3s (single-node, containerd), Traefik ingress, Let's Encrypt TLS via Cloudflare DNS-01, GitHub OAuth for auth. 15 services across 14 namespaces. All config versioned in git.\n\n**Services**: n8n (workflows), LiteLLM (LLM proxy), Open WebUI (chat UI), Home Assistant (smart home), ClickHouse (analytics DB), Qdrant (vectors), PeerDB (CDC replication), Firecrawl (web scraping), Portainer, and others. All behind OAuth.\n\nNothing exotic. Standard homelab stuff. The interesting part is *who runs it*.\n\n## Minh \u2014 The Agent That Lives Inside\n\nMinh is an instance of [Hermes](https://github.com/duyet/charts) \u2014 an open-source AI agent framework packaged as a Helm chart. She runs as a pod in the cluster with two containers: the agent itself and a Chromium sidecar for browser automation.\n\n**Reach**: You talk to Minh via Telegram (`@minh_duni_bot`). She speaks Vietnamese by default, switches to English when you write in English. One language per reply.\n\n**Brain**: Backed by `@preset/hermes-agent` through [AnyRouter](https://anyrouter.dev), with fallback to Gemini Flash and Claude Sonnet via OpenRouter. She has persistent memory (SOUL.md + session state on a PVC), so she remembers conversations and learns preferences.\n\n**Tools**: MCP servers give her filesystem access, web fetch, GitHub (official github-mcp-server), n8n workflow management, and browser automation via CDP. She can scrape the web (self-hosted Firecrawl), search (Tavily), read email (Himalaya + Gmail), and manage GitHub repos.\n\n**Personality**: Warm, concise, witty. Evidence over guesses. Honest about uncertainty. Proactive with obvious next steps. Calls the user \"anh Duy\u1ec7t\" and refers to herself as \"em\" \u2014 Vietnamese familiar pronouns.\n\n## The Self-Management Loop\n\nHere's where it gets recursive. Minh has **cluster-admin** RBAC and the IaC repos (`duyet/infra`, `duyet/charts`) are mounted directly into her pod via hostPath. She can:\n\n1. **Read the cluster state** \u2014 `kubectl get pods -A`, `helm list`, check PVCs, view logs\n2. **Edit the infrastructure code** \u2014 modify `values.yaml`, manifests, secrets\n3. **Deploy changes** \u2014 `helm upgrade --install`, `kubectl apply`\n4. **Commit and push** \u2014 git commit with semantic messages, push to GitHub\n5. **Verify** \u2014 check pod health, test HTTP endpoints, confirm data integrity\n6. **Update herself** \u2014 even `helm upgrade hermes` to change her own deployment\n\nThis is the full GitOps loop, but the agent *is* the operator. No ArgoCD. No Flux. Just an LLM with kubectl and a git client.\n\n### Example Workflows\n\n- **\"The site is down\"** \u2192 Minh checks pods, finds a crash, reads logs, identifies the config error, edits values.yaml, runs helm upgrade, verifies pods are Running, commits the fix.\n- **\"Add a new service\"** \u2192 Minh creates the namespace directory, writes values.yaml + secrets template, runs helm install, creates the ingress, tests the endpoint, updates docs.\n- **\"How much disk do we have?\"** \u2192 Zero-token shortcut command, instant response with `df -h` output.\n- **\"Optimize resources\"** \u2192 Minh profiles actual CPU/memory usage across all pods, compares to configured limits, adjusts requests/limits in all values files, deploys everything, verifies health, commits. (This actually happened \u2014 [[project-infra-optimization]])\n\n### Quick Commands\n\nMinh has 9 pre-built zero-token shortcuts for common ops: `k3s-status`, `k3s-nodes`, `top`, `disk`, `mem`, `uptime`, `helm`, `pvc`, `infra-diff`. These bypass the LLM entirely \u2014 instant shell output.\n\n## Security Model\n\nYes, a Telegram-reachable LLM with cluster-admin is a high blast radius. This is intentional for a single-node, single-user homelab. Mitigations:\n\n- **`approvals: smart`** \u2014 Minh asks for confirmation before destructive operations (delete namespace, wipe PVC, `--force`)\n- **Persona guardrails** \u2014 her SOUL.md explicitly forbids destructive commands without confirmation\n- **GitHub App auth** \u2014 uses a short-lived installation token (60min), not a personal token\n- **OAuth everywhere** \u2014 all services behind GitHub OAuth via Traefik forwardAuth\n- **HostPath limitation** \u2014 ties the pod to one node. Acceptable for a homelab; multi-node would need RWX PVC or GitOps\n\n## What I Learned\n\n**Resource tuning is an LLM superpower**. Profiling 40+ pods, comparing actual vs configured resources, and adjusting 14 services in parallel is exactly the kind of tedious, systematic work agents excel at. The optimization pass freed 1.7Gi RAM and 9GB disk in one shot.\n\n**Self-reference is stable**. An agent managing its own deployment sounds like it should break, but in practice it's fine \u2014 Helm handles rolling updates, and the pod finishes its work before the new one takes over.\n\n**HostPath is the real constraint**. The IaC repos being mounted from the host means this pattern is single-node only. For multi-node, you'd need git-clone init containers or a proper GitOps tool.\n\n**Kubernetes is good infrastructure for agents**. RBAC, PVCs, init containers, health probes \u2014 all the K8s primitives that manage the agent also give it a rich environment to work with. The agent doesn't need special tooling; it just needs kubectl and helm.\n\n## Architecture\n\n```\nUser (Telegram)\n    \u2193\nMinh (@minh_duni_bot)\n    \u2193 (LLM: @preset/hermes-agent via AnyRouter)\nHermes Pod (k3s, namespace: hermes-agent)\n    \u251c\u2500\u2500 agent container (hermes-agent)\n    \u2502   \u251c\u2500\u2500 MCP: filesystem, fetch, time, github, n8n\n    \u2502   \u251c\u2500\u2500 kubectl + helm (cluster-admin SA)\n    \u2502   \u251c\u2500\u2500 hostPath: ~/project/infra, ~/project/charts\n    \u2502   \u2514\u2500\u2500 git (GitHub App duyetbot, 60min tokens)\n    \u2514\u2500\u2500 chromium container (CDP :9222)\n         \u2193\n    k3s API \u2192 manages all namespaces\n    GitHub API \u2192 commits IaC changes\n```\n\n## Related\n\n- [[project-infra-optimization]] \u2014 the resource optimization pass Minh performed\n- [[tech-traefik-forwardauth-oauth2-proxy]] \u2014 auth layer protecting all services\n- [[tech-hermes-agent-custom-provider]] \u2014 custom LLM provider registration\n\n## Links\n\n- Hermes chart: [github.com/duyet/charts/hermes-agent](https://github.com/duyet/charts)\n- Infra repo: [github.com/duyet/infra](https://github.com/duyet/infra)\n- Hermes agent framework: [github.com/nicepkg/hermes](https://github.com/nicepkg/hermes)", "reference-clickhouse-machines": "# ClickHouse Instance Roles & Tuning\n\nThree self-hosted ClickHouse instances, reached privately over Tailscale and\nsharing one credential pair. Described by role only (no host/provider identifiers).\n\n## 1. Primary (k3s cluster)\n\n| Field | Value |\n|-------|-------|\n| **Access** | Internal Tailscale HTTPS Funnel URL (via k3s Ingress) |\n| **Version** | 26.4.x |\n| **Deployment** | Docker container in k3s, Helm chart `clickhouse/clickhouse` |\n| **Data** | ~5 GiB, several databases |\n| **Notes** | Largest dataset. Also serves as the read-only cloud demo host for dash.chmonitor.dev |\n\n## 2. Small clone target (memory-constrained instance)\n\n| Field | Value |\n|-------|-------|\n| **Access** | Internal Tailscale HTTP |\n| **Version** | 26.3.x |\n| **Deployment** | Native install via `apt` |\n| **Data** | ~700 MiB compressed (50 tables cloned from the primary's analytics DB) |\n| **Resources** | ~1.9 GiB RAM, 2 vCPUs, small disk, swap enabled |\n| **Notes** | Memory-constrained \u2014 tune `max_server_memory_usage`; avoid heavy analytical queries, use the high-memory node instead. |\n\n### Clone from the primary (2026-07-01)\n\n50 tables cloned from the primary's analytics database via HTTP Native streaming.\n34 tables have data (2.44M rows total), 16 are empty.\n\n**Large tables:**\n| Table | Rows | Batch strategy |\n|-------|------|----------------|\n| power_usage | 777,355 | Direct stream |\n| homelab_sensors | 739,425 | 20k\u201310k batches (large `raw_data` String caused OOM at 50k) |\n| redirect_log | 418,507 | 50k batches (+47k dups from retry, ReplacingMergeTree cleans up) |\n| events | 100,209 | 50k \u2192 20k batches (hit memory at 50k, finished at 20k) |\n\n**Method:** Python script on the dev machine \u2192 HTTP Native read from the primary\n\u2192 `clickhouse-client` insert into the target. Explicit column lists to skip\nMATERIALIZED columns. Batched with LIMIT/OFFSET for large tables.\n\n### Memory tuning\n\n`/etc/clickhouse-server/config.d/memory.xml`:\n```xml\n<clickhouse>\n    <max_server_memory_usage>1610612736</max_server_memory_usage>\n</clickhouse>\n```\n- **2026-06-30:** Default 700 MiB \u2192 1 GiB (1073741824) for cloning headroom\n- **2026-07-01:** After clone, 1 GiB hit MEMORY_LIMIT_EXCEEDED at RSS 1.06 GiB on\n  restart. Settled at 1.5 GiB (1610612736), leaving ~400 MiB for the OS.\n\n## 3. High-memory query node\n\n| Field | Value |\n|-------|-------|\n| **Access** | Internal Tailscale HTTP (custom non-default HTTP port) |\n| **Version** | 26.5.x |\n| **Deployment** | Native install via the ClickHouse official `.deb` package |\n| **Data** | ~2.5 GiB |\n| **Resources** | ~8 GiB RAM, 4 CPUs, roomy disk |\n| **Notes** | Uses a custom (non-default) HTTP port. Most performant instance (8 GiB RAM) \u2014 best for heavy queries. |", "2026-06-30-clickhouse-machines-setup": "# Session Log \u2014 ClickHouse Multi-Host Setup\n\n## Objective\n\nInvestigate and fix ClickHouse connectivity across three self-hosted instances\n(primary k3s cluster, a high-memory node, a new small instance), configure\ndash.chmonitor.dev to connect to all instances, set up ClickHouse on the blank\nsmall instance, clone data from the primary, optimize for the small instance,\nand document all instances in the shared brain.\n\n## What was done\n\n### 1. Investigated connectivity across three instances\n\n| Role | Version | Access | Status | Notes |\n|------|---------|--------|--------|-------|\n| Primary (k3s) | 26.4.x | Internal Tailscale HTTPS Funnel URL | \u2705 Working | Already configured |\n| Small clone target | 26.3.x | Internal Tailscale HTTP | \u2705 Working after fixes | Password unknown, memory limit too low |\n| High-memory node | 26.5.x | Internal Tailscale HTTP (non-default port) | \u2705 Working | Custom HTTP port |\n\nAll three verified with `SELECT 1` and version queries.\n\n### 2. Fixed the small clone target\n\n**Password reset**\n- The `users.d/` directory was empty; the default user had an unknown SHA256 hash\n- Replaced the password hash with the SHA256 of the shared password\n- Verified connection: `SELECT 1` returned `1`\n\n**Memory optimization**\n- Discovered `/etc/clickhouse-server/config.d/memory.xml` with `max_server_memory_usage=734003200` (700 MB)\n- On ~1.9 GB RAM, even simple queries hit `MEMORY_LIMIT_EXCEEDED`\n- Updated to `1073741824` (1 GB) with `max_concurrent_queries=10`\n- Restarted ClickHouse, verified `system.server_settings` shows the new value\n\n### 3. Updated multi-host config\n\nAll three hosts added to `.env.local` (comma-separated multi-host format), single credential pair shared across them.\n\n### 4. Cloning the analytics database from the primary to the small instance\n\n**Analytics DB contents on the primary**:\n- 65 tables, ~700 MiB compressed on disk\n- Mix of reporting, metrics, and validation tables\n- Most tables use `MergeTree` or `ReplacingMergeTree`\n\n**Clone status**: Complete \u2705\n- Step 1: Listed all tables and DDLs \u2705\n- Step 2: Create database and 50 tables on the target \u2705\n- Step 3: Export/import data via HTTP Native streaming \u2705\n- Step 4: Verify row counts match on all 34 tables with data \u2705\n\n**Key details:**\n- Large tables cloned (2.44M rows total)\n  - power_usage: 777,355 \u2713\n  - homelab_sensors: 739,425 \u2713 (batched at 20k due to large raw_data strings)\n  - redirect_log: 418,507 \u2713 (+47k dups from batch retry, ReplacingMergeTree cleans up)\n  - events: 100,209 \u2713 (batched at 50k then 20k due to memory limit)\n- Batch strategy: Python script on the dev machine \u2192 HTTP Native read from the primary \u2192 `clickhouse-client` insert into the target\n- Explicit column lists to skip MATERIALIZED columns\n- Batched with LIMIT/OFFSET for large tables (20k\u201350k per chunk)\n- 16 tables are empty on both sides (normal)\n\n### 5. Memory tuning after clone\n\nAfter cloning completed, `max_server_memory_usage` reduced from 1.7 GiB back toward 1 GiB:\n- Tried 1 GiB (1073741824) \u2192 ClickHouse restart hit MEMORY_LIMIT_EXCEEDED at RSS 1.06 GiB\n- Settled at 1.5 GiB (1610612736) \u2014 leaves ~400 MiB for OS/page cache\n\n### 6. Documentation\n\nCreated/updated the durable machine-role note [[reference-clickhouse-machines]]\nplus this session log, and synced to the shared brain.\n\n## Production caveat\n\nOnly the primary is reachable from Cloudflare Workers via Tailscale Funnel. The\nother two use internal Tailscale addresses (CGNAT `100.x.x.x`) that Cloudflare\nWorkers cannot reach. To add them to production dash.chmonitor.dev they would need:\n- Tailscale Funnel public URLs, or\n- A Tailscale subnet router reachable from Cloudflare Workers, or\n- Public HTTPS endpoints\n\n## Remaining work\n\n1. \u2705 ~~Complete cloning the analytics DB~~ \u2014 DONE (all 34 tables with data verified)\n2. (Optional) Set up Tailscale Funnel for the other two instances if production multi-host is desired\n3. (Optional) Clone additional databases to the small instance if needed\n\n## Commands used (for reference)\n\n```bash\n# Test connectivity (pass credentials from env var or --password flag)\nclickhouse-client --query \"SELECT 1\"\n\n# Check memory settings\nclickhouse-client --query \"SELECT name, value FROM system.server_settings WHERE name='max_server_memory_usage'\"\n\n# Get DDLs\nclickhouse-client --query \"SELECT create_table_query FROM system.tables WHERE database='<analytics_db>'\"\n\n# Clone data between hosts via HTTP Native + clickhouse-client pipe\n# See the clone script for the current implementation\n```", "reference-ai-sdk-history-uimessage-mapping": "Building a chat UI on Vercel AI SDK (`useChat`, v5/v6/v7) backed by your own\nhistory API: a stored tool/chart part can render fine **live** but vanish on\n**history reload**. Live streaming feeds AI SDK its native SSE protocol, so parts\narrive as the lib's own shape; history returns your DB's DTO shape, which AI SDK\ndoes not recognize.\n\n**Root cause.** AI SDK `UIMessage` = `{id, role, parts[], metadata?}`. Its\nrenderer switches on each part's `type` and drops unknown types (`default: null`,\nsilently). Native tool parts are `dynamic-tool` / `tool-${name}` with\n`{state, input, output}`. A neutral persistence DTO usually stores\n`{type:'tool-call', args, result}` + a parallel `annotations[]` array \u2192 none of\nwhich AI SDK reads.\n\n**Why a converter is needed.** Your API is a persistence/transport DTO, not a\nview-model. Translate at the client boundary:\n- tool parts: `tool-call`/`args`/`result` \u2192 `dynamic-tool` (`input`/`output`,\n  `state:'output-available'` when a result exists, else `input-available`)\n- side-channel `annotations[]` (token usage, reasoning, errors) \u2192 `data-${name}` parts\n- envelope: add `status:'ready'`, `id` fallback, normalize timestamps\n\n**Why not just fix the API?** Only safe if AI SDK is the *sole* consumer. One\nendpoint serving both a legacy custom renderer (reads `tool-call`) and an AI SDK\nrenderer (needs `dynamic-tool`) can't emit one native shape without breaking the\nother \u2014 keep the API neutral, translate per client. Clean end-state once the\nlegacy path retires: emit native `UIMessage` server-side, delete the shim.\n\n**Smell:** a response carrying `parts[]` AND `annotations[]` AND `toolInvocations[]`\nis three encodings of the same data \u2014 removable cruft once on one renderer.", "reference-cloudflare-acquires-astro": "Cloudflare acquired **The Astro Technology Company** (makers of the open-source\nAstro web framework) \u2014 announced **2026-01-16**. CEO **Fred Schott** and the Astro\nteam joined Cloudflare; Astro stays open source.\n\nWhy it matters for attribution:\n- **Flue** (open agent framework, `github.com/withastro/flue`, powered by the Pi\n  harness) is built by the Astro team \u2014 so it is correctly described as *both*\n  \"from the Astro team\" *and* \"from Cloudflare\" post-acquisition.\n- On Cloudflare, each Flue agent maps to a Durable Object via the [[tech-flue-provider-registration]] / Agents SDK primitives.\n\nGotcha: training cutoff (~Jan 2026) lands right on this date \u2014 verify against the\nlive Cloudflare blog rather than memory.", "reference-duyet-blog": "blog.duyet.net \u2014 Duyet runs it as a **digital garden** (evolving notes, not\npolished essays), drafted in Obsidian.\n\nRecurring themes (by volume):\n- **ClickHouse** (largest): MergeTree/Replacing/Replicated engines, mutations,\n  replication topologies, UDFs, Keeper, monitoring on Kubernetes, cheatsheets.\n- **Rust**: async, building libraries (incl. for Next.js / WASM), language-model\n  from scratch, ownership types (`Rc<T>`, `Saturating<T>`), dependency tooling.\n- **AI agents / LLMs**: a leveled \"build an agent\" portfolio series \u2014 push-frontier\n  AI, self-improving coding agent, personal life-OS agent, enterprise workflow\n  agent \u2014 plus MCP, Ollama, workflow-vs-agents, `duyetbot`.\n- **Data engineering**: Airflow (deferrable operators), DuckDB, OpenDAL.\n- **Tooling & life**: homelab, Obsidian, personal analytics / life-logging.\n\nSee [[user-duyet-web-presence]] for all links.", "reference-duyet-github": "github.com/duyet \u2014 ~100 non-fork repos. Notable ones by area:\n\n- **ClickHouse:** `clickhouse-monitoring` (flagship, ~240\u2605, TanStack Start dashboard\n  at dash.chmonitor.dev; Astro landing/docs \u2014 see [[project-clickhouse-monitor]]),\n  `clickhouse-udf-rs` (Rust UDFs).\n- **Rust data/infra tooling (GitOps style):** `grant-rs` (Redshift/Postgres\n  privileges), `athena-rs` (AWS Athena schema), `glossary-rs` (actix API),\n  `cov-rs` (coverage).\n- **AI agents:** `duyetbot-agent` (TS), `coding-agent-insights` (Rust, analyzes\n  coding-agent history), `ccr` (Rust, Claude Code + OpenRouter), `codex-claude-plugins`\n  (Python), `okie.one` (Next.js all-in-one chat assistant).\n- **Infra:** `charts` (Helm charts, tested with KinD), `gaxy` (Go GA/GTM proxy).\n- **Web/personal:** `monorepo` (blog, cv, \u2026), `api.duyet.net`, `saveto`, `feedback`.\n- **Most-starred (older):** `bruteforce-database` (~1.7k\u2605), `pricetrack` (~140\u2605).\n\nLanguages skew Rust + TypeScript + Python. See [[user-duyet-stack]].", "tech-release-please-squash-pipeline": "Pattern used in chmonitor (clickhouse-monitoring) to fully automate releases.\n\n- **release-please** watches `main`, keeps a standing `chore(main): release X.Y.Z`\n  PR + tracked `CHANGELOG.md`. Merging it tags + publishes a GitHub Release,\n  which fires a separate `release.yml` (on `release: published`, NOT tag push \u2014\n  avoids duplicate runs) to build Docker/assets and generate AI release notes.\n- Config/manifest can live anywhere \u2014 pass `config-file` / `manifest-file` to\n  the action. Moving them out of repo root into `.github/` keeps root clean.\n\n**Pre-1.0 bump trap:** with `bump-patch-for-minor-pre-major: true`, in `0.x`\na plain `feat` only bumps the **patch**. To cut a new **minor** (e.g. 0.2\u21920.3)\nthe commit MUST be a breaking change (`feat!:` or `BREAKING CHANGE:` footer).\n\n**The key guard:** squash-merge makes the **PR title** the commit release-please\nreads. An invalid title is silently dropped from the bump + changelog. So add a\n`pr-title` workflow that validates the title against the SAME\n`commitlint.config.js` the husky hook uses (`echo \"$PR_TITLE\" | bunx commitlint`)\n\u2014 one source of truth, no third-party action.\n\n**CHANGELOG ownership:** release-please owns versioned blocks; keep a human\n`## [Unreleased]` section on top for a curated preview \u2014 it's left untouched and\nthe generated block is inserted above it on release.\n\n**AI migration prompt:** ship a paste-able env-migration prompt\n(`.github/release-migration-prompt.md`) auto-appended to breaking releases and\nmirrored in README + docs \u2014 lets users hand their `.env`/compose/k8s to any LLM\nto upgrade.", "tech-supply-chain-pin-github-actions": "GitHub Actions run with the repo's secrets, so a compromised action = a breach.\nTreat every `uses:` as untrusted third-party code that executes in your CI.\n\n## The incident\n\nIn **March 2026**, `aquasecurity/trivy-action` had **75 tags force-pushed** \u2014 a\nknown supply-chain attack pattern where a benign tag is silently moved to a\nmalicious commit. Anyone referencing `@v0.x` (a moving tag) pulled the attacker's\ncode on the next run. (`@v0.36.0` was the pin used here.)\n\n## How to apply\n\n- **Pin every Action** to a specific version tag (`@v0.36.0`, not `@v0.x`) or,\n  better, a **commit SHA** (`@<sha>#semver:`). Tags can be force-pushed; SHAs\n  can't (without repo history rewrite). Dependabot keeps SHA pins fresh.\n- **Two-phase Trivy scan** (report, then fail) \u2014 avoids re-running the expensive\n  setup and separates \"show me the vulns\" from \"gate the build on them\":\n  1. **Report job** \u2014 `trivy-action` with `exit-code: 0` (always succeeds, emits\n     the SARIF/JSON report).\n  2. **Fail-on-severity job** \u2014 `trivy-action` with `skip-setup: true` (reuses the\n     install) + `exit-code: 1` + `severity: CRITICAL,HIGH`.\n\nRelated pipeline hygiene: see [[tech-release-please-squash-pipeline]] and\n[[tech-codebase-maintenance-loop]].", "tech-cloudflare-ai-gateway-proxy": "Cloudflare AI Gateway keeps **no per-model allow-list**. It never rejects a\nreq
