] (xAI-style reference,\nset 2026-05-25). [[project-llm-timeline]] PR #1003 is the reference implementation.\n\n**Flat rules:** hairline 1px border (`var(--hairline)`) is the only elevation cue.\nNo `shadow-*`, no glow, no `rounded-2xl` (use `rounded-none`/`rounded-md`). Hover\n= background tint (`var(--faint)`), not shadow. Divider grid: `gap-px\nbg-[var(--hairline)]` container with `bg-[var(--background)]` cells.\n\n**Tokens (3 additive CSS layers in `packages/components/styles.css`):** base\n(Tailwind v4 `@theme`) \u2192 warm (`#fbf7f0 / #1f1f1f`) \u2192 minimal (`--minimal-*` +\nutilities `.pill-outline`, `.eyebrow-mono`, `.display-tight`). shadcn primitives\n(badge/button/input/card, CVA + radix slot) use semantic tokens (`bg-card`,\n`text-foreground`, `border-border`) \u2014 zero hardcoded `neutral-*`/`dark:`.\n\n**Icons:** `lucide-react` everywhere (drop `weight` prop); migrate\n`@phosphor-icons/react` when touching a file. **Dark mode:** card tints\n`dark:bg-{color}/20`; badges invert shade pair; blog uses white `#ffffff` bg\n(distinct editorial identity) over the warm cream others use.", "tech-kumo-ui-nextjs-integration": "Hard-won facts from migrating the AgentState dashboard (Next 16 + Turbopack + `output:\"export\"`) to `@cloudflare/kumo@2.5` from shadcn/ui. See [[tech-flat-design-system]].\n\n**`createContext is not a function` is THE blocker.** Kumo (base-ui) AND `@phosphor-icons/react` (`IconContext`) call `React.createContext` at module top-level. RSC pre-render has no `createContext`, so **every file importing either must start with `\"use client\"`** \u2014 not just the obvious ones. `transpilePackages: [\"@cloudflare/kumo\",\"@base-ui/react\",\"@phosphor-icons/react\",\"echarts\"]` is necessary but NOT sufficient.\n\n**Tailwind v4 wiring** (`globals.css`): `@source \"../../node_modules/@cloudflare/kumo/dist/**/*.{js,jsx,ts,tsx}\";` then `@import \"@cloudflare/kumo/styles/tailwind\";` BEFORE `@import \"tailwindcss\";`. Without `@source`, Kumo utility classes silently vanish (e.g. dialogs not centered).\n\n**API differences vs shadcn:**\n- `Button` has **no `render`/`asChild`** \u2192 link buttons are `<Link href><Button>\u2026</Button></Link>`. Default `variant` is `secondary` (map shadcn `default`\u2192`primary`).\n- `Tabs` is **array-based** (`tabs={[{value,label}]}` + controlled `value`/`onValueChange`), no `Tabs.Content`.\n- **No `Chart`** \u2192 use `echarts` directly (it's a peer dep).\n- `Sidebar`: use named `SidebarProvider` (not `Sidebar.Provider`); `SidebarMenuButton` has `href`+`active`+`tooltip` but **no `render`**.\n- `Text` is a discriminated union: `heading1/2/3` REQUIRE matching `as=\"h1/2/3\"`; **`className` is not accepted** on `Text` at all.\n\n**Tokens:** Kumo ships `--color-kumo-*` (base, hairline, fill, danger, brand\u2026) AND the standard names (`muted`, `foreground`, `border`\u2026) resolve from your own `globals.css :root`. Don't invent `kumo-line`/`kumo-tint`/`kumo-subtle`/`kumo-strong` \u2014 they don't exist; only `kumo-base` does among the common ones.\n\n**Phosphor:** `Activity` does NOT exist (use `Pulse`/`ChartLine`); both bare (`House`) and `*Icon` (`HouseIcon`) forms export. `lucide\u2192phosphor`: Home\u2192House, Settings\u2192Gear, MessageSquare\u2192ChatCircle, ChevronsUpDown\u2192CaretUpDown, Building2\u2192Buildings.\n\n**Dark mode:** Kumo uses `data-mode=\"dark\"` attr; shadcn uses `.dark` class. During migration set BOTH. Local docs via `bunx kumo doc <Name>` / `kumo ls` (web docs often rate-limited).\n\n**Install:** `bun add @cloudflare/kumo @phosphor-icons/react echarts zod` (project uses Bun, not pnpm).", "tech-og-images-static-prerender": "**Goal:** unique 1200\u00d7630 social-share images per page on a static site, without\nadding a runtime image renderer.\n\n**Two flavours of \"dynamic\":**\n- *Build-time* \u2014 generate one committed `og-<slug>.png` per page; regenerate on\n  every deploy. No worker bundle cost. **Default choice** for static-first apps.\n- *Request-time* \u2014 a `/og?title=\u2026` worker route rendering live (Satori + resvg\n  WASM). Truly dynamic but adds WASM weight to the worker bundle; avoid unless\n  needed.\n\n**Pipeline (build-time):** [Satori](https://github.com/vercel/satori) (HTML/CSS\nobject tree \u2192 SVG) + `@resvg/resvg-js` (SVG \u2192 PNG). Make it **hermetic**: vendor\nthe TTF fonts in-repo so no network access \u2014 safe inside CI deploy jobs. It's\ndeterministic (no timestamps/random), so regenerating unchanged cards yields\n**byte-identical** PNGs \u2014 git diff = objective proof a refactor changed nothing.\n\n**Single registry = no drift.** One map `slug \u2192 {eyebrow, title, description}`\nfeeds *both* consumers: (1) the generator loops it to emit `og-<slug>.png`, and\n(2) a `pageOgHead(slug)` helper builds the route `<head>` meta. A standalone bun\nscript can import the app's TS registry directly \u2014 keep that file free of React /\npath-alias imports.\n\n**Crawler correctness \u2014 the check that matters:** social crawlers (Slack, X,\nFacebook) don't run JS. The OG meta MUST be in the *prerendered* HTML, not\ninjected client-side. With TanStack Start SSG the route `head()` runs at build\nand bakes tags into `dist/client/<route>/index.html`. Verify by grepping the\nbuilt HTML, and on prod check the image returns `200 image/png` with\n`cf-cache-status: MISS` right after deploy (proves fresh, not edge-cached).\n\nRoot layout holds the shared defaults (`og:type`, `og:image:width/height`,\n`twitter:card=summary_large_image`); per-route `head()` overrides title + image.\nPages without a registry entry fall back to the site-wide default image.\n\nShipped in chmonitor [[project-clickhouse-monitor]] (PRs #1614/#1615 base,\n#1617 extended to per-page query pages).", "tech-rust-wasm-prerender": "7 Rust crates compiled to WASM (`crate-type=[\"cdylib\"]`) replace TS in\n`@duyet/libs` ([[project-duyet-net]]). Apps import `@duyet/libs/*`, never WASM directly.\n\n**Migration rule:** only migrate a TS function to WASM if its TS mean > ~1 ms.\nJS\u2194WASM string marshaling costs ~30\u201340 \u00b5s/call, so sub-100 \u00b5s ops are parity or\nslower. Only `markdown-to-html` cleared it: 6.3 ms \u2192 0.08 ms (~79x). Slower\ncrates (normalizers, dedup, csv, exif, diff, string-utils) kept for consistency\n+ future batch APIs that amortize marshal cost.\n\n**CI trap:** `**/pkg/` is gitignored \u2192 WASM must be built in CI before the build\nstep. With `prerender.failOnError:false`, a missing binary makes `markdownToHtml`\nthrow, the route is silently skipped, no `index.html` written, and CF Pages\nserves the homepage at every post URL (looks like a routing bug; deploy logs green).\n**Fix:** CI runs rust-toolchain + wasm-pack + `wasm:build:release` before build,\ngated on the blog app. **Diagnose:** healthy blog build = 700+ `index.html` in\n`dist/client/`; grep build log for `markdownToHtml`/\"Failed to convert\".\nSee [[tech-tanstack-start-ssg]], [[tech-cloudflare-pages-deploy]].", "tech-tanstack-stale-route-chunks": "Post-deploy, users on an old main bundle may 404 a lazy route chunk (`pricing-*.js`). TanStack Router then throws **`Cannot read properties of undefined (reading 'component')`** \u2014 not caught by import-only preload handlers.\n\n## Fix pattern (AnyRouter 2026-06-14)\n\n1. Inline pre-import script: match import failures **and** router render errors; `sessionStorage` debounce (30s); listen `unhandledrejection`, `error`, `vite:preloadError`\n2. Root `errorComponent` calls same reload helper when patterns match\n3. Prerender public marketing routes so ASSETS HTML is hash-locked with current build (`<slug>.html`, not `index.html` \u2014 CF trailing-slash 307 trap)\n\n**Why:** Default TanStack error UI sticks; users blame the page, not their cached bundle.\n\n**How to apply:** On any TanStack Start + Vite code-split app with frequent deploys, extend stale-chunk recovery beyond dynamic-import strings; prerender high-traffic static shells in the two-deploy capture pass.", "tech-tanstack-start-ssg": "**Problem:** Cloudflare Rocket Loader rewrites `<script type=\"module\">` to a\ndeferred non-module script \u2192 Vite SPA entry never bootstraps \u2192 blank page.\n**Fix:** pre-render HTML so content exists before JS runs. (Also disable Rocket\nLoader per domain in the CF dashboard as belt-and-suspenders.)\n\n**Migrate Vite SPA \u2192 TanStack Start SSG** (~8 files/app):\n- `vite.config.ts`: swap `TanStackRouterVite()` for `tanstackStart({ prerender:\n  { enabled: true, crawlLinks: true, failOnError: false } })`; drop\n  `@vitejs/plugin-react`; do NOT pass `autoCodeSplitting` (not in schema).\n- Delete `index.html` + `main.tsx`; add `entry-client.tsx` (`hydrateRoot`),\n  `entry-server.tsx` (`createStartHandler`).\n- `router.tsx` must export a `getRouter()` factory, not a const.\n- `__root.tsx` renders full `<html>` doc; move `<meta>`/`<link>` into route `head()`.\n- Build output `dist` \u2192 `dist/client`; set `pages_build_output_dir` in `wrangler.toml`.\n\n**Gotchas:** paths in config are relative to `srcDirectory` (`src`); local\n`fetch('/data.json')` fails in SSR \u2014 use isomorphic loading (`fs.readFile` on\nSSR, `fetch()` on client); absolute API URLs work in both. `failOnError:false`\nhides prerender errors \u2014 see [[tech-rust-wasm-prerender]]. Deploy: [[tech-cloudflare-pages-deploy]].", "tech-agent-loop-autonomous-pr-management": "**Agent-loop** is a continuous, self-paced autonomous system that manages all open PRs without human context overhead.\n\n## Cycle Structure\n\nRuns indefinitely on 15-minute intervals (configurable):\n\n1. **Wait** \u2014 sleep for cycle interval (15 min)\n2. **Triage** \u2014 scan all open PRs across all repos, classify by status\n3. **Dispatch** \u2014 route work to parallel subagent threads\n4. **Monitor** \u2014 track thread progress and outcomes\n5. **Report** \u2014 log cycle summary to `.agent-loop/` state files\n\n## What It Triages\n\n- **Merge-ready**: PR is passing, approved, no conflicts \u2192 dispatch merge agent\n- **Review-ready**: PR is passing, needs review \u2192 dispatch code-review subagent\n- **Needs-fix**: PR is failing tests/lint/type-check \u2192 dispatch fix subagent\n- **Merge-blocked**: conflicts, failing checks, waiting on approval \u2192 log and defer\n- **Deferred**: previously seen, no change \u2192 skip\n\n## Subagent Dispatch Strategy\n\n**Cheap models only** (Sonnet/Haiku) \u2014 preserves main context:\n\n- **Haiku** \u2014 test failures, lint fixes, simple refactors\n- **Sonnet** \u2014 code reviews, complex refactors, multi-file changes\n- **Main context** \u2014 strategic decisions only (scope conflicts, architectural questions)\n\nMax 3 parallel threads per cycle (prevents queue overflow).\n\n## State & Recovery\n\n- **Persisted to** `.agent-loop/state.json` in repo root\n- **Recovers** cycle count, items processed, PRs merged, active thread list, thread history\n- **Backups** kept in `.agent-loop/backups/` (timestamped) for recovery from corruption\n- **Commands**: `/agent-loop:status` (quick), `/agent-loop:inspect` (full), `/agent-loop:stop` (graceful)\n\n## Effectiveness & Cost Savings\n\n**What it eliminates:**\n- Manual PR reviews (triaged by subagents in parallel)\n- Manual fix cycles (test failures \u2192 fix \u2192 re-run \u2192 merge in one agent call)\n- Context-switching cost (loop runs in background, main context for decisions only)\n- Duplicate work (state tracking prevents re-triaging)\n\n**Why cheap subagents work:**\n- PRs have clear status (passing/failing) \u2192 less ambiguity\n- Fixes are scoped (fix this test file, not \"improve the codebase\")\n- Reviews use heuristics (no duplicated code, type safety, naming) \u2192 Sonnet sufficient\n- Merge/CI tasks are deterministic (run test suite, merge, revert if fail)\n\n**Cost vs. value:**\n- Haiku @ 80 tokens/request \u00d7 20 fixes/cycle = 1.6k tokens\n- Sonnet @ 200 tokens/request \u00d7 5 reviews/cycle = 1k tokens\n- Per 15-min cycle: ~3k tokens (vs. Opus main-loop @ 10x cost)\n- 4 cycles/hr \u00d7 6 hrs/day = 24 cycles/day = 72k tokens/day (sustainable)\n\n## Setup & Configuration\n\n```bash\n# Resume with all-repos scope, 15-min cycle\n/agent-loop:resume --scope all --interval 900\n\n# Check status\n/agent-loop:status\n\n# Stop gracefully\n/agent-loop:stop\n```\n\nConfiguration persists in state.json; resume re-applies saved interval/scope.\n\n## Integration Points\n\n- **CI systems**: loop watches GitHub Actions status in real-time\n- **PR queue**: triages GitHub PR API endpoints (open, draft, status)\n- **Git operations**: merge via CLI, uses signed commits (GPG if configured)\n- **Logging**: appends to `.agent-loop/cycles/<YYYY-MM-DD>.log` + `state.json` metrics\n\n## Next: Scaling to Org Scope\n\nCurrently monitoring single project. Roadmap:\n- Fan out to multiple repos (`--scope all --repos org/repo1,org/repo2`)\n- Route complex PRs to senior-engineer agents when heuristics are uncertain\n- Auto-create follow-up issues for deferred PRs (merge-blockers, architecture questions)\n- Dashboard showing cycle health, merge velocity, average review time", "tech-codebase-maintenance-loop": "How [[project-duyetbot]] keeps [[project-duyet-net]] low-debt \u2014 extends\n[[feedback-working-style]] with concrete tooling.\n\n**Improvement cycles:** periodic scoped sweeps, one debt category each (security,\ndedup/shadcn, privacy/cache, data-sync, DB, design, tests). ~9 cycles / ~155\nfixes by early 2026; cycle 9 added 104 tests + unified the design system. Run a\ncycle: `git log --since=<date> --name-only` to scope \u2192 fix \u2192 test before/after \u2192\none semantic commit per logical change.\n\n**Safe dead-code removal:** before deleting a symbol, prove zero non-test refs:\n`rg -n \"<symbol>\" apps packages --glob '!**/*.test.*' --glob '!**/*.spec.*'`.\nEmpty output = safe. `pnpm why <pkg>` to check dep overrides. Record durable\nfindings in the core-memory doc \u2014 do NOT create dated review files.\n\n**Tests:** `pnpm run test` from root (also the pre-commit hook). A test must fail\nwhen business logic changes (encode WHY, not just WHAT). Priority by risk:\nsecurity/credentials \u2192 data transforms (normalizers, slugs, markdown) \u2192 render\ncorrectness \u2192 edge cases.", "tech-tmux-pane-status-labels": "## Problem\n\nWhen running multiple tmux windows with coding agents, you can't tell at a glance which tabs have an active agent session vs which are sitting idle at a shell prompt waiting for human review.\n\n## Solution\n\nCreate a `~/.local/bin/tmux-pane-label` script that maps `#{pane_current_command}` to a descriptive icon+label, then wire it into tmux's `automatic-rename-format`.\n\n### Script location\n\n`~/.local/bin/tmux-pane-label` (chmod +x, must be in `$PATH`)\n\n### Command \u2192 label mapping\n\n| Command | Tab label | Meaning |\n|---|---|---|\n| `opencode`, `claude`, `codex`, `cursor` | `\u27f3 name` | Agent actively running |\n| `bash`, `sh`, `zsh`, `fish` | `\u2304 name` | Idle at shell prompt |\n| `nvim`, `vim`, `nano` | `\u270e name` | Editor open |\n| `node`, `npm`, `bun`, `deno` | `\u26a1 name` | Dev tool running |\n| `python`, `python3` | `\ud83d\udc0d python` | Python process |\n| `ssh` | `\ud83c\udf10 ssh` | Remote session |\n| `htop`, `top`, `btm` | `\ud83d\udcca name` | System monitor |\n| `docker` | `\ud83d\udc33 docker` | Container tool |\n| `sudo` | `\ud83d\udd12 sudo` | Privileged command |\n| `make`, `cargo`, `go` | `\ud83d\udd28 name` | Build tool |\n| `less`, `more`, `man` | `\ud83d\udcc4 name` | Pager |\n| `tail`, `tailf`, `watch` | `\ud83d\udccb name` | Log follow |\n| `tmux` | `\u23ce` | Tmux internal |\n| anything else | raw command name | Fallback |\n\n### Tmux config (`~/.tmux.conf.local` for gpakosz/.tmux)\n\n```tmux\nset -g automatic-rename-format \\\n  \"#{?pane_in_mode,[tmux],#(tmux-pane-label #{pane_id})}#{?pane_dead,[dead],}\"\n\n# \u2303b + Shift+R re-enables dynamic naming on a manually-renamed window\nbind R set-window-option automatic-rename on \\; display \"Dynamic naming ON\"\n```\n\n### How it works\n\n- `automatic-rename-format` dynamically sets window names based on the active pane\n- The script calls `tmux display -t <pane_id> -p '#{pane_current_command}'` and classifies the result\n- When a coding agent is the foreground process, the tab shows \"\u27f3 agentname\"\n- When the agent exits and the shell returns, the tab switches to \"\u2304 bash\"\n- Previously renamed windows (`automatic-rename off` per-window) keep static names\n- **\u2303b + Shift+R** re-enables dynamic naming on per-window basis\n\n### Notes\n\n- Script must handle panes that no longer exist (`tmux display` fails \u2192 returns `\"?\"`)\n- The `#()` format expansion is fast (<10ms per call, runs per status-interval)\n- Manual window names (via `\u2303b + ,`) take precedence and disable automatic-rename\n- Tested with tmux 3.6a and gpakosz/.tmux config framework", "user-duyet-ai-stance": "Duyet's current AI practice (from his blog, ~2026):\n\n- **Vibe-codes for production.** Top Wakatime language is now **Markdown** \u2014\n  he drives agents more than he hand-writes code.\n- **Claude Code is his daily driver** and stated favorite (\"king\") after trying\n  100+ tools (Cursor, Codex, Copilot, Windsurf, Antigravity, opencode, etc.). He\n  treats specific tools as disposable \u2014 the field moves too fast to pick \"the best\".\n- **Builds with agent SDKs:** OpenAI Agents SDK, Claude Agent SDK, Cloudflare\n  Agents, Vercel AI SDK, LlamaIndex, LangChain. Deploys RAG for enterprise.\n- **Recurring interests:** self-improving/agentic loops (plan\u2192execute\u2192test\u2192reflect),\n  agent memory & consolidation, privacy-first personal agents, personal analytics\n  / life-logging. Personal agent project: `duyetbot`.\n\nSee [[user-duyet-stack]] for the broader toolset.", "user-duyet-profile": "**Duyet Le** (handle `@duyet`) \u2014 senior data engineer and technology enthusiast,\nbased in Vietnam. Owner of this knowledge base.\n\nFocus areas: large-scale data platforms, real-time analytics, ClickHouse, the\ndata-engineering ecosystem (Kafka, Spark, Airflow), Kubernetes/cloud infra, and\nLLM agents / AI integration. Active open-source contributor.\n\nPublic links and stack live in [[user-duyet-web-presence]] and [[user-duyet-stack]].\nWorking preferences in [[feedback-working-style]].", "user-duyet-stack": "Technical stack for [[user-duyet-profile]], drawn from public blog & GitHub.\n\n**Languages:** Rust (extensive), Python, TypeScript/JavaScript, SQL. Also R, PHP\nin older posts. Notably interested in data-engineering tools written in Rust.\n\n**Data & big data:** ClickHouse (deep expertise), Apache Spark, Apache Airflow,\nDuckDB, Kafka; PostgreSQL, MongoDB, Redis.\n\n**Cloud & infra:** Kubernetes, Docker, AWS, GCP, Azure, Cloudflare, GitHub Actions.\n\n**AI/ML:** LLM agents & coding agents (Claude, Codex, Hermes), PyTorch/TensorFlow,\nNLP, MCP servers.\n\n**Frontend/web:** Next.js, React, TypeScript (e.g. `clickhouse-monitoring`).\n\n**Local dev environment:** macOS (Apple Silicon), Homebrew, `bun`, `uv`, neovim,\nObsidian. Prefers semantic commits and simple, plain English in writing.\n\nBlog series worth knowing: ClickHouse on Kubernetes, Rust Fundamentals, Spark on\nKubernetes, Apache Airflow, Coding Agents. See [[user-duyet-web-presence]].", "user-duyet-web-presence": "Public web presence for [[user-duyet-profile]]. Sites ending in `/llms.txt`\nserve an LLM-friendly profile \u2014 prefer those for fresh facts.\n\n| What        | URL                          | llms.txt                         |\n|-------------|------------------------------|----------------------------------|\n| Profile     | https://duyet.net            | https://duyet.net/llms.txt       |\n| Blog        | https://blog.duyet.net       | https://blog.duyet.net/llms.txt  |\n| CV / Resume | https://cv.duyet.net         | https://cv.duyet.net/llms.txt    |\n| GitHub      | https://github.com/duyet     | \u2014                                |\n| LinkedIn    | https://duyet.net/in         | \u2014                                |\n| X (Twitter) | https://x.com/_duyet          | \u2014                                |\n| Insights    | https://insights.duyet.net   | \u2014                                |\n| Homelab     | https://homelab.duyet.net    | \u2014                                |\n| LLM Timeline| https://llm-timeline.duyet.net | \u2014                              |\n| MCP tools   | https://mcp.duyet.net        | \u2014                                |\n| Agents API  | https://agents.duyet.net     | \u2014                                |\n\nContact: `me@duyet.net`. Blog feed: https://blog.duyet.net/feed."}, "types": ["feedback", "project", "reference", "tech", "user"], "palette": {"feedback": "#ec4899", "project": "#3b82f6", "reference": "#10b981", "tech": "#f59e0b", "user": "#8b5cf6"}};
(function(){
  const b=window.BUNDLE, byId={}; b.nodes.forEach(n=>byId[n.data.id]=n.data);
  const back={}; b.edges.forEach(e=>{(back[e.data.target]=back[e.data.target]||[]).push(e.data.source)});
  const leg=document.getElementById("legend");
  b.types.forEach(t=>{const s=document.createElement("span");s.innerHTML='<i style="background:'+b.palette[t]+'"></i>'+t;leg.appendChild(s)});
  const cy=cytoscape({container:document.getElementById("graph"),elements:[...b.nodes,...b.edges],style:[
    {selector:"node",style:{"label":"data(label)","background-color":"data(color)","width":"data(size)","height":"data(size)","color":"#334155","font-size":10,"text-valign":"bottom","text-margin-y":4,"text-wrap":"wrap","text-max-width":80}},
    {selector:"node:selected",style:{"border-width":3,"border-color":"#0f172a"}},
    {selector:"edge",style:{"width":1,"line-color":"#cbd5e1","curve-style":"bezier","opacity":.55}}
  ],layout:{name:"cose",animate:false,idealEdgeLength:90,nodeRepulsion:9000,padding:20}});
  function select(id){
    cy.nodes().unselect(); const el=cy.getElementById(id); if(el&&el.length)el.select();
    const n=byId[id]; if(!n) return;
    const bodyMd=b.bodies[id]||"";
    const tags=(n.tags||[]).map(t=>'<span>'+t+'</span>').join("");
    const bl=(back[id]||[]).map(s=>'<li><a data-id="'+s+'">'+((byId[s]||{}).label||s)+'</a></li>').join("");
    document.getElementById("detail").innerHTML=
      '<h1>'+n.label+'</h1>'+
      '<span class="badge" style="background:'+(b.palette[n.type]||'#64748b')+'">'+n.type+'</span>'+
      (n.resource?' <a class="muted" href="'+n.resource+'" target="_blank" rel="noopener">source ↗</a>':'')+
      '<p class="desc">'+(n.description||'')+'</p>'+
      (tags?'<div class="tags">'+tags+'</div>':'')+
      '<div class="body">'+marked.parse(bodyMd)+'</div>'+
      (bl?'<div id="backlinks"><h2>Linked from</h2><ul>'+bl+'</ul></div>':'');
    document.querySelectorAll('#backlinks a').forEach(a=>a.onclick=()=>select(a.dataset.id));
  }
  cy.on("tap","node",e=>select(e.target.id()));
  if(b.nodes.length) select(b.nodes[0].data.id);
})();
</script>
