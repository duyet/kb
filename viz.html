ech-rust-wasm-prerender", "target": "project-duyet-net"}}, {"data": {"id": "tech-rust-wasm-prerender__tech-cloudflare-pages-deploy", "source": "tech-rust-wasm-prerender", "target": "tech-cloudflare-pages-deploy"}}, {"data": {"id": "tech-rust-wasm-prerender__tech-tanstack-start-ssg", "source": "tech-rust-wasm-prerender", "target": "tech-tanstack-start-ssg"}}, {"data": {"id": "tech-rust-wasm-prerender__user-duyet-stack", "source": "tech-rust-wasm-prerender", "target": "user-duyet-stack"}}, {"data": {"id": "tech-supply-chain-pin-github-actions__tech-codebase-maintenance-loop", "source": "tech-supply-chain-pin-github-actions", "target": "tech-codebase-maintenance-loop"}}, {"data": {"id": "tech-supply-chain-pin-github-actions__tech-release-please-squash-pipeline", "source": "tech-supply-chain-pin-github-actions", "target": "tech-release-please-squash-pipeline"}}, {"data": {"id": "tech-tanstack-stale-route-chunks__project-anyrouter", "source": "tech-tanstack-stale-route-chunks", "target": "project-anyrouter"}}, {"data": {"id": "tech-tanstack-stale-route-chunks__tech-cloudflare-pages-deploy", "source": "tech-tanstack-stale-route-chunks", "target": "tech-cloudflare-pages-deploy"}}, {"data": {"id": "tech-tanstack-stale-route-chunks__tech-tanstack-start-ssg", "source": "tech-tanstack-stale-route-chunks", "target": "tech-tanstack-start-ssg"}}, {"data": {"id": "tech-tanstack-start-ssg__project-duyet-net", "source": "tech-tanstack-start-ssg", "target": "project-duyet-net"}}, {"data": {"id": "tech-tanstack-start-ssg__tech-cloudflare-pages-deploy", "source": "tech-tanstack-start-ssg", "target": "tech-cloudflare-pages-deploy"}}, {"data": {"id": "tech-tanstack-start-ssg__tech-rust-wasm-prerender", "source": "tech-tanstack-start-ssg", "target": "tech-rust-wasm-prerender"}}, {"data": {"id": "tech-tmux-pane-status-labels__tech-agent-loop-autonomous-pr-management", "source": "tech-tmux-pane-status-labels", "target": "tech-agent-loop-autonomous-pr-management"}}, {"data": {"id": "tech-traefik-forwardauth-oauth2-proxy__user-duyet-stack", "source": "tech-traefik-forwardauth-oauth2-proxy", "target": "user-duyet-stack"}}, {"data": {"id": "user-duyet-ai-stance__feedback-docs-driven-development", "source": "user-duyet-ai-stance", "target": "feedback-docs-driven-development"}}, {"data": {"id": "user-duyet-ai-stance__user-duyet-profile", "source": "user-duyet-ai-stance", "target": "user-duyet-profile"}}, {"data": {"id": "user-duyet-ai-stance__user-duyet-stack", "source": "user-duyet-ai-stance", "target": "user-duyet-stack"}}, {"data": {"id": "user-duyet-profile__feedback-working-style", "source": "user-duyet-profile", "target": "feedback-working-style"}}, {"data": {"id": "user-duyet-profile__user-duyet-stack", "source": "user-duyet-profile", "target": "user-duyet-stack"}}, {"data": {"id": "user-duyet-profile__user-duyet-web-presence", "source": "user-duyet-profile", "target": "user-duyet-web-presence"}}, {"data": {"id": "user-duyet-stack__user-duyet-profile", "source": "user-duyet-stack", "target": "user-duyet-profile"}}, {"data": {"id": "user-duyet-stack__user-duyet-web-presence", "source": "user-duyet-stack", "target": "user-duyet-web-presence"}}, {"data": {"id": "user-duyet-web-presence__user-duyet-profile", "source": "user-duyet-web-presence", "target": "user-duyet-profile"}}, {"data": {"id": "user-duyet-web-presence__user-duyet-stack", "source": "user-duyet-web-presence", "target": "user-duyet-stack"}}], "bodies": {"feedback-cheap-models-subagents": "When dispatching sub-agents (Agent tool) or Workflow agents \u2014 especially in\nbatch/parallel fan-out (e.g. babysitting/fixing/merging many PRs at once) \u2014\ndefault them to a **cheaper model** (`sonnet`, or `haiku` for trivial/mechanical\nwork) rather than inheriting Opus.\n\n**Why:** Opus across many concurrent agents is expensive and usually overkill for\nmechanical, well-scoped work (fix-CI-then-merge, search, refactor-to-spec). Duyet\nflagged cost during a 13-agent parallel PR batch.\n\n**How to apply:**\n- Pass `model: \"sonnet\"` on `Agent` calls; `opts.model` in Workflow scripts.\n- Use `haiku` for trivial/mechanical tasks; reserve **Opus** for genuinely complex\n  reasoning the main loop handles.\n- Don't restart already-running agents just to switch model \u2014 only apply to new\n  dispatches.", "feedback-docs-driven-development": "Duyet's core agent-collaboration pattern (from his blog, \"Docs-Driven Development\"):\n\n- **`CLAUDE.md`/`AGENTS.md` stays tiny** \u2014 short, stable rules + a router pointing\n  at the right doc. Cramming architecture/feature contracts in there rots the file.\n- **A versioned, grep-able `kb` is the brain** \u2014 structured by the question being\n  asked; the same docs serve Duyet, teammates, and every coding agent.\n- **Make read/write reflexive, phrased as triggers not requests:** read the index\n  on the way *in* (before answering anything non-trivial), write back on the way\n  *out* (before forgetting). \"Remember to write docs\" doesn't work \u2014 triggers do.\n\n**Why:** rules-in-prompt evaporate between sessions; a structured external brain\npersists and is reviewable in a PR.\n\n**How to apply:** this is exactly the model this repo implements \u2014 read `MEMORY.md`\nfirst, grep `memory/`, write durable facts back automatically. Don't bloat the\nrouter files; put knowledge in notes.", "feedback-working-style": "Working preferences for agents collaborating with [[user-duyet-profile]].\n\n- **Language:** respond in English. (Vietnamese is native, but English is the\n  default for work.)\n- **Communication:** concise, evidence over assumption, no filler words like\n  \"comprehensive/extensive\". Surface tradeoffs and uncertainty; don't hide confusion.\n- **Code:** simplest solution that works. No speculative abstractions, no\n  features beyond what was asked. Surgical changes \u2014 touch only what's needed.\n- **Commits:** semantic format, consistent scope, simple English.\n- **Autonomy:** comfortable with `/loop` for recurring maintenance; values\n  non-disruptive operations (never destructive actions without explicit ask).\n\n**Why:** Duyet is a senior engineer who optimizes for maintainability and low\nnoise; over-engineering and verbosity waste his time.\n\n**How to apply:** default to less code and fewer words; ask before big or\nirreversible moves; match the existing codebase's conventions.", "project-anyrouter": "github.com/duyet/anyrouter \u2014 OpenAI-compatible LLM router: one API, many providers, BYOK, presets, failover.\n\n## Stack & deploy\n\n| Layer | Choice |\n|-------|--------|\n| App | TanStack Start + React, SSR on Cloudflare Workers |\n| UI | shadcn/ui (Tailwind v4, semantic tokens) + Phosphor icons \u2014 Kumo fully removed 2026-07 |\n| API | Separate `anyrouter-api` worker via service binding (3 MiB budget split) |\n| Deploy | `pnpm cf:deploy` \u2192 `pnpm ops deploy` (secrets, D1 migrate, build, deploy, prerender, purge) |\n| Docs | Customer docs in `src/content/docs/`; maintainer kb in `docs/kb/` |\n\n## Public routes (2026-06-14)\n\n- `/pricing` \u2014 Free / Pro / Team tiers (Kumo cards)\n- Homepage **LLM API Gateway** diagram: `src/components/home-sections/gateway-section.tsx` (clients \u2192 AnyRouter hub \u2192 providers)\n- Subdomain shortcuts: `pricing.anyrouter.dev` \u2192 `/pricing`, etc. (`src/worker.ts`)\n\n## Ops habits\n\n- Post-task: deploy + commit only touched paths (`git add` specific files, never `-A`)\n- Smoke: `pnpm e2e:test:prod` after deploy\n- Internal kb auto-updated under `docs/kb/` for non-trivial fixes\n\n**Why:** Agents working across repos need the deploy split, file locations, and stale-chunk trap without re-discovering from scratch.\n\n**How to apply:** Read `docs/kb/` + `AGENTS.md` in repo before coding; use Kumo docs-first; route all upstreams through CF AI Gateway.\n\n## Gateway-ops lessons (2026-07-16 autonomous issue sweep)\n\n- **CF AI Gateway unified billing can hard-zero**: error `{\"code\":2021,\"httpCode\":402,\"message\":\"Insufficient balance; add money to your gateway or use BYOK\"}` takes down every model whose only platform route is the unified `cloudflare` backend. No code fix \u2014 top up or wire a fallback platform upstream per popular model.\n- **LiteLLM-style resellers bury quota exhaustion in HTTP 400** (`{\"type\":\"budget_exceeded\",\"message\":\"ExceededBudget: ...\"}`). Routers must classify those 400s like 402/429 (fall through to next candidate), not as terminal client errors.\n- **Disabling a platform backend silently kills BYOK through it** \u2014 if user keys inject via the platform backend, add a `-byok` sibling BEFORE disabling (anyrouter's z-ai precedent; the openai/deepinfra disable missed this and broke OpenAI-key BYOK for a day).\n- **Every new backend has a registration checklist** (logo alias, byok provider map, schema-registry dialect row, intentional-free allowlist, regen). Drift tests that enumerate the registry are what catch skipped steps \u2014 worth building in any config-driven router.\n- **A full network timeout (zero bytes) is terminal per backend per request** \u2014 retrying the same origin just burns another 60s.", "project-chmonitor-one-codebase-saas": "chmonitor (open-source ClickHouse monitoring dashboard) ships BOTH the\nself-hosted (OSS) product and the hosted Cloud SaaS (dash.chmonitor.dev) from ONE\ncodebase. The difference is purely runtime config behind a fail-closed flag chain:\n`CHM_DEPLOYMENT_MODE=oss|cloud` is the single high-level switch that resolves\ndefaults for cloud mode, auth provider (Clerk), public read, and per-user D1\nstorage \u2014 unset/junk resolves to self-hosted, so OSS is never degraded.\n\n- **Cloud mode on:** env hosts become a public read-only demo; signed-in users\n  get a clean per-user workspace (connect their own ClickHouse); zero hosts \u2192\n  welcome/setup page. Billing via Polar (webhook \u2192 D1 \u2192 plan resolution, fails\n  open to Free for OSS).\n- **Self-hosted:** env hosts are the operator's real hosts, full access, no demo.\n  Invariant: never gate a core monitoring feature behind cloud mode.\n- **Connect-a-host errors** are classified into kinds (SSRF/host-not-allowed,\n  invalid URL, auth failed, DNS, refused, TLS, timeout) \u2192 title + cause + fix +\n  per-kind docs link.\n\n**Reusable env pattern (the durable lesson):** centralize all non-secret config\nto committed `.env` files as the SINGLE source of truth, consumed by BOTH the\nclient build and the server/worker runtime.\n\n**Why:** dual build-time vs runtime var sources (a Vite-inlined client flag vs a\nWorker runtime var) silently drift \u2014 a flag set only at build time but read at\nruntime breaks features in prod with no error at build.\n**How to apply:** one canonical name per setting; derive the client-inlined\n`VITE_*` from the canonical server `CHM_*` in the bundler config; generate the\ndeploy target's vars from the same `.env` file; never keep a second\nhand-maintained copy (e.g. wrangler `[vars]`). Same names work for Docker\n(`env_file`) and Helm (values \u2192 ConfigMap). Secrets stay out of committed `.env`.", "project-clickhouse-monitor": "github.com/chmonitor/chmonitor (moved from duyet/clickhouse-monitoring) \u2014 flagship ClickHouse ops UI. Monorepo on **pnpm 10** with isolated per-app workspaces (root workspace covers only `apps/mcp` + `packages/*`); **bun is the test runner only**, never the package manager.\n\n## Apps (Cloudflare Workers)\n\n| App | Role | URL |\n|-----|------|-----|\n| `apps/dashboard` | TanStack Start dashboard (the product) | dash.chmonitor.dev |\n| `apps/landing` | marketing site | chmonitor.dev |\n| `apps/docs` | **Fumadocs** on TanStack Start (content synced from `docs/content/`) | docs.chmonitor.dev |\n| `apps/blog` | blog | blog.chmonitor.dev |\n| `apps/mcp` | MCP server | dash.chmonitor.dev/api/mcp |\n| `apps/bug-handler` | Email Worker: Sentry alert emails \u2192 GitHub issues | bug@chmonitor.dev |\n| `apps/cloud-hooks` | Cloud ops Worker: Polar webhook + Telegram notifications + crons | hooks.chmonitor.dev |\n\n## Current state (2026-07)\n\n- **Cloud SaaS live**: Clerk auth, per-user D1 connections, Polar billing, `CHM_DEPLOYMENT_MODE=oss|cloud` (fail-closed to OSS) \u2014 see [[project-chmonitor-one-codebase-saas]].\n- **AI agent**: Vercel AI SDK (not LangGraph), ~29 lean tools + skill recipes; AI Insights engine (collect\u2192enrich\u2192persist, stable-key dismissal).\n- **Health alerting**: dual dispatch worlds (client polling + server cron sweep), adapters (webhook/Slack/PagerDuty/Opsgenie/email), D1 routing/maintenance/ack/history; expansion epic chmonitor#2669 (Telegram/ntfy/Teams/quiet-hours/digest/smart rule suggestions).\n- **Design system**: OKLCH tokens + shadcn (Base UI), `product-design` project skill is the source of truth; smart-detection \"section-returns-null\" pattern for conditional dashboard sections.\n- Dev knowledge lives in-repo at `docs/knowledge/` (linked knowledge graph, ~25 notes) \u2014 read that first when working in the repo.\n\n**Why:** agents touching chmonitor need the right app paths, package manager, and the OSS/Cloud invariant before editing.\n**How to apply:** dashboard work \u2192 `apps/dashboard` (see its CLAUDE.md); `pnpm` for everything except `bun test`; never gate core monitoring features behind cloud mode; verify with `pnpm run build` + `pnpm run lint`.", "project-duyet-net": "`duyet/monorepo` \u2014 Bun + Turborepo hosting all of [[user-duyet-profile]]'s public\nweb apps + shared packages. Most apps are TanStack Start SSG on Cloudflare Pages\n(see [[tech-tanstack-start-ssg]], [[tech-cloudflare-pages-deploy]]).\n\n**Apps** (subdomains of duyet.net), with pre-rendered page counts:\n- `blog` (393) \u2014 TanStack Start SSG, WASM markdown, isomorphic `readPublicJson`.\n- `llm-timeline` (3700+) \u2014 see [[project-llm-timeline]].\n- `insights` (22) \u2014 AI/Claude usage analytics from CCUsage data.\n- `home` (4), `cv` (2), `photos` (2), `homelab` (1), `ai-percentage` (1).\n- `agents` \u2014 the **only** Vite SPA left; D1 Pages Functions block SSG. See [[project-duyetbot]].\n\n**Shared packages:** `components` (design system), `libs` (WASM bindings re-export),\n`wasm` (compiled Rust crates), `data-sync`, `api`, `config`, `urls`.\n\n**Design:** flat/hairline design system \u2014 see [[tech-flat-design-system]]. Palette\nvaries per app (blog white `#ffffff`, others warm cream `#fbf7f0`).\nWASM strategy: [[tech-rust-wasm-prerender]]. Maintained autonomously by [[project-duyetbot]].", "project-duyetbot": "duyetbot \u2014 the autonomous Claude Code agent persona that maintains [[project-duyet-net]].\n\n**Scope (can change without asking):** codebase, look-and-feel, deployment \u2014\nlayout, components, design tokens, deps, build/deploy config, landing-page copy.\n**Out of scope (needs human direction):** blog post content (`apps/blog/_posts/**`)\nand LLM Timeline curated data \u2014 those are Duyet's authored words/research facts.\n\n**Autonomous loops:**\n- **Improvement loop** (`/loop` or one-shot `claude -p`): measure \u2192 fix top-priority issue \u2192 verify (lint+test+build) \u2192 commit \u2192 background-deploy \u2192 log. Priority order: build > tests > lint > deploy > code quality > features. See [[tech-cloudflare-pages-deploy]].\n- **PR management loop** (`/agent-loop:resume`): runs continuously every 15 min, triages all open PRs, dispatches cheap subagents (Sonnet/Haiku) for reviews/fixes/merges. See [[tech-agent-loop-autonomous-pr-management]].\n\n**Memory hierarchy** (most\u2192least durable): commit messages \u2192 kb articles \u2192 durable\nfindings doc \u2192 session memory `.md` snapshots \u2192 transcript. Memory files are\npoint-in-time, may be stale \u2014 verify against code before acting. This is the\n[[feedback-docs-driven-development]] model. Auto-compaction welcomed; save\nto-remember context before it. Commits add a duyetbot co-author trailer.", "project-infra-optimization": "# Infra Optimization Baseline (2026-06-13)\n\n**Goal**: optimize resources, reduce complexity, fix security issues on duet-ubuntu k3s cluster.\n\n## Results\n\n| Metric | Before | After | Delta |\n|--------|--------|-------|-------|\n| Memory | 10Gi (78%) | 9.2Gi (70%) | **-1.7Gi** |\n| Disk | 372G (86%) | 363G (84%) | **-9GB** |\n| Swap files | 2 (16G) | 1 (11G) | -4G file |\n| CrashLoop pods | 1 | 0 | fixed |\n| Services without limits | cert-manager | 0 | all limited |\n| Kubeconfig perms | 644 world-readable | 640/600 | secured |\n\n## What Changed\n\n### Resource optimization (all services)\n- Key principle: set requests based on actual usage, limits at 1.5-2x peak\n- Hermes: memory limit raised 1Gi \u2192 2Gi (was being exceeded at 1212Mi)\n- PeerDB: massive over-provisioning fixed \u2014 temporal 512\u2192128Mi, flow-worker 512\u2192128Mi, total req ~1.9Gi \u2192 736Mi\n- Home Assistant: CPU limit 2 \u2192 500m (only using 10m actual)\n- Open-WebUI: memory limit 1536Mi \u2192 1Gi, CPU limit 1 \u2192 500m\n- LiteLLM: memory limit 1536 \u2192 1200Mi\n- ClickHouse: memory limit 2Gi \u2192 1536Mi, CPU limit 1 \u2192 500m\n- n8n + worker: memory limits 1Gi \u2192 512Mi\n- Portainer, Qdrant, Promptfoo, Vito, Chmonitor: all tightened\n- cert-manager: added limits to all 3 components (previously unlimited)\n\n### Security\n- Kubeconfig: `/etc/rancher/k3s/k3s.yaml` mode 640, user copy `$HOME/.kube/config.duet-homelab` mode 600\n- All Makefiles and docs updated to use new KUBECONFIG path\n- Docker daemon stopped, disabled, masked (k3s uses containerd)\n\n### Host cleanup\n- Journal logs vacuumed 876MB \u2192 100MB cap\n- Old kernel 6.8.0-110-generic removed\n- Swap consolidated: removed `/swap.img` (4G), kept `/swapfile2` (11G)\n- Failed systemd units masked: NetworkManager-wait-online, systemd-networkd-wait-online\n\n### Firecrawl fix\n- nuq-worker disabled (CrashLoopBackOff \u2014 missing NUQ cloud config, not needed for homelab)\n- Added `{{- if .Values.nuqWorker.enabled }}` guard to deployment template\n\n## Repo: `~/project/infra` (duyet/infra)\n\n**Why**: baseline for future optimization rounds. Re-run `kubectl top pods -A` to compare.\n**How to apply**: resource tuning is iterative \u2014 always measure actual usage before adjusting.", "project-kb-duyet-net": "kb.duyet.net \u2014 Duyet's public knowledge base, the rendered front-end of this\nshared brain.\n\n- **Old form:** an `apps/kb` app inside [[project-duyet-net]] \u2014 markdown articles\n  with frontmatter (category/tags/links/summary), graph view at `/graph`, machine\n  index at `/llms.txt` + `/llms-full.txt`, raw article at `/k/<slug>.md`.\n- **Now:** that monorepo app is being **replaced by THIS repo** (the shared brain).\n  The site renders the kb (including client-side full-text search, RSS, and sitemap)\n  and also serves `/scripts/bootstrap.sh` for new-device setup.\n\nEmbodies [[feedback-docs-driven-development]]: synthesized, graph-connected,\ngrep-able notes \u2014 the durable form of agent memory, distinct from point-in-time\nsession snapshots. Maintained by [[project-duyetbot]]. The 32 long-form source\narticles seeding this brain came from the old monorepo `apps/kb`.", "project-llm-timeline": "`apps/llm-timeline` ([[project-duyet-net]]) \u2014 timeline of LLM models 1950\u20132026,\n3700+ pre-rendered pages. Reference implementation for the flat/shadcn design\n(PR #1003): all `shadow-*` removed, semantic tokens only, vertical stat-card grids.\n\n**Data** (built into pages at build time, `pnpm run sync`, no runtime API):\n- Curated: ~785 models from Google Sheets, hand-maintained by Duyet (out of\n  scope for [[project-duyetbot]] \u2014 research facts + citations).\n- Epoch AI: ~3156 models (extended range back to 1950).\n- Deduped to ~3937 unique (last sync 2026-03-25).\n\n**Tech:** warm cream palette; `@tanstack/react-virtual` `useWindowVirtualizer`\nfor the scroll; WASM normalizer crate via `initSync` (kept for consistency though\nnot faster \u2014 see [[tech-rust-wasm-prerender]]); badge variants replace\ncolor-lookup functions. Design conventions: [[tech-flat-design-system]].", "project-self-driven-homelab": "# The Self-Driving Homelab\n\nA single-node k3s cluster that largely runs itself. An AI agent named Minh lives inside it, reachable by Telegram, and maintains the infrastructure it depends on.\n\n## The Setup\n\n**Hardware**: One self-hosted machine \u2014 16 CPU, 13Gi RAM, 457G NVMe.\n\n**Stack**: k3s (single-node, containerd), Traefik ingress, Let's Encrypt TLS via Cloudflare DNS-01, GitHub OAuth for auth. 15 services across 14 namespaces. All config versioned in git.\n\n**Services**: n8n (workflows), LiteLLM (LLM proxy), Open WebUI (chat UI), Home Assistant (smart home), ClickHouse (analytics DB), Qdrant (vectors), PeerDB (CDC replication), Firecrawl (web scraping), Portainer, and others. All behind OAuth.\n\nNothing exotic. Standard homelab stuff. The interesting part is *who runs it*.\n\n## Minh \u2014 The Agent That Lives Inside\n\nMinh is an instance of [Hermes](https://github.com/duyet/charts) \u2014 an open-source AI agent framework packaged as a Helm chart. She runs as a pod in the cluster with two containers: the agent itself and a Chromium sidecar for browser automation.\n\n**Reach**: You talk to Minh via Telegram (`@minh_duni_bot`). She speaks Vietnamese by default, switches to English when you write in English. One language per reply.\n\n**Brain**: Backed by `@preset/hermes-agent` through [AnyRouter](https://anyrouter.dev), with fallback to Gemini Flash and Claude Sonnet via OpenRouter. She has persistent memory (SOUL.md + session state on a PVC), so she remembers conversations and learns preferences.\n\n**Tools**: MCP servers give her filesystem access, web fetch, GitHub (official github-mcp-server), n8n workflow management, and browser automation via CDP. She can scrape the web (self-hosted Firecrawl), search (Tavily), read email (Himalaya + Gmail), and manage GitHub repos.\n\n**Personality**: Warm, concise, witty. Evidence over guesses. Honest about uncertainty. Proactive with obvious next steps. Calls the user \"anh Duy\u1ec7t\" and refers to herself as \"em\" \u2014 Vietnamese familiar pronouns.\n\n## The Self-Management Loop\n\nHere's where it gets recursive. Minh has **cluster-admin** RBAC and the IaC repos (`duyet/infra`, `duyet/charts`) are mounted directly into her pod via hostPath. She can:\n\n1. **Read the cluster state** \u2014 `kubectl get pods -A`, `helm list`, check PVCs, view logs\n2. **Edit the infrastructure code** \u2014 modify `values.yaml`, manifests, secrets\n3. **Deploy changes** \u2014 `helm upgrade --install`, `kubectl apply`\n4. **Commit and push** \u2014 git commit with semantic messages, push to GitHub\n5. **Verify** \u2014 check pod health, test HTTP endpoints, confirm data integrity\n6. **Update herself** \u2014 even `helm upgrade hermes` to change her own deployment\n\nThis is the full GitOps loop, but the agent *is* the operator. No ArgoCD. No Flux. Just an LLM with kubectl and a git client.\n\n### Example Workflows\n\n- **\"The site is down\"** \u2192 Minh checks pods, finds a crash, reads logs, identifies the config error, edits values.yaml, runs helm upgrade, verifies pods are Running, commits the fix.\n- **\"Add a new service\"** \u2192 Minh creates the namespace directory, writes values.yaml + secrets template, runs helm install, creates the ingress, tests the endpoint, updates docs.\n- **\"How much disk do we have?\"** \u2192 Zero-token shortcut command, instant response with `df -h` output.\n- **\"Optimize resources\"** \u2192 Minh profiles actual CPU/memory usage across all pods, compares to configured limits, adjusts requests/limits in all values files, deploys everything, verifies health, commits. (This actually happened \u2014 [[project-infra-optimization]])\n\n### Quick Commands\n\nMinh has 9 pre-built zero-token shortcuts for common ops: `k3s-status`, `k3s-nodes`, `top`, `disk`, `mem`, `uptime`, `helm`, `pvc`, `infra-diff`. These bypass the LLM entirely \u2014 instant shell output.\n\n## Security Model\n\nYes, a Telegram-reachable LLM with cluster-admin is a high blast radius. This is intentional for a single-node, single-user homelab. Mitigations:\n\n- **`approvals: smart`** \u2014 Minh asks for confirmation before destructive operations (delete namespace, wipe PVC, `--force`)\n- **Persona guardrails** \u2014 her SOUL.md explicitly forbids destructive commands without confirmation\n- **GitHub App auth** \u2014 uses a short-lived installation token (60min), not a personal token\n- **OAuth everywhere** \u2014 all services behind GitHub OAuth via Traefik forwardAuth\n- **HostPath limitation** \u2014 ties the pod to one node. Acceptable for a homelab; multi-node would need RWX PVC or GitOps\n\n## What I Learned\n\n**Resource tuning is an LLM superpower**. Profiling 40+ pods, comparing actual vs configured resources, and adjusting 14 services in parallel is exactly the kind of tedious, systematic work agents excel at. The optimization pass freed 1.7Gi RAM and 9GB disk in one shot.\n\n**Self-reference is stable**. An agent managing its own deployment sounds like it should break, but in practice it's fine \u2014 Helm handles rolling updates, and the pod finishes its work before the new one takes over.\n\n**HostPath is the real constraint**. The IaC repos being mounted from the host means this pattern is single-node only. For multi-node, you'd need git-clone init containers or a proper GitOps tool.\n\n**Kubernetes is good infrastructure for agents**. RBAC, PVCs, init containers, health probes \u2014 all the K8s primitives that manage the agent also give it a rich environment to work with. The agent doesn't need special tooling; it just needs kubectl and helm.\n\n## Architecture\n\n```\nUser (Telegram)\n    \u2193\nMinh (@minh_duni_bot)\n    \u2193 (LLM: @preset/hermes-agent via AnyRouter)\nHermes Pod (k3s, namespace: hermes-agent)\n    \u251c\u2500\u2500 agent container (hermes-agent)\n    \u2502   \u251c\u2500\u2500 MCP: filesystem, fetch, time, github, n8n\n    \u2502   \u251c\u2500\u2500 kubectl + helm (cluster-admin SA)\n    \u2502   \u251c\u2500\u2500 hostPath: ~/project/infra, ~/project/charts\n    \u2502   \u2514\u2500\u2500 git (GitHub App duyetbot, 60min tokens)\n    \u2514\u2500\u2500 chromium container (CDP :9222)\n         \u2193\n    k3s API \u2192 manages all namespaces\n    GitHub API \u2192 commits IaC changes\n```\n\n## Related\n\n- [[project-infra-optimization]] \u2014 the resource optimization pass Minh performed\n- [[tech-traefik-forwardauth-oauth2-proxy]] \u2014 auth layer protecting all services\n- [[tech-hermes-agent-custom-provider]] \u2014 custom LLM provider registration\n\n## Links\n\n- Hermes chart: [github.com/duyet/charts/hermes-agent](https://github.com/duyet/charts)\n- Infra repo: [github.com/duyet/infra](https://github.com/duyet/infra)\n- Hermes agent framework: [github.com/nicepkg/hermes](https://github.com/nicepkg/hermes)", "reference-clickhouse-machines": "# ClickHouse Instance Roles & Tuning\n\nThree self-hosted ClickHouse instances, reached privately over Tailscale and\nsharing one credential pair. Described by role only (no host/provider identifiers).\n\n## 1. Primary (k3s cluster)\n\n| Field | Value |\n|-------|-------|\n| **Access** | Internal Tailscale HTTPS Funnel URL (via k3s Ingress) |\n| **Version** | 26.4.x |\n| **Deployment** | Docker container in k3s, Helm chart `clickhouse/clickhouse` |\n| **Data** | ~5 GiB, several databases |\n| **Notes** | Largest dataset. Also serves as the read-only cloud demo host for dash.chmonitor.dev |\n\n## 2. Small clone target (memory-constrained instance)\n\n| Field | Value |\n|-------|-------|\n| **Access** | Internal Tailscale HTTP |\n| **Version** | 26.3.x |\n| **Deployment** | Native install via `apt` |\n| **Data** | ~700 MiB compressed (50 tables cloned from the primary's analytics DB) |\n| **Resources** | ~1.9 GiB RAM, 2 vCPUs, small disk, swap enabled |\n| **Notes** | Memory-constrained \u2014 tune `max_server_memory_usage`; avoid heavy analytical queries, use the high-memory node instead. |\n\n### Clone from the primary (2026-07-01)\n\n50 tables cloned from the primary's analytics database via HTTP Native streaming.\n34 tables have data (2.44M rows total), 16 are empty.\n\n**Large tables:**\n| Table | Rows | Batch strategy |\n|-------|------|----------------|\n| power_usage | 777,355 | Direct stream |\n| homelab_sensors | 739,425 | 20k\u201310k batches (large `raw_data` String caused OOM at 50k) |\n| redirect_log | 418,507 | 50k batches (+47k dups from retry, ReplacingMergeTree cleans up) |\n| events | 100,209 | 50k \u2192 20k batches (hit memory at 50k, finished at 20k) |\n\n**Method:** Python script on the dev machine \u2192 HTTP Native read from the primary\n\u2192 `clickhouse-client` insert into the target. Explicit column lists to skip\nMATERIALIZED columns. Batched with LIMIT/OFFSET for large tables.\n\n### Memory tuning\n\n`/etc/clickhouse-server/config.d/memory.xml`:\n```xml\n<clickhouse>\n    <max_server_memory_usage>1610612736</max_server_memory_usage>\n</clickhouse>\n```\n- **2026-06-30:** Default 700 MiB \u2192 1 GiB (1073741824) for cloning headroom\n- **2026-07-01:** After clone, 1 GiB hit MEMORY_LIMIT_EXCEEDED at RSS 1.06 GiB on\n  restart. Settled at 1.5 GiB (1610612736), leaving ~400 MiB for the OS.\n\n## 3. High-memory query node\n\n| Field | Value |\n|-------|-------|\n| **Access** | Internal Tailscale HTTP (custom non-default HTTP port) |\n| **Version** | 26.5.x |\n| **Deployment** | Native install via the ClickHouse official `.deb` package |\n| **Data** | ~2.5 GiB |\n| **Resources** | ~8 GiB RAM, 4 CPUs, roomy disk |\n| **Notes** | Uses a custom (non-default) HTTP port. Most performant instance (8 GiB RAM) \u2014 best for heavy queries. |", "2026-06-30-clickhouse-machines-setup": "# Session Log \u2014 ClickHouse Multi-Host Setup\n\n## Objective\n\nInvestigate and fix ClickHouse connectivity across three self-hosted instances\n(primary k3s cluster, a high-memory node, a new small instance), configure\ndash.chmonitor.dev to connect to all instances, set up ClickHouse on the blank\nsmall instance, clone data from the primary, optimize for the small instance,\nand document all instances in the shared brain.\n\n## What was done\n\n### 1. Investigated connectivity across three instances\n\n| Role | Version | Access | Status | Notes |\n|------|---------|--------|--------|-------|\n| Primary (k3s) | 26.4.x | Internal Tailscale HTTPS Funnel URL | \u2705 Working | Already configured |\n| Small clone target | 26.3.x | Internal Tailscale HTTP | \u2705 Working after fixes | Password unknown, memory limit too low |\n| High-memory node | 26.5.x | Internal Tailscale HTTP (non-default port) | \u2705 Working | Custom HTTP port |\n\nAll three verified with `SELECT 1` and version queries.\n\n### 2. Fixed the small clone target\n\n**Password reset**\n- The `users.d/` directory was empty; the default user had an unknown SHA256 hash\n- Replaced the password hash with the SHA256 of the shared password\n- Verified connection: `SELECT 1` returned `1`\n\n**Memory optimization**\n- Discovered `/etc/clickhouse-server/config.d/memory.xml` with `max_server_memory_usage=734003200` (700 MB)\n- On ~1.9 GB RAM, even simple queries hit `MEMORY_LIMIT_EXCEEDED`\n- Updated to `1073741824` (1 GB) with `max_concurrent_queries=10`\n- Restarted ClickHouse, verified `system.server_settings` shows the new value\n\n### 3. Updated multi-host config\n\nAll three hosts added to `.env.local` (comma-separated multi-host format), single credential pair shared across them.\n\n### 4. Cloning the analytics database from the primary to the small instance\n\n**Analytics DB contents on the primary**:\n- 65 tables, ~700 MiB compressed on disk\n- Mix of reporting, metrics, and validation tables\n- Most tables use `MergeTree` or `ReplacingMergeTree`\n\n**Clone status**: Complete \u2705\n- Step 1: Listed all tables and DDLs \u2705\n- Step 2: Create database and 50 tables on the target \u2705\n- Step 3: Export/import data via HTTP Native streaming \u2705\n- Step 4: Verify row counts match on all 34 tables with data \u2705\n\n**Key details:**\n- Large tables cloned (2.44M rows total)\n  - power_usage: 777,355 \u2713\n  - homelab_sensors: 739,425 \u2713 (batched at 20k due to large raw_data strings)\n  - redirect_log: 418,507 \u2713 (+47k dups from batch retry, ReplacingMergeTree cleans up)\n  - events: 100,209 \u2713 (batched at 50k then 20k due to memory limit)\n- Batch strategy: Python script on the dev machine \u2192 HTTP Native read from the primary \u2192 `clickhouse-client` insert into the target\n- Explicit column lists to skip MATERIALIZED columns\n- Batched with LIMIT/OFFSET for large tables (20k\u201350k per chunk)\n- 16 tables are empty on both sides (normal)\n\n### 5. Memory tuning after clone\n\nAfter cloning completed, `max_server_memory_usage` reduced from 1.7 GiB back toward 1 GiB:\n- Tried 1 GiB (1073741824) \u2192 ClickHouse restart hit MEMORY_LIMIT_EXCEEDED at RSS 1.06 GiB\n- Settled at 1.5 GiB (1610612736) \u2014 leaves ~400 MiB for OS/page cache\n\n### 6. Documentation\n\nCreated/updated the durable machine-role note [[reference-clickhouse-machines]]\nplus this session log, and synced to the shared brain.\n\n## Production caveat\n\nOnly the primary is reachable from Cloudflare Workers via Tailscale Funnel. The\nother two use internal Tailscale addresses (CGNAT `100.x.x.x`) that Cloudflare\nWorkers cannot reach. To add them to production dash.chmonitor.dev they would need:\n- Tailscale Funnel public URLs, or\n- A Tailscale subnet router reachable from Cloudflare Workers, or\n- Public HTTPS endpoints\n\n## Remaining work\n\n1. \u2705 ~~Complete cloning the analytics DB~~ \u2014 DONE (all 34 tables with data verified)\n2. (Optional) Set up Tailscale Funnel for the other two instances if production multi-host is desired\n3. (Optional) Clone additional databases to the small instance if needed\n\n## Commands used (for reference)\n\n```bash\n# Test connectivity (pass credentials from env var or --password flag)\nclickhouse-client --query \"SELECT 1\"\n\n# Check memory settings\nclickhouse-client --query \"SELECT name, value FROM system.server_settings WHERE name='max_server_memory_usage'\"\n\n# Get DDLs\nclickhouse-client --query \"SELECT create_table_query FROM system.tables WHERE database='<analytics_db>'\"\n\n# Clone data between hosts via HTTP Native + clickhouse-client pipe\n# See the clone script for the current implementation\n```", "reference-ai-sdk-history-uimessage-mapping": "Building a chat UI on Vercel AI SDK (`useChat`, v5/v6/v7) backed by your own\nhistory API: a stored tool/chart part can render fine **live** but vanish on\n**history reload**. Live streaming feeds AI SDK its native SSE protocol, so parts\narrive as the lib's own shape; history returns your DB's DTO shape, which AI SDK\ndoes not recognize.\n\n**Root cause.** AI SDK `UIMessage` = `{id, role, parts[], metadata?}`. Its\nrenderer switches on each part's `type` and drops unknown types (`default: null`,\nsilently). Native tool parts are `dynamic-tool` / `tool-${name}` with\n`{state, input, output}`. A neutral persistence DTO usually stores\n`{type:'tool-call', args, result}` + a parallel `annotations[]` array \u2192 none of\nwhich AI SDK reads.\n\n**Why a converter is needed.** Your API is a persistence/transport DTO, not a\nview-model. Translate at the client boundary:\n- tool parts: `tool-call`/`args`/`result` \u2192 `dynamic-tool` (`input`/`output`,\n  `state:'output-available'` when a result exists, else `input-available`)\n- side-channel `annotations[]` (token usage, reasoning, errors) \u2192 `data-${name}` parts\n- envelope: add `status:'ready'`, `id` fallback, normalize timestamps\n\n**Why not just fix the API?** Only safe if AI SDK is the *sole* consumer. One\nendpoint serving both a legacy custom renderer (reads `tool-call`) and an AI SDK\nrenderer (needs `dynamic-tool`) can't emit one native shape without breaking the\nother \u2014 keep the API neutral, translate per client. Clean end-state once the\nlegacy path retires: emit native `UIMessage` server-side, delete the shim.\n\n**Smell:** a response carrying `parts[]` AND `annotations[]` AND `toolInvocations[]`\nis three encodings of the same data \u2014 removable cruft once on one renderer.", "reference-cloudflare-acquires-astro": "Cloudflare acquired **The Astro Technology Company** (makers of the open-source\nAstro web framework) \u2014 announced **2026-01-16**. CEO **Fred Schott** and the Astro\nteam joined Cloudflare; Astro stays open source.\n\nWhy it matters for attribution:\n- **Flue** (open agent framework, `github.com/withastro/flue`, powered by the Pi\n  harness) is built by the Astro team \u2014 so it is correctly described as *both*\n  \"from the Astro team\" *and* \"from Cloudflare\" post-acquisition.\n- On Cloudflare, each Flue agent maps to a Durable Object via the [[tech-flue-provider-registration]] / Agents SDK primitives.\n\nGotcha: training cutoff (~Jan 2026) lands right on this date \u2014 verify against the\nlive Cloudflare blog rather than memory.", "reference-duyet-blog": "blog.duyet.net \u2014 Duyet runs it as a **digital garden** (evolving notes, not\npolished essays), drafted in Obsidian.\n\nRecurring themes (by volume):\n- **ClickHouse** (largest): MergeTree/Replacing/Replicated engines, mutations,\n  replication topologies, UDFs, Keeper, monitoring on Kubernetes, cheatsheets.\n- **Rust**: async, building libraries (incl. for Next.js / WASM), language-model\n  from scratch, ownership types (`Rc<T>`, `Saturating<T>`), dependency tooling.\n- **AI agents / LLMs**: a leveled \"build an agent\" portfolio series \u2014 push-frontier\n  AI, self-improving coding agent, personal life-OS agent, enterprise workflow\n  agent \u2014 plus MCP, Ollama, workflow-vs-agents, `duyetbot`.\n- **Data engineering**: Airflow (deferrable operators), DuckDB, OpenDAL.\n- **Tooling & life**: homelab, Obsidian, personal analytics / life-logging.\n\nSee [[user-duyet-web-presence]] for all links.", "reference-duyet-github": "github.com/duyet \u2014 ~100 non-fork repos. Notable ones by area:\n\n- **ClickHouse:** `clickhouse-monitoring` (flagship, ~240\u2605, TanStack Start dashboard\n  at dash.chmonitor.dev; Astro landing/docs \u2014 see [[project-clickhouse-monitor]]),\n  `clickhouse-udf-rs` (Rust UDFs).\n- **Rust data/infra tooling (GitOps style):** `grant-rs` (Redshift/Postgres\n  privileges), `athena-rs` (AWS Athena schema), `glossary-rs` (actix API),\n  `cov-rs` (coverage).\n- **AI agents:** `duyetbot-agent` (TS), `coding-agent-insights` (Rust, analyzes\n  coding-agent history), `ccr` (Rust, Claude Code + OpenRouter), `codex-claude-plugins`\n  (Python), `okie.one` (Next.js all-in-one chat assistant).\n- **Infra:** `charts` (Helm charts, tested with KinD), `gaxy` (Go GA/GTM proxy).\n- **Web/personal:** `monorepo` (blog, cv, \u2026), `api.duyet.net`, `saveto`, `feedback`.\n- **Most-starred (older):** `bruteforce-database` (~1.7k\u2605), `pricetrack` (~140\u2605).\n\nLanguages skew Rust + TypeScript + Python. See [[user-duyet-stack]].", "tech-release-please-squash-pipeline": "Pattern used in chmonitor (clickhouse-monitoring) to fully automate releases.\n\n- **release-please** watches `main`, keeps a standing `chore(main): release X.Y.Z`\n  PR + tracked `CHANGELOG.md`. Merging it tags + publishes a GitHub Release,\n  which fires a separate `release.yml` (on `release: published`, NOT tag push \u2014\n  avoids duplicate runs) to build Docker/assets and generate AI release notes.\n- Config/manifest can live anywhere \u2014 pass `config-file` / `manifest-file` to\n  the action. Moving them out of repo root into `.github/` keeps root clean.\n\n**Pre-1.0 bump trap:** with `bump-patch-for-minor-pre-major: true`, in `0.x`\na plain `feat` only bumps the **patch**. To cut a new **minor** (e.g. 0.2\u21920.3)\nthe commit MUST be a breaking change (`feat!:` or `BREAKING CHANGE:` footer).\n\n**The key guard:** squash-merge makes the **PR title** the commit release-please\nreads. An invalid title is silently dropped from the bump + changelog. So add a\n`pr-title` workflow that validates the title against the SAME\n`commitlint.config.js` the husky hook uses (`echo \"$PR_TITLE\" | bunx commitlint`)\n\u2014 one source of truth, no third-party action.\n\n**CHANGELOG ownership:** release-please owns versioned blocks; keep a human\n`## [Unreleased]` section on top for a curated preview \u2014 it's left untouched and\nthe generated block is inserted above it on release.\n\n**AI migration prompt:** ship a paste-able env-migration prompt\n(`.github/release-migration-prompt.md`) auto-appended to breaking releases and\nmirrored in README + docs \u2014 lets users hand their `.env`/compose/k8s to any LLM\nto upgrade.", "tech-supply-chain-pin-github-actions": "GitHub Actions run with the repo's secrets, so a compromised action = a breach.\nTreat every `uses:` as untrusted third-party code that executes in your CI.\n\n## The incident\n\nIn **March 2026**, `aquasecurity/trivy-action` had **75 tags force-pushed** \u2014 a\nknown supply-chain attack pattern where a benign tag is silently moved to a\nmalicious commit. Anyone referencing `@v0.x` (a moving tag) pulled the attacker's\ncode on the next run. (`@v0.36.0` was the pin used here.)\n\n## How to apply\n\n- **Pin every Action** to a specific version tag (`@v0.36.0`, not `@v0.x`) or,\n  better, a **commit SHA** (`@<sha>#semver:`). Tags can be force-pushed; SHAs\n  can't (without repo history rewrite). Dependabot keeps SHA pins fresh.\n- **Two-phase Trivy scan** (report, then fail) \u2014 avoids re-running the expensive\n  setup and separates \"show me the vulns\" from \"gate the build on them\":\n  1. **Report job** \u2014 `trivy-action` with `exit-code: 0` (always succeeds, emits\n     the SARIF/JSON report).\n  2. **Fail-on-severity job** \u2014 `trivy-action` with `skip-setup: true` (reuses the\n     install) + `exit-code: 1` + `severity: CRITICAL,HIGH`.\n\nRelated pipeline hygiene: see [[tech-release-please-squash-pipeline]] and\n[[tech-codebase-maintenance-loop]].", "tech-cloudflare-ai-gateway-proxy": "Cloudflare AI Gateway keeps **no per-model allow-list**. It never rejects a\nrequest because a model is \"unsupported\" by Cloudflare \u2014 it only resolves which\n**upstream/provider** to route to and forwards the model string unchanged. So you\ncan serve a brand-new model the moment the **upstream provider** hosts it; no\nwaiting on Cloudflare.\n\n- **Custom & per-provider endpoints** (`.../<gateway>/custom-{slug}/...`): the\n  model is never parsed \u2014 everything after `custom-{slug}/` is appended to the\n  registered `base_url` and forwarded verbatim. Creating a custom provider needs\n  only `name`/`slug`/`base_url` \u2014 no model registration.\n- **Universal / `compat` endpoint** (`model: \"provider/model\"`): AI Gateway parses\n  only the **provider prefix** to pick a route. The error `\"X is not a valid model\n  ID\"` here means an **unknown provider prefix**, never an unsupported model.\n- A `\"... is not a valid model ID\"` in the AIG dashboard is the **upstream's**\n  rejection (the model isn't hosted there), not AI Gateway's. Debug upstream\n  availability, not gateway config.\n\n**Proven:** routing `nvidia/cosmos3-nano-reasoner` through a custom NVIDIA provider\nreached `integrate.api.nvidia.com` and NVIDIA rejected it (model is self-host\nNIM/HF-weights only, not on the hosted API). AIG passed it through fine.", "tech-cloudflare-pages-deploy": "Each [[project-duyet-net]] app deploys to Cloudflare Pages\n(`scripts/cf-deploy-prod.sh`, per-app `pnpm run cf:deploy:prod`,\n`pages_build_output_dir = \"dist/client\"`).\n\n**Per-task convention:** semantic commit \u2192 push to `master` \u2192 background-deploy\nthe changed app, then continue; verify production (`curl` \u2192 200) after the\ncompletion notification.\n\n**Hazard:** never run two background deploys in parallel \u2014 the script renames\n`.env.local` \u2192 `.env.local.deploy-bak` mid-run, so parallel runs collide and lose\nthe CF API token.\n\n**CI (`cf-deploy.yml`):** matrix over apps on push to `master`; the blog entry\nadds rust-toolchain + wasm-pack + `wasm:build:release` before build (see\n[[tech-rust-wasm-prerender]]); other apps skip it.\n\n**commitlint:** `subject-case` lowercase, `body-max-line-length` 100. Pre-commit\nhook runs `pnpm run test`. Root checks before completing a multi-file task:\n`pnpm run lint` (Biome) + `pnpm run check-types` + `pnpm run test`. Aligns with\n[[feedback-working-style]]; run autonomously by [[project-duyetbot]].", "tech-cloudflare-workers-cache": "**Workers Cache** (launched 2026-07-06) is a tiered cache that sits **in front of\na Worker**, belonging to the Worker (not the zone). On a cache HIT the Worker\nnever runs \u2014 no CPU billing, response served from the nearest tier. This is the\nmissing piece for SSR-on-Workers (TanStack Start / Astro / Next / Hono are *the\norigin*, so every request used to re-render).\n\n## Enable (one line, per worker)\n\n```jsonc\n// wrangler.jsonc            // wrangler.toml\n\"cache\": { \"enabled\": true } // [cache]\\nenabled = true\n```\n\nEnabling is **safe by default**: only responses with an explicit **public**\n`Cache-Control` are stored; everything else is a MISS/BYPASS. Requests carrying\nan `Authorization` header **auto-bypass** (great for authed APIs \u2014 inference /\n`Bearer` / `ak_` keys never cache).\n\n## Control with standard headers (no rules engine, no zone config)\n\n```ts\nreturn new Response(body, { headers: {\n  \"Cache-Control\": \"public, max-age=300, stale-while-revalidate=3600\",\n  \"Cache-Tag\": \"products,product:123\",     // tag-based purge\n  \"Vary\": \"Accept, Accept-Language\",        // one URL \u2192 many cached variants\n}})\n```\n\n- **`max-age`** = fresh window (served from cache, Worker idle).\n- **`stale-while-revalidate`** = serve stale instantly (`Cf-Cache-Status:\n  UPDATING`) while a background refresh runs \u2014 *no user ever waits*. This is what\n  makes it \"feel static\".\n- **`Vary: *`** disables caching. Normalize headers in a gateway before `Vary` to\n  avoid variant fan-out.\n\n## Purge / multi-tenant / per-entrypoint\n\n- Purge from the **owning entrypoint**: `await ctx.cache.purge({ tags: [...] })`\n  / `{ prefix: \"/x\" }` / `{ purgeEverything: true }` (scoped to that entrypoint\n  only).\n- **Per-user safety:** identity passed via `ctx.props` is part of the cache key,\n  so an authed API caches per-user with no cross-tenant leaks. Pattern:\n  gateway authenticates \u2192 strips `Authorization` \u2192 sets `ctx.props.userId` \u2192\n  calls a cached inner entrypoint.\n- **Per-entrypoint control** in wrangler `exports`: disable cache on the\n  gateway/router entrypoint (must always run), enable on the expensive inner one.\n  The cache becomes a *layer inside one Worker*, between `ctx.exports` calls.\n\n## How to apply (rules I use)\n\n1. Enable `cache.enabled` on every public-facing Worker \u2014 it's a no-op until you\n   add public `Cache-Control`.\n2. Add `Cache-Control: public, \u2026` **only** to genuinely public, non-user-specific\n   GET responses: SSR marketing/docs/blog pages, static datasheets/catalogs,\n   sitemaps/robots/llms.txt, public read-only list APIs, health.\n3. **Never** public-cache authed / per-user / personalized / mutating routes \u2014\n   leave them uncacheable (Authorization auto-bypasses anyway).\n4. TTL rule of thumb: content pages `max-age=300, swr=86400`; near-static\n   (cv/photos/model datasheets) `max-age=3600, swr=604800`; volatile list APIs\n   `max-age=60, swr=300`.\n5. **Billing gotcha:** once cache is enabled, static-asset requests and\n   worker-to-worker (service binding / `ctx.exports`) calls bill at the standard\n   *request* rate (each consults the cache); HITs still cost 0 CPU.\n\nRolled out across duyet's CF fleet 2026-07: [[project-anyrouter]],\n[[project-chmonitor-one-codebase-saas]], [[project-duyet-net]] monorepo, and\nagentstate \u2014 see each repo's own `workers-cache` KB note for the endpoint map.", "tech-traefik-forwardauth-oauth2-proxy": "Pattern for protecting k8s services behind GitHub OAuth2 via Traefik forwardAuth.\n\n## Architecture\n\n```\nRequest \u2192 Traefik IngressRoute\n  \u2192 forwardAuth middleware (points to auth-redirector:9190/auth)\n    \u2192 auth-redirector (nginx) proxies to oauth2-proxy:4180/oauth2/auth\n      \u2192 200: pass through (authenticated)\n      \u2192 401: nginx intercepts \u2192 302 to oauth2-proxy login\n```\n\n## Key insight: why nginx redirector is needed\n\nTraefik's `ErrorPages` middleware replaces the response body but **keeps the original status code**. When oauth2-proxy returns 302 on unauthenticated requests, ErrorPages rewrites it \u2014 the redirect never reaches the browser. The nginx redirector intercepts the 401 from oauth2-proxy and returns its own 302 with the correct `Location` header. This is a known Traefik limitation, not a bug.\n\n## OAuth2 Proxy callback URL\n\nMust use the proxy prefix path `/oauth2/callback`, not `/callback`:\n\n```\nredirect-url: \"https://auth.example.com/oauth2/callback\"\nlogin URL:     \"https://auth.example.com/oauth2/start?rd=<original-url>\"\n```\n\n## Traefik Middleware config\n\n```yaml\napiVersion: traefik.io/v1alpha1\nkind: Middleware\nspec:\n  forwardAuth:\n    address: http://auth-redirector.<ns>.svc.cluster.local:9190/auth\n    authResponseHeaders:\n      - X-Auth-Request-Email\n      - X-Auth-Request-User\n    trustForwardHeader: true\n```\n\nApply to IngressRoute via `middlewares` annotation or CRD middleware chain.", "tech-qdrant-hnsw-tuning": "## What Qdrant is\nVector database: stores embeddings + payload (metadata), does approximate\nnearest-neighbour (ANN) search by vector similarity, optionally pre-filtered by\npayload. A \"collection\" = one vector space (fixed dimension + distance metric).\n\n## HNSW \u2014 the ANN index\n**Hierarchical Navigable Small World**: a multi-layer proximity graph. Each\npoint links to its nearest neighbours; upper layers are sparse \"express lanes\",\nlower layers dense. Search greedily hops toward the query \u2014 **logarithmic**, not\na full scan. Key params:\n- `m` \u2014 links per node (graph density). Higher = better recall, more RAM. 16 is a good default.\n- `ef_construct` \u2014 candidate list size at build time. Higher = better index quality, slower build. 200 is solid.\n- `full_scan_threshold` \u2014 below this many points (or post-filter subset), Qdrant does brute force instead of HNSW. **A tight payload filter can drop you under this \u2192 silent full scan.**\n\n## Why high-dim collections time out\nCost scales with **dimension \u00d7 points searched**. A 4096-d float32 vector is\n2.67\u00d7 a 1536-d one. With default HNSW (`ef_construct=100`) **or** a filter that\nforces full scan, search over full-precision 4096-d vectors blows past a tool's\ntimeout. Symptom: *some* queries return, others time out on the *same*\ncollection (the slow ones are filtered/borderline \u2192 full scan).\n\n## The fix: quantization\n**INT8 scalar quantization** stores a 1-byte proxy per dimension (4\u00d7 smaller\nthan float32), kept in RAM (`always_ram=true`). HNSW traverses the cheap int8\nvectors, then **rescores** the top candidates at full precision (kept on disk).\nThis is the dominant speedup at high dimensions. Combine with `on_disk=true`\nvectors so RAM holds only the quantized index.\n\n## Gotchas\n- **Config applies only at `create_collection`.** Changing creation code does\n  NOT retro-fit an existing collection. Apply in-place with `update_collection`\n  (sets `hnsw_config` / `quantization_config` \u2014 re-optimizes, **no re-embed**),\n  or recreate/reindex.\n- **Payload indexes are separate.** Filtered search (`language=en`, category\u2026)\n  needs a payload index per field or it scans. Create explicitly.\n- **Centralize creation config** in one helper so every collection (and future\n  blue-green swaps) inherits HNSW + quantization, instead of bare `VectorParams`.\n\n## Verify / remediate a live collection\n- `client.get_collection(name)` \u2192 inspect `config.hnsw_config`, `quantization_config`.\n- `client.update_collection(name, quantization_config=..., hnsw_config=...)` \u2014 in-place.\n- List payload indexes via `get_collection(...).payload_schema`.", "lessons-oma-selfhost-deploy": "Companion to [[tech-oma-k3s-deploy]] (the how-to). This is the **what-bit-us** list, in the order it bit.\n\n## 1. The self-host binary is a DIFFERENT app than the docs imply\nThe Cloudflare/full build is `apps/main`; the Node self-host is `apps/main-node`, a *separately assembled* Hono app that mounts routes one-by-one. It runs from **source** via `tsx src/index.ts` (no bundle) \u2014 so you can read the exact live routing with `kubectl exec ... grep app.route /app/apps/main-node/src/index.ts`. Several `apps/main` features are only **stubbed** in main-node:\n- `GET /v1/model_cards` \u2192 hardcoded `{data:[]}`; **no POST/PUT/DELETE, no ModelCardsService, no table**. So BYOK model cards can't be created on self-host at all.\n- `GET /v1/integrations/*/credentials` \u2192 `{data:[]}` stubs.\nLesson: when a self-host endpoint 404s or returns empty, **read the actually-listening app's source**, don't assume the documented/full-build behavior. A 404 with `{\"error\":\"not found\"}` was the app's global `app.notFound`, not a routing-order bug \u2014 I initially mis-diagnosed it as the latter.\n\n## 2. BYOK + uncapped max_tokens = every turn 502s\nSymptom: agent runs fail `finish_reason:\"error\", \"Failed after 3 attempts. Last error: Bad Gateway\"`. Root cause chain:\n- OMA's default harness calls `streamText()` with **no `maxOutputTokens`** \u2192 AI SDK defaults to provider max (4096 for Anthropic).\n- AnyRouter routed the model to an **openrouter-byok** upstream (bills the user's *OpenRouter* account, NOT AnyRouter's own credit balance).\n- BYOK upstreams reject when the **requested** max exceeds the affordable balance \u2014 regardless of how tiny the real output is.\nProof: same in-pod key + model at `max_tokens:16` \u2192 HTTP 200; at 4096 \u2192 502. And a fat AnyRouter `monthly_balance` (e.g. $162) does **not** help \u2014 BYOK bills elsewhere.\nFixes (any one): (a) add `maxOutputTokens` cap to the harness \u2014 shipped as opt-in env `OMA_MAX_OUTPUT_TOKENS` (duet PR #4); (b) top up the BYOK upstream account; (c) disable BYOK so requests bill AnyRouter credit.\nLesson: \"upstream 502 after retries\" from a gateway usually means the *upstream* rejected the request params (here: unaffordable max_tokens), not a transient network blip. Check the `anyrouter_metadata.upstream.provider` field \u2014 `*-byok` changes who pays.\n\n## 3. pnpm v11 `strictDepBuilds` hard-fails the Docker build\nThe ghcr image workflow failed at `pnpm install --frozen-lockfile` with `[ERR_PNPM_IGNORED_BUILDS]` on `@google/genai`, `@mongodb-js/zstd`, `node-liblzma`. pnpm v11 refuses to *silently* skip a dependency's postinstall script \u2014 every script-bearing dep must be **explicitly listed** in `allowBuilds` (the v11 map that replaced the `onlyBuiltDependencies` array; v11 reads it from `pnpm-workspace.yaml`, and **ignores** the `pnpm` block in package.json). `true`=run the build (needs a toolchain in the image), `false`=explicitly skip. A local build with an older, lenient pnpm hid this \u2014 CI on a fresh runner (corepack pinned `pnpm@11.0.8`) surfaced it. Fix: add the three as `false` (they ship prebuilt binaries; the live image runs fine without their gyp rebuilds), avoiding pulling build-essential into the image.\nLesson: pin `packageManager` AND keep `allowBuilds` complete, or the image build breaks the moment a new script-bearing transitive dep appears. `.pnpm-approve-builds.json` in this repo is legacy/unused by v11 \u2014 the yaml `allowBuilds` is authoritative.\n\n## 4. GitOps / k8s propagation gotchas\n- **ConfigMap changes don't reach a running pod** \u2014 env is injected at container start. After Argo syncs a ConfigMap edit, you still need `kubectl -n oma rollout restart deploy/oma`.\n- Initial deploy used **locally-built images imported to containerd** (`k3s ctr images import`) with `imagePullPolicy: Never`. Fast to bootstrap, but every code change then needs a rebuild+reimport. Migrating to `ghcr.io` pull (CI-published) removes that, at the cost of an image-source + pullPolicy change in the deployment.\n- Building images on the Mac (OrbStack buildx) then `docker save | ssh | ctr import` **filled the node disk** once and restarted OrbStack mid-cleanup. Build only the image you need, prune aggressively, prefer CI\u2192registry over local\u2192ctr for anything repeated.\n\n## 4b. LIVE WIN \u2014 Phase-E tool-use demonstrated\nAchieved a green agentic completion on k3s: an OMA agent on `google/gemini-2.5-flash` routed through **AnyRouter `/chat/completions`**, executed a **bash tool** (`echo \u2026 && uname -sm` \u2192 `hello-from-OMA / Linux x86_64`), and returned a final message \u2014 trajectory `is_error:false`, `finish_reason:tool-calls` then `stop`, billed to AnyRouter credit (used +$0.45). What unblocked it:\n- **BYOK is a dead end for Anthropic here.** All `anthropic/*` route to `openrouter-byok` (exhausted \u2192 502); AnyRouter's $160 credit does NOT cover BYOK. Only non-Anthropic models (gemini/deepseek) work, via `/chat/completions`, on credit.\n- **Node self-host was hardwired to Anthropic `/messages`** (`buildModel` in `apps/main-node/src/index.ts` passed `compat=undefined`). Added env `OMA_API_COMPAT=oai` (duet PR #6) so it uses the OpenAI-compatible wire format; also had to keep the FULL `provider/model` id (not strip the prefix) for the oai branch, else AnyRouter 404s `model_unavailable`.\n\n## 4c. Building the image ourselves (no CI) \u2014 gotchas\nBuilt `openma/main-node:dev` locally and imported to k3s (docker on the node is **masked** deliberately; OrbStack on the Mac was down \u2014 `orb start`).\n- **Cross-arch (ARM Mac \u2192 amd64 node) via qemu emulation is flaky:** the console `vite build` fails `MODULE_NOT_FOUND` under emulation \u2192 use `--build-arg SKIP_CONSOLE=1` for an API-only bridge image (CI on native amd64 doesn't hit this). apt-get in the runtime stage also intermittently fails \u2014 just retry.\n- **`--load` into the docker daemon can OOM/crash OrbStack** on a big emulated image \u2192 export straight to a tar: `--output type=docker,dest=img.tar`, and pass `-t name:tag` or the tar's `RepoTags` is null and `ctr import` lands it unnamed.\n- Import: `scp` the tar, then `k3s ctr -n k8s.io images import img.tar` (k8s.io namespace, needs sudo).\n- **THE BIG TRAP \u2014 `imagePullPolicy: Never` + a mutable tag caches the OLD image.** After re-importing `:dev`, `ctr images ls` shows the new digest but **`crictl images` (what kubelet uses) still maps the tag to the old config digest**, so `rollout restart` keeps launching the old code. `scale 0` + `crictl rmi` + re-import didn't fully clear it either. **What worked:** import under a NEW unique tag (`:v5`) and `kubectl set image deploy/oma main-node=\u2026:v5` \u2014 a fresh tag has no stale kubelet cache. (For real, use CI\u2192ghcr with immutable/digest tags and `pullPolicy: IfNotPresent`.)\n\n## 5. Process / guardrail lessons\n- The auto-mode classifier blocks: materializing secrets into tool output (print response bodies, never key bytes \u2014 use `node -e` with the key kept in `process.env`), self-merging your own fresh PRs with `--admin`, and shared-cluster mutations. Don't launder around these \u2014 surface and hand off.\n- Verify credentials/plumbing with the **smallest** possible direct call (`max_tokens:16`) before blaming credit/quota \u2014 it isolates \"key works\" from \"request too big for budget\".", "tech-oma-k3s-deploy": "**What OMA is:** self-hosted Claude Managed Agents API (Anthropic-compatible `/v1/agents` + `/v1/sessions`) with sessions, sandboxes, tools, memory, integrations, crash recovery. Node self-host (sqlite/postgres + FS) or Cloudflare (D1/KV/R2). **For k8s use the Node self-host path.**\n\n## Deploy on k3s via ArgoCD (Node self-host)\n- If the cluster already runs ArgoCD with an app-of-apps, add OMA as a new `Application` matching that repo layout; commit+push manifests so Argo syncs. Namespace-isolate as `oma`.\n- Workloads: `main-node` (API + Console) + `oma-vault`, plus postgres (or sqlite on a PVC). Images `openma/main-node` / `openma/oma-vault` \u2014 confirm they're published; if dev-only, build from the compose `build:` Dockerfiles and push to a registry the cluster can pull (or `k3s ctr images import` on-node).\n- Reuse the cluster's existing cert-manager + ingress convention to expose it rather than inventing one.\n\n## Required secrets (k8s Secret \u2014 never commit to git)\n- `ANTHROPIC_API_KEY` \u2014 any Anthropic-compatible key (an AnyRouter key works).\n- `ANTHROPIC_BASE_URL` \u2014 optional proxy base, e.g. `https://anyrouter.dev/api/v1` (SDK appends `/messages`).\n- `BETTER_AUTH_SECRET` = `openssl rand -hex 32` (signs Console sessions).\n- `PLATFORM_ROOT_SECRET` = `openssl rand -base64 32` (at-rest encryption). **Back it up** \u2014 lose it and every encrypted row (credentials, model-card keys) is unreadable.\n\n## Use it \u2014 spawn an agent (AnyRouter as the model plane)\nAnthropic-compatible; auth via `x-api-key`. Route models through AnyRouter with a BYOK **model card** (no code change):\n1. `POST /v1/model_cards` with `provider:\"oai-compatible\"`, `base_url:\"https://anyrouter.dev/api/v1\"`, `model:\"stepfun-ai/step-3.7-flash\"`, and the AnyRouter key as the card credential \u2014 the card's `base_url` overrides upstream and custom headers propagate.\n2. `POST /v1/agents` \u2014 create the agent (OMA-specific fields like `harness`/`runtime_binding` nest under `_oma:` so stock Anthropic SDKs ignore them).\n3. `POST /v1/sessions`, then post a message \u2192 SSE stream of the turn. That spawns the agent run.\n\n## Verified run flow + gotchas (node self-host)\nOrder that actually works against a live node self-host:\n1. **Bootstrap a user** \u2014 no default admin; email/password signup requires verification but self-host has no SMTP (`sendEmail` no-ops when `SEND_EMAIL` unset \u2014 the code isn't even logged). Seed one: POST `/auth/sign-up/email`, then set `emailVerified=1` in `/app/data/auth.db` (`node:sqlite`, table `user`). Then sign-in works.\n2. **Mint an API key** \u2014 POST `/v1/api_keys` with the better-auth session cookie \u2192 returns an `oma_\u2026` key once. Use it as `x-api-key` for `/v1/*`.\n3. **Create agent** \u2014 POST `/v1/agents` `{name,model,system,tools}`; OMA-only fields nest under `_oma:` (e.g. `runtime_binding`).\n4. **Create session** \u2014 body field is **`agent`** (not `agent_id`, despite older self-host.md), and a non-local-runtime agent needs **`environment_id`** \u2014 main-node accepts ANY id (returns a synthetic local-runtime env), e.g. `\"env-local-runtime\"`.\n5. **Drive** \u2014 POST `/v1/sessions/:id/events` `{events:[{type:\"user.message\",content:[{type:\"text\",text:\"\u2026\"}]}]}`; read `/v1/sessions/:id/trajectory` or `/events/stream`.\n\nBugs / friction found \u2014 root-caused live (the running pod serves **`apps/main-node`** from source via `tsx`, NOT the full `apps/main` Hono app):\n- **Model cards write-path is UNIMPLEMENTED in the Node self-host.** `main-node/src/index.ts` only registers a read stub `v1.get(\"/model_cards\", c => c.json({data:[]}))` \u2014 no POST/PUT/DELETE, no `ModelCardsService`, likely no `model_cards` table. So `POST /v1/model_cards` matches nothing and falls through to that app's global `app.notFound \u2192 {\"error\":\"not found\"}` (404). (Earlier theory that a routing-order/integrations bug swallowed it was WRONG \u2014 it's just an unported feature. Integrations are stubbed the same way: `v1.get(\"/integrations/*/credentials\")` only.) Registering BYOK oai-compatible / free models therefore needs the feature built, not a route reorder.\n- **Uncapped output tokens \u2192 BYOK 502.** Harness `streamText` (default-loop.ts:408) sets no `maxOutputTokens` \u2192 SDK default **4096**. When AnyRouter routes to an **openrouter-byok** upstream (bills the user's OpenRouter account, NOT AnyRouter's own credit balance), it rejects when the *requested* max exceeds the affordable budget \u2014 surfaces in OMA as `finish_reason:\"error\", \"Failed after 3 attempts. Last error: Bad Gateway\"` after 3 retries. **Confirmed:** same in-pod key + model at `max_tokens:16` \u2192 HTTP 200; at 4096 (OMA default) \u2192 502. Note AnyRouter `monthly_balance` (e.g. $162) does NOT cover BYOK upstreams \u2014 BYOK bills elsewhere. **Fix shipped:** PR #4 `duyet/open-managed-agents` adds opt-in `OMA_MAX_OUTPUT_TOKENS` env cap; set it (e.g. `1024`) in the OMA ConfigMap for BYOK/low-budget self-hosts. Alternative: turn off BYOK so requests bill AnyRouter credit.\n- Default provider uses AnyRouter's Anthropic-native `/messages` \u2192 only `anthropic/*` model ids route cleanly; non-anthropic ids get their `provider/` prefix mangled. Reaching free `/chat/completions` models needs the (unimplemented) model-cards write-path above.\n\n## Flue / sandbox interop\n- The real harness contract is a class `implements HarnessInterface` (`apps/agent/src/harness/interface.ts`), NOT the README's unimplemented `defineHarness`. Register with `registerHarness(\"name\", \u2026)`; mirror the `AcpProxyHarness` meta-harness pattern to embed another framework's loop.\n- Sandbox port `SandboxExecutor.exec` returns a **string** with an `[exit N]` suffix (not structured) \u2014 parse it when adapting to a framework that wants `{stdout,stderr,exitCode}`. Adapters live in `packages/sandbox/src/adapters/`.\n- k8s agent code-exec sandboxes: the kubernetes-sigs **agent-sandbox** CRD (Sandbox/SandboxWarmPool/SandboxClaim) is the standard building block; pair with gVisor/Kata for untrusted-code isolation.", "tech-ai-agent-stack": "The 2026 stack for building LLM agents, by layer:\n\n- **Orchestration (Python):** LangGraph (graph/state machines), LlamaIndex\n  (RAG + agents), PydanticAI, CrewAI, AutoGen, OpenAI Agents SDK, Google ADK.\n- **Orchestration (TS/JS):** Vercel **AI SDK** (streaming, tools, `ToolLoopAgent`),\n  Mastra, LangGraph.js, Cloudflare Agents (Durable Objects), OpenAI Agents SDK,\n  Claude Agent SDK.\n- **Model gateways:** OpenRouter, AnyRouter, LiteLLM \u2014 swap providers without code churn.\n- **Interop protocol:** **MCP** (Model Context Protocol) for tools/resources; A2A\n  for agent-to-agent.\n- **Memory / RAG:** vector stores (Qdrant, pgvector), LlamaIndex; explicit\n  short/long-term + reflection memory for agentic loops.\n- **Eval / observability:** LangSmith, Langfuse, Braintrust.\n- **Runtime / deploy:** Cloudflare Workers + Durable Objects, Vercel.\n\n**Duyet uses** (see [[user-duyet-ai-stance]]): Claude Code as driver; Claude Agent\nSDK, OpenAI Agents SDK, Cloudflare Agents, Vercel AI SDK, LlamaIndex, LangChain;\nOpenRouter/AnyRouter for routing; MCP (mcp.duyet.net). Core pattern: plan \u2192\nexecute \u2192 test \u2192 reflect with persistent memory.", "tech-eve-framework": "**eve** = Vercel's filesystem-first framework for durable backend AI agents (npm `eve`,\nNode 24+). An agent is a directory under `agent/`; eve compiles + runs it, persists every\nsession, serves it over HTTP. Docs ship in `node_modules/eve/docs/` \u2014 read these, they\nmatch the installed version.\n\n## File layout (everything is a file)\n- `agent/agent.ts` \u2014 `defineAgent({ model, modelContextWindowTokens })`.\n- `agent/instructions.md` \u2014 always-on system prompt (identity/rules).\n- `agent/connections/<name>.ts` \u2014 `defineMcpClientConnection({url,description,auth?,tools?,approval?})`\n  or `defineOpenAPIConnection`. Name = filename. Model calls `connection__<name>__<tool>`\n  via `connection__search`; creds never reach the model.\n- `agent/skills/<name>/SKILL.md` (or flat `.md`) \u2014 load-on-demand procedures (`load_skill`);\n  `description` frontmatter is the routing hint. `defineSkill` for typed/packaged.\n- `agent/tools/<snake_case>.ts` \u2014 `defineTool({description, inputSchema: zod, execute})`.\n  Filename = tool name. Gate side effects with `needsApproval: always()/once()` (`eve/tools/approval`).\n- `agent/channels/eve.ts` \u2014 `eveChannel({ auth: [...] })`. Auth is **fail-closed**;\n  `placeholderAuth()` blocks browsers in prod \u2014 use `none()` (`eve/channels/auth`) as the\n  last entry for a public web chat.\n- State: `defineState(name, initial)` from `eve/context` \u2014 durable but **session-scoped**\n  (get/update). Cross-session data \u2192 a connection or external store.\n- HITL: built-in `ask_question` tool (model asks the user); approvals via `needsApproval`.\n\n## Gotchas (learned building eved)\n- **Imports between agent modules must use the real `.ts` extension** (`./model.ts`, not\n  `./model.js`). eve runs raw TS via Node 24 native type-stripping, which does NOT rewrite\n  `.js`\u2192`.ts`; the docs' `.js` convention fails the dev runtime (`ERR_MODULE_NOT_FOUND`).\n  Set `allowImportingTsExtensions: true` so tsgo accepts it. eve's generated\n  `module-map.mjs` uses `.ts` \u2014 that's the tell.\n- Commands: `eve dev|build|start|info`; typecheck via `tsgo`. `eve info` = quick compile check.\n- **Frontend**: `eve/next` `withEve(nextConfig)` + `eve/react` `useEveAgent()`; same dir,\n  `agent/` at root. assistant-ui bridges cleanly via `useExternalStoreRuntime`.\n- `npx skills add <gh-repo>` vendors the WHOLE source repo (incl. its own CLAUDE.md/AGENTS.md\n  \u2192 pollutes your agent's context). Prefer a self-contained `.claude/skills/<n>/SKILL.md`.\n\nFirst used building **eved** (github.com/duyet/eved): a public Duyet-assistant agent on eve\n+ AnyRouter, with duyet / firecrawl / clickhouse-monitor MCP connections.", "tech-flue-provider-registration": "Flue addresses models as `provider/model`. A custom gateway (AnyRouter, OpenRouter, any OpenAI-compatible endpoint) is a provider you register with `registerProvider(id, { api:'openai-completions', baseUrl, apiKey })`. Model then = `anyrouter/stepfun-ai/step-3.7-flash` (provider id + upstream path).\n\n**The gotcha (verified):** the API key must be a real value **at the moment `registerProvider` runs**. Flue's `getProviderApiKey` reads ONLY the registration's stored `apiKey` \u2014 no env-var fallback. And Flue does NOT populate `process.env` from `.env.local` at module-eval time:\n- Node target: initializer `env` is the shell `process.env`; `.env.local` is not loaded there at all (it's a wrangler/Cloudflare mechanism).\n- Cloudflare target: `.env.local` becomes the worker `env` binding, available in the initializer \u2014 not in module-scope `process.env`.\n\nSo registering in `app.ts` / module top-level with `process.env.X` gets `undefined` \u2192 runtime error `No API key for provider: <id>`.\n\n**Fix:** register inside `defineAgent`'s initializer, from `ctx.env` (idempotent / last-write-wins, so per-init is fine):\n```ts\nexport default defineAgent(({ env }) => {\n  registerProvider('anyrouter', {\n    api: 'openai-completions',\n    baseUrl: 'https://anyrouter.dev/api/v1',\n    apiKey: env.ANYROUTER_API_KEY,\n  });\n  return { model: 'anyrouter/stepfun-ai/step-3.7-flash', instructions: '...' };\n});\n```\n\n**Debugging note:** the Cloudflare/workerd target swallows errors as an opaque `500 internal_error`. Reproduce with `flue run <agent> --target node` \u2014 node surfaces the real error (`No API key\u2026`, `401 Invalid API key`, etc.). Also: `AgentRuntimeConfig` has no `output` field \u2014 structured output is per-call via `session.prompt({ result: schema })`, not an agent-level option. Channel modules (e.g. `createGitHubChannel({ webhookSecret })`) hit the same env-timing issue since they construct at module load \u2014 the secret must be present in the process env when the module evaluates.", "tech-hermes-agent-custom-provider": "Hermes agent configuration for custom OpenAI-compatible LLM providers.\n\n## Custom provider registration\n\nTwo-part config in `hermes.yaml`:\n\n1. **`custom_providers` list** \u2014 registers the provider by name, base_url, model, and api_key\n2. **`model.provider: custom`** \u2014 tells Hermes to look up from custom_providers instead of built-in\n\n```yaml\nmodel:\n  api_key : ${API_KEY}\n  base_url: ${API_BASE}\n  default: 'provider-name/model-name'\n  provider: custom          # <-- required to use custom_providers\ncustom_providers:\n  - api_key : ${API_KEY}\n    base_url: https://example.com/api/v1\n    model: actual-model-id\n    name: provider-name     # referenced in default as \"provider-name/model\"\nproviders: {}               # clear built-in providers if not needed\n```\n\n**Gotcha:** `providers` must be set to `{}` if you don't want built-in providers loaded. Leaving it out may cause conflicts.\n\n## Steer mode (busy_input_mode)\n\n```yaml\ndisplay:\n  busy_input_mode: steer\n  busy_ack_enabled: true\n```\n\n- `steer`: when the agent is busy processing, new user messages are queued and the agent adjusts its current task to incorporate them (rather than ignoring or queuing blindly)\n- `busy_ack_enabled: true`: sends a brief acknowledgment so the user knows the message was received\n- Alternative values: `reject`, `queue` (agent-specific)", "tech-hermes-dashboard-auth": "Hermes (`nousresearch/hermes-agent`) ships a bundled **`nous`** dashboard-auth\nplugin (OAuth 2.0 auth-code + PKCE vs Nous Portal `portal.nousresearch.com`).\nSource of truth when docs are scarce: read the bundled plugin at\n`/opt/hermes/plugins/dashboard_auth/nous/` inside the running image.\n\n- **Gate is independent of providers.** `web_server.should_require_auth(host, allow_public)`\n  decides if the in-app auth gate engages: **loopback host \u2192 off**; **non-loopback\n  + `insecure`/`--insecure` \u2192 off**; **non-loopback + not insecure \u2192 ON**. A\n  registered provider (nous/OIDC/basic) is only *consulted* when the gate is ON.\n  `allow_public` = `HERMES_DASHBOARD_INSECURE=1`.\n- **nous activation \u2014 two gates, both required (on the `main` build):**\n  (1) **opt-in allow-list** \u2014 `main` made bundled plugins opt-in; `nous` loads\n  only if listed in `plugins.enabled` (config.yaml; set via `hermes plugins enable`\n  OR, for chart-managed deploys, in `config.values`). (2) **client_id** \u2014 env\n  `HERMES_DASHBOARD_OAUTH_CLIENT_ID` (chart `dashboard.auth.oauthClientId`) wins\n  over config.yaml `dashboard.oauth.client_id`; shape `agent:{instance_id}`; empty\n  \u2192 provider skipped (no-op). See [[tech-hermes-agent-custom-provider]].\n- **Overwrite trap:** the chart's `config.overwrite: true` rewrites config.yaml\n  from the ConfigMap every boot, so a runtime `hermes plugins enable` is wiped on\n  restart. Put `plugins.enabled: [nous]` in `config.values` instead (deep-merge\n  keeps it over the default `[]`). Verified: log line\n  `dashboard-auth-nous: registered provider (client_id=\u2026, portal=https://portal.nousresearch.com)`.\n- **Redirect-URI tiers** (`dashboard_auth/routes.py:_redirect_uri`):\n  `dashboard.public_url`/`HERMES_DASHBOARD_PUBLIC_URL` \u2192 else `X-Forwarded-Host`+`Proto`\n  \u2192 else request URL. The **Portal allowlist is authoritative** (plugin's local\n  check allows any `http(s)://\u2026/auth/callback`).\n- **Homelab gotcha:** instance runs `insecure: true` behind Traefik forwardAuth\n  (see [[tech-traefik-forwardauth-oauth2-proxy]]), so the gate never engages \u2192\n  registering nous is **dormant** (no effect). The default Portal allowlist is\n  `http://localhost:<port>/auth/callback` only, so it can't authenticate an\n  Ingress URL \u2014 to make nous the real dashboard auth you must: turn insecure OFF,\n  set `dashboard.public_url`, and add the public callback to the Portal allowlist.", "tech-okf-open-knowledge-format": "**Open Knowledge Format (OKF) v0.1** \u2014 Draft. Published by Google Cloud (Sam\nMcVeety, Amir Hormati) 2026-06-13. Canonical spec: `GoogleCloudPlatform/knowledge-catalog/okf/SPEC.md`.\n\nAn open, vendor-neutral standard for the **markdown + YAML-frontmatter\n\"LLM-wiki\"** pattern \u2014 the same pattern [[feedback-docs-driven-development]] and\nthis repo already use. \"Just markdown, just files, just YAML frontmatter.\" No\nruntime, no SDK, no compression.\n\n## Shape\n\n- **Bundle** = a directory tree of `.md` files. **Concept** = one `.md` file.\n  **Concept ID** = the file path with `.md` removed (the *path is the identity*).\n- **Reserved filenames** (MUST NOT be concepts): `index.md` (directory listing\n  for progressive disclosure), `log.md` (chronological change history, newest\n  first, ISO 8601).\n- Concepts link via **standard markdown links** (bundle-relative `/x.md` or\n  relative `x.md`) \u2192 a graph richer than the folder hierarchy. Consumers MUST\n  tolerate broken links.\n- **Frontmatter \u2014 REQUIRED: only `type`** (free-form string, not centrally\n  registered; e.g. `BigQuery Table`, `Metric`, `Playbook`, `Reference`).\n  Recommended: `title`, `description`, `resource` (URI of the asset), `tags`,\n  `timestamp` (ISO 8601). Producers MAY add custom keys; **consumers MUST\n  preserve unknown fields** and tolerate unknown `type`s.\n- Conventional body headings: `# Schema`, `# Examples`, `# Citations`.\n\n## Three design principles\n\n1. **Minimally opinionated** \u2014 only `type` is mandated; spec defines the\n   *interoperability surface*, not the content model.\n2. **Producer/consumer independence** \u2014 the format is the contract; tooling at\n   each end is swappable (human-authored \u2194 agent-consumed).\n3. **Format, not platform** \u2014 no cloud / DB / model / agent-framework lock-in.\n\n## Gotcha: the reference validator is stricter than the prose\n\nThe prose requires only `type`, but Google's reference `OKFDocument.validate()`\nrejects any doc missing **`type`, `title`, `description`, `timestamp`** (all four,\nnon-empty), and Google's own sample bundles (GA4, Stack Overflow, Bitcoin) carry\nall four. So *de facto* OKF = those 4 fields. Reference tooling: a BigQuery\nenrichment agent (producer) + a self-contained static HTML graph visualizer\n(consumer).\n\n## How this repo aligns\n\nThis repo **is** a strict-conformant OKF v0.1 bundle. `memory/` is the bundle\nroot; each concept is one `.md` carrying the required `type`. Field map:\n\n| OKF field | this repo | status |\n|-----------|-----------|--------|\n| `type` | `type` (user/feedback/project/reference/tech) | \u2705 |\n| `title` / `description` | same | \u2705 |\n| `tags` | `tags` | \u2705 |\n| `resource` | `sources` (URL array vs singular URI) | \u2248 |\n| `timestamp` | `timestamp` (ISO 8601) + `created`/`updated` (dates) | \u2705 |\n| path = ID | `name:` field (= filename) \u2014 permitted custom key | \u2705 |\n| `index.md` | `memory/index.md` (generated) + `MEMORY.md` (root index) | \u2705 |\n| `log.md` | `memory/log.md` (change history, newest-first) | \u2705 |\n\nConcepts are grouped into **nested topic dirs** by domain\n(`topics/cloudflare/`, `topics/llm-agents/`, `topics/web/`, `topics/ci/`, \u2026)\nalongside the memory-layer dirs (`user/`, `feedback/`, `reference/`,\n`projects/`). Cross-links use Obsidian wikilinks (the double-bracket form) \u2014 an\nOKF-compatible producer convention; the structured graph also rides in `related:`\nfrontmatter. The official validator treats non-`/path.md` text as plain prose, so\nthis is conformant with zero warnings. The monorepo `apps/kb` app is a live\n**consumer** \u2014 see [[project-kb-duyet-net]]; `kb viz` renders a self-contained\ngraph viewer (the OKF reference consumer pattern).", "tech-flat-design-system": "Flat editorial visual language across [[project-duyet-net]
