</style>

en-development", "source": "user-duyet-site-kb", "target": "feedback-docs-driven-development"}}, {"data": {"id": "user-duyet-site-kb__project-kb", "source": "user-duyet-site-kb", "target": "project-kb"}}, {"data": {"id": "user-duyet-stack__tech-ai-agent-stack", "source": "user-duyet-stack", "target": "tech-ai-agent-stack"}}, {"data": {"id": "user-duyet-stack__user-duyet-active-projects", "source": "user-duyet-stack", "target": "user-duyet-active-projects"}}, {"data": {"id": "user-duyet-stack__user-duyet-ai-stance", "source": "user-duyet-stack", "target": "user-duyet-ai-stance"}}, {"data": {"id": "user-duyet-stack__user-duyet-data-clickhouse", "source": "user-duyet-stack", "target": "user-duyet-data-clickhouse"}}, {"data": {"id": "user-duyet-stack__user-duyet-data-spark-airflow", "source": "user-duyet-stack", "target": "user-duyet-data-spark-airflow"}}, {"data": {"id": "user-duyet-stack__user-duyet-homelab", "source": "user-duyet-stack", "target": "user-duyet-homelab"}}, {"data": {"id": "user-duyet-stack__user-duyet-infra-cloudflare", "source": "user-duyet-stack", "target": "user-duyet-infra-cloudflare"}}, {"data": {"id": "user-duyet-stack__user-duyet-infra-kubernetes", "source": "user-duyet-stack", "target": "user-duyet-infra-kubernetes"}}, {"data": {"id": "user-duyet-stack__user-duyet-lang-python", "source": "user-duyet-stack", "target": "user-duyet-lang-python"}}, {"data": {"id": "user-duyet-stack__user-duyet-lang-rust", "source": "user-duyet-stack", "target": "user-duyet-lang-rust"}}, {"data": {"id": "user-duyet-stack__user-duyet-lang-sql", "source": "user-duyet-stack", "target": "user-duyet-lang-sql"}}, {"data": {"id": "user-duyet-stack__user-duyet-lang-typescript", "source": "user-duyet-stack", "target": "user-duyet-lang-typescript"}}, {"data": {"id": "user-duyet-stack__user-duyet-local-dev", "source": "user-duyet-stack", "target": "user-duyet-local-dev"}}, {"data": {"id": "user-duyet-stack__user-duyet-profile", "source": "user-duyet-stack", "target": "user-duyet-profile"}}, {"data": {"id": "user-duyet-web-presence__user-duyet-active-projects", "source": "user-duyet-web-presence", "target": "user-duyet-active-projects"}}, {"data": {"id": "user-duyet-web-presence__user-duyet-github", "source": "user-duyet-web-presence", "target": "user-duyet-github"}}, {"data": {"id": "user-duyet-web-presence__user-duyet-profile", "source": "user-duyet-web-presence", "target": "user-duyet-profile"}}, {"data": {"id": "user-duyet-web-presence__user-duyet-site-blog", "source": "user-duyet-web-presence", "target": "user-duyet-site-blog"}}, {"data": {"id": "user-duyet-web-presence__user-duyet-site-homelab", "source": "user-duyet-web-presence", "target": "user-duyet-site-homelab"}}, {"data": {"id": "user-duyet-web-presence__user-duyet-site-kb", "source": "user-duyet-web-presence", "target": "user-duyet-site-kb"}}], "bodies": {"feedback-cheap-models-subagents": "Default sub-agents to mid/cheap tiers for mechanical work; reserve expensive models for hard reasoning.\n\n**Why:** parallel fan-out multiplies cost.\n**How to apply:** pass explicit cheaper model on dispatch. Related: [[tech-agent-loop-cheap-subagents]], [[feedback-working-style]].", "feedback-concise-english": "Use simple, short English. No filler (\"comprehensive\", \"elaborate\").\n\n**Why:** faster review, clearer agent output.\n**How to apply:** trim adverbs; prefer lists; match [[feedback-semantic-commits]].", "feedback-disambiguate-repo": "Duyet multi-homes work: chmonitor, AnyRouter, AgentState, AnyWorker, OMA, monorepo, kb, homelab.\n\n**How to apply:** if the chat is ambiguous, ask or infer from cwd/path; never assume monorepo. Index: [[user-duyet-active-projects]], [[user-duyet-multi-project]].", "feedback-docs-driven-development": "Pattern:\n\n1. [[feedback-docs-router-tiny]] \u2014 keep CLAUDE.md/AGENTS.md short\n2. [[feedback-docs-kb-is-brain]] \u2014 structured notes are the memory\n3. [[feedback-docs-read-on-entry]] \u2014 index first\n4. [[feedback-docs-write-on-exit]] \u2014 capture before context dies\n\nImplemented by [[project-kb]]. Owner stance: [[user-duyet-ai-stance]].", "feedback-docs-kb-is-brain": "A public/shared kb persists across tools and sessions. This repo is that brain: [[project-kb]].\n\n**How to apply:** atomic notes + `MEMORY.md` index + [[tech-okf-bundle]].", "feedback-docs-read-on-entry": "Trigger: session start / new task \u2192 open MEMORY.md, then only matching notes.\n\n**How to apply:** never bulk-load entire memory/. See [[feedback-docs-write-on-exit]].", "feedback-docs-router-tiny": "Router files rot if they hold feature contracts. Point to notes instead.\n\n**How to apply:** put durable facts in [[project-kb]] notes; keep routers as indexes. See [[feedback-docs-driven-development]].", "feedback-docs-write-on-exit": "Trigger: learned a durable public fact \u2192 update the existing note or append inbox, then lint/sync. Do this during the task, not only on the way out.\n\n**How to apply:** public-only (AGENTS.md \u00a73). Prefer updating an existing `memory/` note over a new file. Pair with [[feedback-docs-read-on-entry]].", "feedback-fail-loud": "Surface uncertainty and skipped work. \"Tests pass\" is false if any were skipped.\n\n**How to apply:** list what was not verified. Pair with [[feedback-logic-change-update-tests]].", "feedback-logic-change-update-tests": "If you rename contracts or change behavior tests lock, grep tests and update expected values in the same PR.\n\n**Why:** green \"new code only\" still breaks CI.\n**How to apply:** run related suite before claiming done. See [[feedback-fail-loud]], [[tech-codebase-maintenance-loop]].", "feedback-main-ci-green-fast": "On chmonitor (and similar repos): after a merge or feature batch, **check `main` CI** (`gh run list --branch main`). Required jobs (`unit-tests`, `dashboard`) must stay green. Fix red `main` before starting unrelated work.\n\n**How to apply:**\n- Do not add tests that re-query live ClickHouse when a pure unit test suffices.\n- Do not put extra system-table scans on every Insights/cron sweep if a dedicated page already owns that query \u2014 extract, share SQL, run in `Promise.all`, fail closed without blocking other collectors.\n- Watch Worker/dashboard build time; a type error that only shows in `tsc --noEmit` is a required-check fail \u2014 reproduce locally before push.\n- Cancelled runs on older SHAs after a fast merge train are expected; judge green on the **tip** SHA.\n\n**Why:** stacked auto-merges cancel mid-SHA CI; tip health and hot-path query cost are what users feel.", "feedback-never-auto-merge-release-please": "Do not arm auto-merge on release-please PRs (`chore(main): release X.Y.Z`, branches `release-please--*`).\n\n**How to apply:** fix/CI babysit only; human merges releases. See [[tech-release-please-basics]], [[project-open-managed-agents]].", "feedback-pstack-verification": "Verification is the highest-leverage skill: the agent drives the real app, captures proof, and keeps going until the change is true. Treat it as infra, not optional markdown.\n\n**Why:** Without a closed loop, a human is the bottleneck. Volume only helps if quality stays high.\n\n**How to apply:**\n- Generate `.cursor/skills/verify-<app>/` with `/create-verification-skill` (CLI lever + Feature Map + one proven drive).\n- Prefer tools over prose (\"Build the Lever\"): composable CLI, `--dry-run` on destructive commands, JSON output, rich `--help`.\n- Parallelize with Cursor cloud agents, not git worktrees.\n- Ship prompts: `/poteto-mode` plus the repo's verify skill (screenshots, video, or transcripts as proof).\n- Refresh the skill as the app changes (`/maintain-verification-skill` on ship, not a new clock wake unless asked).", "feedback-public-kb-only": "This repo is public. Store durable, generic, public facts only.\n\n**Ban:** credentials, hostnames, IPs, machine names, employer-internal codenames, private topology.\n**Allow:** public `duyet/*` GitHub repos, published blog/CV facts, reusable tech patterns.\nSee AGENTS.md \u00a73. Hub: [[project-kb]].", "feedback-semantic-commits": "Conventional Commits style. Subject: lowercase, short. Body only when needed.\n\n**How to apply:** `feat(scope): \u2026`, `fix(scope): \u2026`, `chore: \u2026`. Related: [[tech-release-please-pr-title]], [[feedback-concise-english]].", "feedback-simple-code": "Ship the smallest correct change. No unused flexibility.\n\n**Why:** less debt, easier agent diffs.\n**How to apply:** delete speculative layers; match [[feedback-surgical-changes]].", "feedback-surgical-changes": "Every changed line must map to the user request. Mention unrelated dead code; don't delete it unless asked.\n\n**How to apply:** read callers first; avoid formatting-only churn. See [[feedback-simple-code]].", "feedback-working-style": "Agent working-style index:\n\n- [[feedback-concise-english]] \u00b7 [[feedback-simple-code]] \u00b7 [[feedback-semantic-commits]]\n- [[feedback-surgical-changes]] \u00b7 [[feedback-fail-loud]]\n- [[feedback-docs-driven-development]] \u00b7 [[feedback-cheap-models-subagents]]\n- [[feedback-logic-change-update-tests]] \u00b7 [[feedback-never-auto-merge-release-please]]\n- [[feedback-main-ci-green-fast]] \u2014 keep main CI green and hot paths cheap\n\n- [[feedback-disambiguate-repo]] \u2014 multi-product sessions\n\nOwner: [[user-duyet-profile]].", "project-agentstate": "github.com/duyet/agentstate \u00b7 https://agentstate.app\n\nFleet **state/coordination** API (not an agent framework \u2014 [[tech-agentstate-not-a-framework]]). Five primitives: [[tech-agentstate-five-primitives]].\n\nProduct version is [[tech-release-please-basics]]: standing `chore(main): release X.Y.Z` PR, human-merge only ([[feedback-never-auto-merge-release-please]]). In 0.x, `feat` bumps minor (`bump-patch-for-minor-pre-major: false`). `/api` reports that semver.\n\nSDKs: npm `@agentstate/sdk`, PyPI `agentstate`. MCP available. MIT, self-hostable.\nPortfolio: [[user-duyet-active-projects]]. Related: [[project-anyworker]], [[project-open-managed-agents]], [[tech-ai-agent-stack]].", "project-anyrouter-catalog-one-id": "A public catalog id is the product slug (`owner/model`), not a host SKU. Date tags, `vision-exp`, `fast`, quantization suffixes, and casing variants belong on `upstreams[].model_name` or `aliases:` \u2014 never as sibling listing rows.\n\nExample (2026-08-28): DeepSeek V4 Flash lists as **`deepseek/deepseek-v4-flash`**. Former rows `deepseek/DeepSeek-V4-Flash`, `deepseek/deepseek-v4-flash-0731-fast`, and `deepseek/deepseek-v4-flash-vision-exp` resolve as aliases.\n\n**Why:** callers and `/models` should see one model, not three host spellings.\n**How to apply:** one lowercase `owner/model` listing id; keep working upstreams on that row; alias old ids; remove sibling YAML so it cannot occupy the id. Prefer unlist/alias over deleting history ([[project-anyrouter-unlist-broken-models]]). Do not invent ids. Do not add image/video generation endpoints.\n\nHub: [[project-anyrouter]].", "project-anyrouter-cli-native": "Public AnyRouter CLI is a **native Rust** binary, not the old Node package as the primary path.\n\n- Install: `curl -fsSL https://anyrouter.dev/setup.sh | bash`\n- Commands: `anyr` (prose) / `ar` (alias). `anyr login` then `anyr claude --model owner/model` (same for `opencode` / `codex`).\n- Catalog ids are `owner/model` (e.g. `stealth/ox-alpha`). Model page: `https://anyrouter.dev/model/<owner>/<model>`.\n- Source, issues, and binaries: [anyrouter-dev/cli](https://github.com/anyrouter-dev/cli). Product/catalog issues stay on [[project-anyrouter]] (`duyet/anyrouter`).\n- Smoke: `anyr claude --model owner/model` (example: `stealth/ox-alpha[1m]`).\n- `setup.sh` (stable) probes GitHub `/releases/latest/download/anyr-<os>-<arch>`, then falls back to the newest release that actually has binaries (often a prerelease). A bare `/releases/latest/download/...` URL can still 404 when the latest stable tag has no assets.\n- `anyr update` must not call the GitHub Releases API unauthenticated (shared IPs get 403). Use a token or the public HTML listing.\n\nHub: [[project-anyrouter]].", "project-anyrouter-openai-compat": "AnyRouter accepts OpenAI Chat Completions-shaped clients (and Anthropic Messages). Integrate by changing base URL + model id.\n\nScope: text and embeddings. Vision / OCR on **input** is kept. Image and video **generation** were dropped. `POST /api/v1/images/generations` returns `410` `endpoint_gone`.\n\nProduct hub: [[project-anyrouter]]. Gateway lessons: [[tech-llm-gateway-quota-as-retryable]].", "project-anyrouter-os": "AnyRouter OS: public Cloudflare-OS workshop. Repo: duyet/anyrouter-os.\n\nSibling of the gateway ([[project-anyrouter]]), not a replacement for the API.\n\nThe OS repo has issues disabled. File product bugs on duyet/anyrouter with title prefix `[os]`, mention the OS repo in the body, and reuse existing labels only (`follow-up`, `bug`, `frontend`, `consistency`, `documentation`).\n\nPortfolio: [[user-duyet-active-projects]]. Infra: [[user-duyet-infra-cloudflare]].\n\n**Why:** QA cannot open issues on the OS repo; the gateway repo is the shared board.\n**How to apply:** Search duyet/anyrouter for existing `[os]` titles first; comment on near-dupes; do not invent labels.", "project-anyrouter-playground-mcp": "AnyRouter playground (`https://anyrouter.dev/playground`) attaches remote HTTP MCP servers. A new conversation already has **AnyRouter MCP enabled**.\n\n- Default endpoint (from live docs, do not invent): `https://anyrouter.dev/api/v1/mcp`\n- Transport: remote HTTP / Streamable HTTP. No stdio.\n- Users can disable the default (row stays listed) and add more HTTPS MCP servers.\n- Intended auth: a signed-in Clerk session is enough (`POST /api/v1/mcp` kind `session`). Pasted `sk-ar-v1-*` / `ak_*` is an optional override. Signed-out 401 still asks to sign in or add a key. Live 2026-08-27 after #2772 a signed-in Clerk session attaches AnyRouter MCP (tools/list + initialize 200; no red key line). Do not invent tools, auth, or prices.\n\nHub: [[project-anyrouter]]. Chrome: [[project-anyrouter-ui-chrome]].\n\n**Why:** playground chat needs catalog/keys/credits tools without leaving the conversation.\n**How to apply:** default-on the documented URL; never invent a second MCP endpoint or tool list.", "project-anyrouter-ui-chrome": "AnyRouter public UI uses one viewport token system: 320 / 375 / 768 / 1024 / 1280. Mobile-first. No `overflow-x` on the page.\n\n- Tap targets: 44px. Marketing CTAs keep visible labels (do not go icon-only). Vietnamese copy is fine.\n- Color: semantic tokens only (`background`, `foreground`, `border`, `muted`). No raw hex that breaks dark. Test light and dark. Avoid a white flash.\n- Skeletons match the final layout. Do not block first paint on a hung Clerk FAPI.\n- Playground compact chrome is one 44px row at 375; extra actions go in More.\n- Tab, chip, and segmented lists: `h-auto min-h-11`, `overflow-y-hidden`, `scrollbar-width: none`. Horizontal overflow only when chips cannot fit; hide scrollbar chrome.\n- Dashboard sidebar overlays below `lg` and must not crush content. No extra polling. No layout shift from late font/nav.\n- `/models` listing header: H1 and Learn more / Providers / Apps share one row from `md` (title left, links right); stack below `md`. Same gutter as the explorer. Compact link hits 44px. No extra max-width on that hero.\n\nHub: [[project-anyrouter]]. Tokens: [[tech-flat-design-semantic-tokens]]. Components: [[tech-shadcn-base]].\n\n**Why:** live QA found icon-only CTAs, stacked playground chrome, and a sidebar that squeezed content on phones.\n**How to apply:** design and test at those five widths; keep labels; overflow into More instead of a second toolbar.", "project-anyrouter-unlist-broken-models": "When a model or upstream on AnyRouter is not working, disable or unlist it from `/models` and the catalog. Do not leave a dead row. Prefer unlist/disable over deleting request history. Do not invent new model ids.\n\nThis is standing ops, not a one-off: smoke fails, quarantined upstreams, invalid ids, and unstable models all get unlisted so the catalog stays stable.\n\nHub: [[project-anyrouter]]. API scope: [[project-anyrouter-openai-compat]].\n\n**Why:** a listed model that 502s or 410s is worse than a missing row.\n**How to apply:** flip the catalog flag / unlist; keep historical generations. Use latest smoke results, not a guessed id list.", "project-anyrouter": "https://anyrouter.dev \u2014 **universal AI model router**: one API, many providers/models, OpenAI Chat Completions + Anthropic Messages compatible.\n\nPublic surfaces: marketing `anyrouter.dev` \u00b7 dashboard `dash.anyrouter.dev` \u00b7 docs `docs.anyrouter.dev` \u00b7 workshop OS [[project-anyrouter-os]] (`os.anyrouter.dev`).\nAPI base: `https://anyrouter.dev/api/v1`. Packages: `@anyr/sdk`. CLI: native `anyr` ([[project-anyrouter-cli-native]]).\n\nAPI shape: [[project-anyrouter-openai-compat]]. Patterns: [[tech-llm-gateway-byok-sibling]], [[tech-llm-gateway-quota-as-retryable]], [[tech-cloudflare-ai-gateway-transparent]], [[tech-workers-cache-enabled]].\nPortfolio: [[user-duyet-active-projects]]. Related products: [[project-anyrouter-os]], [[project-agentstate]], [[project-anyworker]].\nPlayground MCP: [[project-anyrouter-playground-mcp]].", "project-anyworker-local-agent": "[[project-anyworker]] splits **marketing Worker** (`apps/web`) from **local agent product** (`apps/anyworker` server + GUI).\n\nRelated: [[project-agentstate]], [[user-duyet-ai-stance]].", "project-anyworker": "github.com/duyet/anyworker \u00b7 https://anyworker.dev\n\nOpen \u201cAI that does the work\u201d product. Split: marketing Worker vs local agent+GUI ([[project-anyworker-local-agent]]).\n\npnpm monorepo; TanStack Start web ([[tech-tanstack-start-ssg]]). Related: [[project-agentstate]], [[project-anyrouter]].\nRelease: [[feedback-never-auto-merge-release-please]]. Portfolio: [[user-duyet-active-projects]].", "project-charts": "github.com/duyet/charts \u2014 public Helm charts, tested with KinD. Related: [[user-duyet-infra-kubernetes]], [[reference-duyet-github]].", "project-chmonitor-advisor": "chmonitor advisor mode is **recommend-only** \u2014 projections, skip indexes, partitions, MVs \u2014 never silent schema mutations.\n\nHub: [[project-clickhouse-monitoring]]. Safety culture: [[feedback-fail-loud]].", "project-chmonitor-cli-local-connections": "`chm` keeps a **local named connection store** (not dashboard hosts).\n\n- `chm add <url>` (alias `connect`) saves ClickHouse HTTP `http(s)://[user:pass@]host:8123[/db]` or `postgres://` / `postgresql://`\n- `chm ls` lists name, engine (`clickhouse` | `postgres`), host, current; `--json` supported\n- `chm use <name>` sets `current_connection` in user `config.toml`\n- `chm rm <name>` removes a saved connection\n- Secrets go through the credentials helper (keyring / `0600` plaintext); never printed in `ls` or JSON\n- Live TUI opens against the active local HTTP connection\n- Dashboard `chm hosts` is unchanged (`/api/v1/hosts`)\n\nHub: [[project-clickhouse-monitoring]].", "project-chmonitor-hide-menu-item": "Sidebar leaf items (with an href) can be hidden **in the menu**, without opening Settings first.\n\n- Hover reveals **Hide** (EyeOff) next to **Pin**. Click does not navigate.\n- Persist via `hiddenMenuHrefs` / Custom workspace (`hideMenuHref` / `showMenuHref`).\n- Toast: `{title} hidden from the menu` / `Bring it back in Settings \u2192 Workspace \u2192 Navigation.` Actions: **Undo** and **Open Navigation**.\n- Settings gear / \u2318, still open General; the toast opens the **navigation** tab.\n- Footer About is not hideable. Engine filter still applies ([[project-chmonitor-menu-engine-filter]]).\n\nHub: [[project-clickhouse-monitoring]].\n\n**Why:** hide/show used to live only in Settings \u2192 Workspace \u2192 Navigation.\n**How to apply:** add hide only on leaves with href; restore path is always Settings \u2192 Workspace \u2192 Navigation; do not invent a second hide store.", "project-chmonitor-licenses": "Public paid path for [[project-clickhouse-monitoring]] is **self-hosted host-count licenses** (yearly or lifetime), honor system \u2014 not hosted SaaS seats. Replicas in the same shard are **not counted**.\n\nCloud demo remains `dash.chmonitor.dev`. OSS self-host stays the default for enterprises (IP allowlists, no metadata leaving the VPC).\n\n**Why:** agents should not design \u201cSaaS seats\u201d as the paid SKU.\n**How to apply:** talk about host-count licenses + trust model; replicas are free.", "project-chmonitor-menu-engine-filter": "Dashboard nav (sidebar, command palette, Settings > Navigation) filters by the **active host engine**.\n\n- No `engines` tag \u2192 ClickHouse family (`clickhouse` + `clickhouse-cloud`). Hidden on Postgres.\n- `engines: ['postgres']` \u2192 Postgres-only.\n\nSettings > Navigation uses the same filter as the live sidebar (`useActiveHostEngine`). Do not hardcode ClickHouse when building the customize tree. Do not add `engines: ['postgres']` to ClickHouse tools just to show a heading.\n\nHub: [[project-clickhouse-monitoring]]. Tools group: [[project-chmonitor-tools-sidebar]].\n\n**Why:** a Postgres host must not customize or see ClickHouse-only pages (Queries, Cluster, Tools).\n**How to apply:** leave CH-only items untagged; thread the active host engine into every nav surface.", "project-chmonitor-tools-sidebar": "Dashboard sidebar **Tools** is last in the MAIN section (after PeerDB, before Others). Interactive-utility group:\n\n- SQL Console (`/sql`)\n- Data Explorer (`/explorer`)\n- Explain (`/explain`)\n- Advisor (`/advisor`) \u2014 recommend-only ([[project-chmonitor-advisor]])\n- Chart Builder (`/dashboard`)\n- Schema Compare (`/schema-diff`)\n- Settings Diff (`/settings-diff`)\n\nAI Agent stays its own top-level group. Queries, Cluster, and other monitors stay put. DBA / Engineer / SRE workspace presets include Tools.\n\nTools is ClickHouse-family only \u2014 a Postgres host must not see it ([[project-chmonitor-menu-engine-filter]]).\n\nHub: [[project-clickhouse-monitoring]].\n\n**Why:** tool pages were scattered under Tables, Queries, Operations, and System.\n**How to apply:** put new interactive utilities in Tools; keep Tools last in MAIN (not in Others); do not move monitoring views there.", "project-chmonitor-ttl-partitions": "System view **TTL & Partitions** (`/ttl-partition-health`) shows:\n\n- Inventory table: full_table, engine, partition_key, ttl_expression, partitions, active_parts, parts_per_partition, bytes_on_disk\n- Charts: part health and parts per table\n\nThis is a System monitor, not a Tools utility ([[project-chmonitor-tools-sidebar]]).\n\n`system.tables` has no `ttl` column. Inventory SQL must never select `system.tables.ttl` \u2014 that 500s and the UI shows a silent Retry.\n\nHub: [[project-clickhouse-monitoring]].\n\n**Why:** inventory failed live when the query invented a column; charts still worked.\n**How to apply:** keep inventory and charts as separate queries; fail loud on inventory errors; do not select `system.tables.ttl`.", "project-chmonitor-verify-skill": "chmonitor ships `.cursor/skills/verify-chmonitor` (CLI lever + Feature Map + one proven drive). Primary surface is the standalone `chm` / `chmonitor` binary from this checkout, not the hosted dashboard.\n\n**Why:** Hosted dashboard `GET /api/healthz` is cluster-gated and can hang for minutes. That is not the identity prove.\n\n**How to apply:**\n- Launch this checkout's CLI, then `doctor.sh` (identity-only by default). Opt in to dashboard HTTP with `--http` / a short timeout.\n- Canonical prove: `drive.sh local-connections` \u2014 `chm add` / `ls` / `use` / `rm` against isolated `--config` (no operator keyring).\n- Later ships: `/poteto-mode` plus this skill. Refresh the skill when shipping, not on a weekday cron. Cloud agents only; no git worktrees.\n\nHub: [[project-clickhouse-monitoring]]. Generic loop: [[feedback-pstack-verification]]. Local store: [[project-chmonitor-cli-local-connections]].", "project-clickhouse-monitoring": "github.com/chmonitor/chmonitor \u00b7 https://chmonitor.dev \u00b7 docs.chmonitor.dev\n\n**chmonitor** \u2014 ClickHouse operational advisor + real-time monitoring, MCP, AI chat. Advisor is recommend-only ([[project-chmonitor-advisor]]).\n\nOSS self-host and hosted Cloud from one product family ([[tech-one-codebase-oss-saas]], [[tech-single-source-env]]). Paid SKU: [[project-chmonitor-licenses]].\n**Image:** `ghcr.io/chmonitor/chmonitor:latest` (not the stale `ghcr.io/duyet/chmonitor` path).\n**Homelab self-host ops:** [[lessons-chmonitor-homelab-deploy]] (full cluster vs public `dash.chmonitor.dev`; never assign CH `readonly=1` profile to the dashboard user).\nLocal CLI store: [[project-chmonitor-cli-local-connections]]. Verify skill: [[project-chmonitor-verify-skill]].\nSidebar **Tools** group: [[project-chmonitor-tools-sidebar]]. Engine filter: [[project-chmonitor-menu-engine-filter]]. TTL & Partitions: [[project-chmonitor-ttl-partitions]].\nFocus: [[user-duyet-focus-clickhouse]]. Portfolio: [[user-duyet-active-projects]].", "project-codex-claude-plugins-verify-skill": "duyet/codex-claude-plugins ships `.cursor/skills/verify-marketplace` (CLI lever + Feature Map + one proven drive). Surface is marketplace JSON and plugin manifests, not a hosted web app.\n\n**Why:** Agents need a closed loop before Grok/logo/harness ships. `main` had no `.cursor/skills/verify-*` until PR 86.\n\n**How to apply:**\n- Use `control-marketplace.mjs` (`doctor`, `info`, `list`, `check-install`, `validate`; `--json`; `--dry-run` on `install-antigravity` and `cleanup`). Controller v1.1.0 after #88.\n- Proven drives: `marketplace-catalog` (Claude), `codex-install` (Codex), `grok-build-and-bot` (Grok; skip fails).\n- Grok Build / Grok Bot are first-class after #87 (harnesses) and squash-merged #88 (verify treats those slots as real; prove pass on master `a2c28a3`).\n- Later ships: `/poteto-mode` plus this skill. Refresh on ship, not weekday cron. Cloud agents only; no git worktrees.\n\nGeneric loop: [[feedback-pstack-verification]].", "project-duyetbot": "duyetbot is the manager. It assigns work to dedicated product bots (AnyRouter, chmonitor, live QA), keeps a running summary, and writes durable public facts to [[project-kb]].\n\nIt also maintains [[project-monorepo]] within scope: code, design system, deploy config. Out of scope without human direction: authored blog posts and curated timeline research facts.\n\nShared brain: `~/kb` (same tree as `apps/kb/kb`). Protocol: [[feedback-docs-driven-development]], [[feedback-docs-write-on-exit]].", "project-homelab": "github.com/duyet/homelab \u2014 public personal homelab configs/experiments.\n\nRelated: [[user-duyet-homelab]], [[project-charts]], [[user-duyet-site-homelab]].\nKeep kb notes generic \u2014 no private inventory.", "project-kb-site": "Public site for [[project-kb]]. Graph + llms.txt endpoints for agents. Pattern: [[feedback-docs-driven-development]]. Link: [[user-duyet-site-kb]].\n\nContent lives in the [[project-kb]] git repo (`~/kb`). The renderer is `apps/kb` in [[project-monorepo]]. Locally `apps/kb/kb` is a symlink to `~/kb`. CI uses the `apps/kb/kb` git submodule (`git@github.com:duyet/kb.git`, branch `main`).", "project-kb": "github.com/duyet/kb \u2014 this repository. Protocol: AGENTS.md. Index: MEMORY.md. Graph: [[tech-okf-bundle]].\n\nPattern: [[feedback-docs-driven-development]]. Site: [[user-duyet-site-kb]] / [[project-kb-site]]. Scope: [[feedback-public-kb-only]].", "project-llm-timeline": "App in [[project-monorepo]]: https://llm-timeline.duyet.net \u2014 large static timeline (1950\u2013present).\n\nUses [[tech-tanstack-start-ssg]], [[tech-flat-design-hairline]]. Curated model data is human-owned research.", "project-monorepo": "github.com/duyet/monorepo \u2014 public web monorepo (blog, CV, timeline apps, kb site, news, shared packages).\n\nStack: Bun, Turborepo, TanStack Start SSG, Cloudflare Pages / Workers.\n`apps/kb` is the renderer for [[project-kb]] / [[project-kb-site]].\n`apps/news` is [[project-news]] (news.duyet.net).\n`apps/news-tab` is the unpacked Chrome new-tab client for that feed (Load unpacked; not on Pages/Workers). Separate release-please component (#1406): own changelog, 0.1.x, `news-tab-v*` tags \u2014 not folded into the root `duyet` release. Leave its release-please PR unmerged ([[feedback-never-auto-merge-release-please]]).\nRelated: [[project-llm-timeline]], [[project-duyetbot]], [[tech-tanstack-start-ssg]], [[tech-flat-design-hairline]].", "project-news": "https://news.duyet.net \u2014 feed + ranking app in [[project-monorepo]] (`apps/news`). Cloudflare Worker deploy. Admin ingest is token-gated (`/api/admin/*`); do not put the token in kb.\n\nPublic third-party digest (shipped 2026-08-28, #1396): `GET /api/public` returns compact JSON (`tldr` bilingual bullets + up to 8 top `stories`, `updatedAt`). No auth. CORS allows `chrome-extension://\u2026`, localhost, and `https://*.duyet.net`. Intended for the in-repo Chrome new-tab client (`apps/news-tab` in [[project-monorepo]]; Load unpacked from `manifest.json`). Homepage `/api/feed` stays the large no-CORS SPA payload.\n\nHomepage AI;DR (shipped 2026-08-28, #1397): each bullet shows a compact story thumb on the right (layout A: number + copy left, 40\u201348px thumb right). Thumb is the linked story `image_url`; missing/broken images use the site mark. `TldrBullet.image_url` is attached at read time on `/api/feed` and `/api/public`, not stored on the snapshot. QA-only `?aidr=b|c` flips layout; default is A.\n\nHomepage AI;DR copy (shipped 2026-08-28, #1399): digest prompt targets ~2 sentences / 180\u2013240 chars; homepage clamps to 3 lines with ellipsis and highlights named entities (same topic colors as the feed). Existing snapshots stay one-liners until the next finished ingest writes longer copy. `/api/public` already clips `text` at 400 chars.\n\nHourly ingest (shipped 2026-08-28, #1400 + #1402 + #1405): primary cadence is a Durable Object alarm, not a Worker cron (account is at the 5-trigger cap; [[tech-cloudflare-cron-triggers-five-per-account]], [[tech-durable-object-alarms-not-cron]]). GitHub Actions is a watchdog with four independent crons per hour. Triggers coalesce if a run started in the last 45 minutes; manual `workflow_dispatch` POSTs `?force=1` to bypass coalesce. #1405 intended `open-run` to upsert `workflow_runs` immediately and set `GET /api/system` to `Cache-Control: no-store` (no-store is live). Recert lastRun by a force POST, not an invented schedule fire. First public hit or admin ingest POST arms the alarm.\n\n#1415 (2026-08-29): persist `workflow_runs` with D1 `.run()` / `batch()`, not `INSERT RETURNING` + `.first()` ([[tech-d1-insert-returning-not-a-write]]). Gate 2xx on the same lastRun SELECT `/api/system` uses. Recert lastRun by a force POST after deploy; do not invent a schedule fire.\n\nnews-tab releases (shipped 2026-08-28, #1406): `apps/news-tab` is its own release-please component \u2014 changelog, 0.1.x line, `news-tab-v*` tags \u2014 not folded into the root `duyet` release. Leave its release-please PR for human merge ([[feedback-never-auto-merge-release-please]]).\n\nChrome new-tab install (shipped 2026-08-29, #1421 + #1423): public zip at https://news.duyet.net/news-tab.zip (packed at news build from `apps/news-tab`; nested `news-tab/manifest.json`). Guide at https://news.duyet.net/extension (\"Tab Chrome\" in the primary menu). Chrome cannot Load unpacked a `.zip` \u2014 unzip first, then pick the `news-tab` folder. Not on Chrome Web Store. `chrome://extensions` is linked; HTTPS pages may block that navigation so the guide also says to paste the URL.\n\nProduct hub: [[project-monorepo]]. Portfolio: [[user-duyet-web-presence]].", "project-oma-verify-skill": "duyet/oma ships `.cursor/skills/verify-oma` (CLI lever `control-oma.mjs` + Feature Map under `features/`). Added in #430 with the marketing/Console `cn` migrate.\n\n**Why:** Later ships should drive landing + Console as a user, with screenshots/JSON proof, not only typecheck.\n\n**How to apply:**\n- First prove path already landed with the skill: `control-oma launch web` \u2192 `doctor` \u2192 `drive landing-home` \u2192 `landing-check`; Console login drive for `#auth-email` / Sign in.\n- Later ships: `/poteto-mode` plus this skill. Refresh on ship, not a weekday cron. Cloud agents only; no git worktrees. No invented env or secrets.\n\nHub: [[project-open-managed-agents]]. Generic loop: [[feedback-pstack-verification]].", "project-open-managed-agents": "github.com/duyet/oma \u00b7 https://oma.duyet.net \u00b7 docs: https://docs.oma.duyet.net\n\nOpen-source reimplementation of a **Managed Agents**-style API. Meta-harness: platform prepares tools/skills/sandbox/credentials; pluggable harness drives the model loop.\n\nRuns two ways: Cloudflare (Workers + Durable Objects) or self-host Node/`docker compose` \u2014 same business logic.\nInvariants: [[tech-oma-credentials-out-of-sandbox]], [[tech-prompt-cache-byte-sensitive]].\nRelease: [[feedback-never-auto-merge-release-please]]. Portfolio: [[user-duyet-active-projects]].", "project-templatebot-pay-to-install": "On templatebot, **Sale** listings gate install behind checkout. Free listings stay one-click. Platform fee is **5%** of list price (`PLATFORM_FEE_BPS = 500`); Dodo processor estimate is separate; seller net = price \u2212 Dodo \u2212 platform.\n\nAfter pay, fulfilment mints an unguessable `unlock_token`, emails the install link (Resend when configured), and `/unlock/{token}` shows install to that buyer. Unpaid Sale must not expose Add to Grok Bot, Open in Grok, View/Copy x.ai, or x.ai/grokbot URLs in HTML/JSON; marketplace share (`?bot=` / `/bot/{id}`) stays public. Buy is the only primary CTA until unlock.\n\n**Why:** Unpaid buyers must not get install paths. Paid buyers need a durable delivery path without relying on a signed-in session alone. Owners need the fee split visible on submit, dashboard, earnings, and pricing.\n\n**How to apply:**\n- Omit install URLs from HTML, preview, list payloads, `getTemplate`, `clickAndRedirect`, and `/llms.txt` unless the viewer is the owner, has a completed purchase, or holds a valid unlock token.\n- Buyers start Dodo checkout (`createBuyCheckout`); demo/unsigned users get a visible alert instead of an install control.\n- Product page: left card is the bot (no install until paid); right panel is Unlock this bot (Buy). After unlock, Add is on the left card and Buy is gone.\n- Show shared owner fee breakdown (buyer pays / Dodo / platform 5% / you keep) on submit, dashboard, earnings, and pricing.\n- Keep `/terms`, `/pricing`, FAQ, and `/llms.txt` aligned with pay-to-unlock, email + unlock URL delivery, and the 5% split.\n- Prove with `.cursor/skills/verify-templatebot` feature `pay-to-install.md` and local D1 fixture `features/fixtures/paid-demo.sql` (Night Counsel). Leave Renovate Dependency Dashboard #6 alone.", "project-templatebot-verify-skill": "templatebot ships `.cursor/skills/verify-templatebot` (CLI lever + Feature Map + one proven drive). Primary surface is the local Vite/Cloudflare marketplace driven over Chrome DevTools Protocol via `control-templatebot.mjs`.\n\n**Why:** `main` had no Playwright/Cypress suite and no verify skill. Agents need a composable launch/doctor/drive loop before feature ships.\n\n**How to apply:**\n- Use `control-templatebot.mjs` (`launch` / `doctor` / `goto` / drive / `cleanup`; `--json`, `--dry-run` on launch/stop/cleanup).\n- Feature map covers browse (incl. `browse-marquee` on `/` only; coat-blend card surfaces via `surface-bot-card` / `botCardTint` in light+dark), preview (incl. `preview-scroll`), submit (incl. resubmit / history / X collect; post-submit Leaderboard vs Paid Template equal choices), leaderboard, dashboard, unlisted `/data` analytics (`features/data.md`), PostHog official JS funnel (`VITE_POSTHOG_PROJECT_TOKEN` env-only), pay-to-install (Sale; email + `/unlock/{token}`; `paid-demo.sql` / Night Counsel), and MCP publish (`features/mcp-publish.md`). Viewport presets: mobile 375\u00d7812 / desktop 1280\u00d7800.\n- Proven drive: browse \u2192 Harvey search \u2192 Harvey Specter preview \u2192 `Close --exact`, then assert `scrollY` holds (no jump-to-top).\n- `Close` needs `--exact` (Harvey card name includes `disclose`). Hero Browse is role button; clear search via `goto /templates`.\n- Live paywall copy is `Checkout unlocks the install link` (not `unlock the install link`); `/unlock/{token}` sets `tb_unlock` so unpaid recipes must run first; `/privacy` shares terms email+unlock copy (`docs-terms`).\n- Local vite skip HTTP\u2192HTTPS redirect on loopback so doctor sees real HTML.\n- Later ships: `/poteto-mode` plus this skill. Refresh with `/maintain-verification-skill` on ship. Cloud agents only; no git worktrees.\n\nGeneric loop: [[feedback-pstack-verification]].", "lessons-chmonitor-homelab-deploy": "# Lessons \u2014 chmonitor on homelab k3s\n\n## Two different instances (do not conflate)\n\n| Instance | Purpose | Data |\n|----------|---------|------|\n| **Public Cloud/demo** (`dash.chmonitor.dev`) | SaaS + limited public demo | Limited tables, intentionally constrained |\n| **Homelab self-host** (private Traefik + OAuth) | Full cluster ops UI | All DBs/schemas; expected higher metrics volume |\n\nHomelab is supposed to \u201cshow more performance\u201d \u2014 that is normal, not a bug vs public.\n\n## Image (2026-08)\n\n- **Canonical:** `ghcr.io/chmonitor/chmonitor:latest` (`imagePullPolicy: Always`)\n- **Stale:** `ghcr.io/duyet/chmonitor:latest` \u2014 no longer receives CI builds; redeploy pulls same old digest forever\n- Helm chart repo: `https://charts.chmonitor.dev` (chart `chmonitor`); source repo moved to `chmonitor/chmonitor`\n\n## ClickHouse user for the dashboard\n\n- Use a **dedicated user** with **privilege-based** read-only: `GRANT SELECT, SHOW, dictGet ON *.*` (or narrower), not the server **`readonly` settings profile** (`readonly=1`).\n- chmonitor always sets **`max_execution_time`** as a **session setting** on the client. With `readonly=1` ClickHouse returns:\n\n  ```text\n  Cannot modify 'max_execution_time' setting in readonly mode\n  ```\n\n  \u2192 `/api/healthz` fails \u2192 readiness 503 \u2192 pod never Ready.\n- Prefer a normal/`monitoring` profile + grants. Homelab pattern: user `chmonitor` + role with SELECT/SHOW on all DBs.\n\n## Auth (homelab)\n\n- Behind Traefik **forwardAuth** + oauth2-proxy (GitHub via Dex). See [[tech-forwardauth-preserve-status]].\n- chmonitor-scoped middleware stamps a **shared secret** header (`X-Chm-Proxy-Secret`); app trusts identity headers only when secret matches (`CHM_AUTH_PROVIDER=proxy` or `trusted` depending on image).\n- Unauthenticated external hit \u2192 **302** to the auth portal is expected.\n\n## Ops checklist\n\n1. Confirm image is `ghcr.io/chmonitor/chmonitor:\u2026` and pull/restart after new builds.\n2. Confirm CH user can run `SELECT 1 SETTINGS max_execution_time = 60`.\n3. Confirm `/api/healthz` reports host `up` and tables/overview APIs return full schema count.\n4. Do not use public-demo connection limits as the model for homelab grants.\n\n**Why:** future agents diagnose \u201cchmonitor down\u201d or \u201cempty schemas\u201d without mixing public SaaS and private cluster, and avoid the readonly-profile trap.\n**How to apply:** when redeploying or debugging homelab chmonitor, check image org + CH profile first; grant schema via SQL privileges, not `readonly=1`.", "reference-ai-sdk-uimessage": "Vercel AI SDK `UIMessage` = `{id, role, parts[], metadata?}`. Renderer switches on `part.type` and drops unknowns.\n\nNative tool parts: `dynamic-tool` / `tool-${name}` with `{state, input, output}`.\nSee [[tech-ai-sdk-history-dto-convert]], [[tech-ai-agent-stack]].", "reference-cloudflare-acquires-astro": "Cloudflare acquired The Astro Technology Company (announced 2026-01-16). Astro stays open source.\n\nFlue (`withastro/flue`) is from that team post-acquisition. Related: [[tech-flue-register-in-initializer]], [[user-duyet-infra-cloudflare]].", "reference-duyet-blog": "Themes by volume: ClickHouse \u00b7 Rust \u00b7 AI agents \u00b7 data eng (Airflow, DuckDB) \u00b7 tooling.\n\nSite: [[user-duyet-site-blog]]. Stance: [[user-duyet-ai-stance]]. Focus: [[user-duyet-focus-clickhouse]].", "reference-duyet-github": "Notable public repos (non-exhaustive):\n\n| Area | Repos |\n|------|-------|\n| ClickHouse | [[project-clickhouse-monitoring]], `clickhouse-udf-rs` |\n| LLM / agents | [[project-anyrouter]], [[project-agentstate]], [[project-anyworker]], [[project-open-managed-agents]] |\n| Web | [[project-monorepo]], [[project-kb]] |\n| Homelab / infra | [[project-homelab]], [[project-charts]], `gaxy` |\n| Older popular | `bruteforce-database`, `pricetrack` |\n\nHub: [[user-duyet-github]]. Stack: [[user-duyet-stack]].", "tech-cli-report-assemble-from-root": "`scripts/cli-build-report.sh --assemble` reads matrix JSON from the **workspace download dir** (CI: `cli-report-metrics` at the repo root).\n\n- Resolve `--assemble` / `--report` / `--out` from the repo root\n- Only `cd rust/` for the crate build path\n- Relative `--assemble cli-report-metrics` (same as the workflow) must work from root\n- `cd rust/` first makes the assemble step miss the artifacts (`no metrics json`) even when all matrix builds uploaded\n\nRelated: [[tech-pin-github-actions]], [[project-chmonitor-cli-local-connections]].", "tech-pin-github-actions": "Actions run with repo secrets. Prefer `@vX.Y.Z` or commit SHA pins; avoid floating `@v0`.\n\nIncident reference: trivy-action tags force-pushed (2026). Related: [[tech-trivy-two-phase]], [[feedback-public-kb-only]].", "tech-release-please-basics": "release-please maintains a release PR and CHANGELOG from conventional commits. Merging releases tags/publishes.\n\nPrefer release-published workflows over raw tag push to avoid duplicates. Related: [[tech-release-please-pr-title]], [[feedback-never-auto-merge-release-please]].", "tech-release-please-pr-title": "Invalid PR titles are silently dropped from bumps. Guard titles with the same commitlint config as local hooks.\n\nRelated: [[tech-release-please-basics]], [[feedback-semantic-commits]], [[tech-release-please-pre1-minor]].", "tech-release-please-pre1-minor": "In 0.x, `bump-patch-for-minor-pre-major: true` makes plain `feat` \u2192 patch (`feat!:` or BREAKING CHANGE for minor). Set it **false** (keep `bump-minor-pre-major: true`) if 0.x should move `0.1` \u2192 `0.2` on each feature release.\n\nRelated: [[tech-release-please-basics]], [[tech-release-please-pr-title]].", "tech-trivy-two-phase": "Phase 1: scan with exit 0 for artifacts. Phase 2: fail on CRITICAL/HIGH, ideally reusing setup.\n\nRelated: [[tech-pin-github-actions]], [[tech-codebase-maintenance-loop]].", "tech-access-missing-app-fails-open": "Cloudflare Access enforcement lives in the **Access application**, not in the client.\nIf the application is missing \u2014 deleted, or never recreated after an account move \u2014\nthe hostname is served **without any check at all**.\n\n**Why it hides:** well-behaved clients keep sending `CF-Access-Client-Id` /\n`CF-Access-Client-Secret`. Requests succeed, dashboards look normal, no error is\nlogged anywhere. The credentials are present; nothing is verifying them. An origin\nwhose only remaining defence is its own application password is now on the open\ninternet.\n\n**Detection** \u2014 one unauthenticated request:\n\n```\ncurl -sI https://<host>/     # expect 302 -> <team>.cloudflareaccess.com, or 403\n```\n\nA `200` means there is no Access app in front. Service tokens are account-scoped, so\nafter an account migration the old token id is meaningless on the new account even\nthough clients still transmit it.\n\n**Verify both directions.** Proving the gate blocks anonymous traffic says nothing\nabout whether it still admits the legitimate client. Check the pair:\n\n| Request | Expected |\n|---|---|\n| no credentials | `302` / `403` |\n| app credentials, no Access headers | `302` / `403` |\n| app credentials **+** Access headers | `200` |\n\n**Ordering when rotating Access credentials:** create them \u2192 propagate to every client\n(Worker vars, secrets, `.env`) \u2192 **then** create or update the Access application.\nReversed, every client is locked out for the length of the gap. That matters most\nwhere the client fails open by design (backup/telemetry sinks that swallow errors):\nthe data silently stops arriving instead of raising anything.\n\n**A wildcard app covers subdomains, but a more specific app wins.** Before relying on\n`*.example.com` to protect a new hostname, confirm no narrower app exists for it.\n\nRelated trap: a token that lacks read scope on `access/identity_providers` or on the\n`access/apps/{id}/policies` sub-resource returns an **empty list rather than 403**, so\n\"no identity providers configured\" and \"cannot see them\" are indistinguishable.\nPolicies are readable inline from the `access/apps` list response. And Access's\nbuilt-in email one-time-PIN needs **no** identity provider object at all, so an empty\nprovider list does not mean login is broken.", "tech-cloudflare-ai-gateway-transparent": "AI Gateway routes by provider/prefix and forwards model strings. \"Invalid model ID\" is usually upstream or unknown provider prefix.\n\nCustom providers: base URL + slug; model path appended. Related: [[project-anyrouter]], [[tech-llm-gateway-quota-as-retryable]].", "tech-cloudflare-cron-triggers-five-per-account": "Cloudflare caps Worker `[triggers] crons` at **5 per account**, not per Worker. Shared accounts fill the slots fast. Deploy error is `10072 \u2014 You have exceeded the limit of 5 cron triggers`.\n\nOmitting the `triggers` block does **not** clear an existing cron. Emit `\"triggers\": { \"crons\": [] }` (or PUT `[]` to the schedules API) to release a slot. Workflow binding `schedules` are a different product and paid-only ([[tech-workflows-binding-schedules]]). Durable Object `alarm()` is another Free-safe scheduler and does not use a cron slot ([[tech-durable-object-alarms-not-cron]]).", "tech-cloudflare-email-transactional-not-bulk": "Cloudflare Email Sending (Workers `send_email` binding or REST) is **transactional** \u2014 receipts, password resets, one-off lifecycle mail. Marketing and multi-thousand blasts are out of scope.\n\nBulk sends hit `E_RATE_LIMIT_EXCEEDED` / `E_DAILY_LIMIT_EXCEEDED` (or silent rejects) after a small successful prefix. Check `GET /accounts/{id}/email/sending/limits` before a large send. Use a dedicated ESP for campaigns.\n\nDocs: [Email Service](https://developers.cloudflare.com/email-service/). Related: [[tech-cloudflare-workflows-reset-on-code-update]].", "tech-cloudflare-pages-deploy": "Habit: commit \u2192 push \u2192 deploy the changed Pages app \u2192 verify HTTP 200.\n\nHazard: scripts that rename local env files mid-deploy must not run in parallel.\nRelated: [[tech-tanstack-start-ssg]], [[project-monorepo]], [[feedback-semantic-commits]].", "tech-cloudflare-workflows-reset-on-code-update": "A Cloudflare Workflow instance is a Durable Object. Deploying new code for the **host Worker** resets that DO. The instance fails with `Durable Object reset because its code was updated`.\n\nList or wait for instances (`wrangler workflows instances list`) before deploying the host. Do not treat a new instance as a clean retry of side effects already written by the old run.\n\nRelated: [[tech-workflows-binding-schedules]], [[tech-cloudflare-cron-triggers-five-per-account]].", "tech-d1-insert-returning-not-a-write": "Cloudflare D1 treats `INSERT`/`UPDATE` as writes. `stmt.first()` is a read helper and comes back empty for those statements even with `RETURNING`. A persist path that gates success on the RETURNING row will fail-closed after the write never looks persisted.\n\nWrite with `D1PreparedStatement.run()` (or `D1Database.batch()` of prepared statements), then confirm with a later `SELECT`. Do not widen `batch()` on a local D1 wrapper to a broader union \u2014 `Env.DB.batch` is `D1PreparedStatement[]` only and a wider type makes the binding unassignable.\n\nDocs: [D1 Database API](https://developers.cloudflare.com/d1/worker-api/d1-database/).", "tech-durable-object-alarms-not-cron": "Cloudflare Durable Object `alarm()` wakes a DO at a chosen time. Alarms are **not** Worker `[triggers] crons` and do **not** count toward the account-wide 5-cron cap ([[tech-cloudflare-cron-triggers-five-per-account]]).\n\nWorkflow binding `schedules` are a different product and paid-only ([[tech-workflows-binding-schedules]]). On a Free plan, a DO alarm (or an external GitHub Actions POST) can start periodic work without a sixth Worker cron or a paid Workflow schedule.\n\nDocs: [Durable Object Alarms](https://developers.cloudflare.com/durable-objects/api/alarms/).", "tech-forwardauth-preserve-status": "When Traefik forwardAuth + OAuth2 Proxy sit behind error middleware, ensure 302 challenges are not replaced by generic error pages.\n\nPattern: explicit redirect path for auth challenges. Generic edge auth lesson \u2014 no private hostnames.", "tech-workers-cache-enabled": "Workers Cache sits in front of a Worker. Enable: `cache: { enabled: true }` in wrangler.\n\nSafe default: only responses with explicit public `Cache-Control` are stored. Auth headers auto-bypass.\nSee [[tech-workers-cache-swr]], [[tech-workers-cache-hit-skips-cpu]].", "tech-workers-cache-hit-skips-cpu": "A cache HIT is served from the edge tier without invoking the Worker isolate.\n\nGreat for SSR-as-origin frameworks. Enable carefully with public CC only: [[tech-workers-cache-enabled]].", "tech-workers-cache-swr": "Use `Cache-Control: public, max-age=\u2026, stale-while-revalidate=\u2026` so users rarely wait on origin re-render.\n\nPair with [[tech-workers-cache-enabled]], [[tech-workers-cache-tags]].", "tech-workers-cache-tags": "Set `Cache-Tag` on responses; purge by tag after content updates.\n\nRelated: [[tech-workers-cache-enabled]], [[tech-workers-cache-swr]].", "tech-workflows-binding-schedules": "Cloudflare Workflows accept `schedules` on the binding. Each tick starts a Workflow instance. That does **not** use Worker `[triggers] crons` (Free accounts cap those).\n\n`schedules` itself is paid-only. On a Free plan, `wrangler deploy` can upload the Worker then exit 1 attaching the schedule. The Worker may stay live; CI still goes red.\n\nOn Free: trigger the Workflow from a Durable Object alarm ([[tech-durable-object-alarms-not-cron]]), GitHub Actions, or another external cron \u2014 not from `workflows[].schedules` and not from Worker crons. Docs: [Trigger Workflows](https://developers.cloudflare.com/workflows/build/trigger-workflows/). Related: [[tech-cloudflare-pages-deploy]], [[project-news]].", "tech-zone-account-transfer-breaks-worker-routes": "Moving a zone to another Cloudflare account (including a Registrar inter-account\ntransfer) copies **DNS records** but **not** Worker routes or Workers Custom Domains.\n\n**Failure mode:** every proxied hostname returns `403` / **Error 1000 \"DNS points to\nprohibited IP.\"** The copied proxied A records point at Cloudflare anycast IPs. On the\nold zone those were never used as an origin because Worker routes intercepted first;\non the new zone, with no routes, Cloudflare tries to reach that \"origin\", sees its own\nIP, and refuses. **Routes are what make those placeholder A records harmless.**\n\nChecklist when moving a Workers-backed zone:\n\n| Item | Carries over? |\n|---|---|\n| DNS records (A/CNAME/MX/TXT) | yes |\n| Worker routes | **no \u2014 recreate** |\n| Workers Custom Domains | **no** |\n| Custom rulesets (transform/cache rules) | **no** |\n| Email Routing rules | **no** \u2014 and destination addresses must be re-verified first, else `2054` |\n| Zone id | **changes** \u2014 re-point every hardcoded reference and re-issue zone-scoped API tokens |\n\nGotchas:\n\n- An **apex** declared `custom_domain: true` is not matched by a `*.example.com/*`\n  route. Creating the Custom Domain fails while leftover apex A records exist\n  (`already has externally managed DNS records`); delete them first.\n- Records that are **CNAMEs to a third party** (e.g. an auth provider's satellite\n  domain) can silently disappear into a `*` wildcard A record \u2014 every name still\n  resolves, so nothing looks broken while the integration is down. Diff the old and\n  new zone by querying **each nameserver set directly** with `dig @<ns>`, not by\n  checking whether a name resolves.\n- Registrar transfers lock the registration for **30 days** \u2014 no rollback in that\n  window at any price.\n- A tunnel is **not** transferable: create a new one on the destination account and\n  repoint the connector. Its ingress is readable from the API when the tunnel is\n  remotely managed, so it can be replicated exactly without any node access.\n- Verify resource ids (D1/KV/secrets-store) against the **live destination account**\n  before substituting them; a recorded config file is a record of intent, not proof.", "tech-qdrant-config-at-create": "Don't assume live config edits always apply retroactively. Prefer correct create params; use `update_collection` when supported.\n\nRelated: [[tech-qdrant-hnsw-timeout]].", "tech-qdrant-hnsw-timeout": "High-dimension float32 collections can devolve to expensive scans. Tune HNSW + consider INT8 quantization.\n\nConfig timing: [[tech-qdrant-config-at-create]]. Related: [[tech-rag-metadata-key-drift]].", "tech-debian-13-apt-node-20": "Debian 13 `apt` `nodejs` is **20.x**. Wrangler 4 refuses to start below **22.0.0**. Do not replace the apt package \u2014 other Debian `node-*` packages depend on it.\n\nTo make Node 22 the system default:\n\n1. Extract the official `node-v22.*-linux-x64.tar.gz` from nodejs.org into `/usr/local` (`--strip-components=1`). `/usr/local/bin` is already first on the default PATH.\n2. `dpkg-divert --local --divert /usr/bin/node.distrib --rename /usr/bin/node` then `ln -sfn /usr/local/bin/node /usr/bin/node`. Cron/systemd `PATH=/usr/bin:/bin` and `#!/usr/bin/node` then get 22. Debian 20 stays at `/usr/bin/node.distrib`.\n3. Prefer the `.tar.gz` if `xz-utils` is missing. Verify `SHASUMS256.txt`.\n\nAfter this, `node -v` and `/usr/bin/node -v` are 22; `npm`/`npx` come from `/usr/local/bin`.", "tech-disk-swap-not-extra-ram": "Swap is spill, not capacity. Pages come back 100\u20131000\u00d7 slower than RAM. A large **disk** swapfile lets the kernel thrash (SSD busy, allocators stall, NIC/watchdog look dead) instead of killing a fat process.\n\nOn a small always-on Linux box (k8s + DB + agents):\n\n- Prefer **2\u20134 GiB zram** (compressed, memory-speed) for short spikes.\n- Do **not** add a swapfile \u2265 RAM on the same NVMe as the OS/DB.\n- Pair with `earlyoom` / kubelet eviction that fire **while swap still exists**. Huge swap delays that signal.\n\nMore swap is useful for hibernate or parking idle desktops. It is a trap when the working set already exceeds RAM and the host must stay reachable.\n\nRelated: [[user-duyet-homelab]] (keep topology out of kb \u2014 [[feedback-public-kb-only]]).", "tech-agentstate-five-primitives": "[[project-agentstate]] exposes five fleet primitives: **states**, **leases**, **claims**, **capability tokens**, **conversations**.\n\nUse when multi-agent systems need shared state/locking/delegation without reinventing a backend.\nSee also [[tech-agentstate-not-a-framework]]. Related: [[tech-ai-agent-stack]], [[project-anyworker]].", "tech-agentstate-not-a-framework": "AgentState does **not** replace LangGraph/AI SDK/etc. It is the state/coordination layer agents call.\n\nRelated: [[project-agentstate]], [[tech-agentstate-five-primitives]], [[tech-ai-agent-stack]].", "tech-ai-agent-stack": "Common public stack pieces:\n\n| Piece | Role |\n|-------|------|\n| Vercel AI SDK | streaming UI + tools |\n| LangGraph / LangChain | graphs & chains |\n| Cloudflare Agents SDK | Workers + DO agents |\n| MCP | tool servers |\n| Flue / Hermes | agent runtimes |\n\nStance: [[user-duyet-ai-stance]]. Runtimes: [[tech-eve-filesystem-agents]], [[tech-hermes-custom-provider]], [[tech-hermes-steer-mode]], [[tech-hermes-dashboard-auth-gate]]. Projects: [[project-anyrouter]], [[project-agentstate]], [[project-anyworker]], [[project-open-managed-agents]], [[project-duyetbot]].", "tech-ai-sdk-history-dto-convert": "Map `tool-call`/`args`/`result` \u2192 `dynamic-tool` with `input`/`output` and correct `state`. Map annotations \u2192 `data-*` parts.\n\nKeep one endpoint for multiple clients until legacy dies. Related: [[reference-ai-sdk-uimessage]], [[tech-ai-sdk-uimessage-native-tools]].", "tech-ai-sdk-uimessage-native-tools": "Live streams use native part types; history DTOs often use `tool-call` + `annotations` and disappear on reload.\n\nConvert at the client boundary: [[tech-ai-sdk-history-dto-convert]]. Shape: [[reference-ai-sdk-uimessage]].", "tech-eve-filesystem-agents": "Vercel [Eve](https://eve.dev/) authors an agent as files under `agent/`:\n\n| Path | Role |\n|------|------|\n| `instructions.md` | always-on system prompt |\n| `tools/<name>.ts` | tool name = filename |\n| `connections/<name>.ts` | MCP / OpenAPI |\n| `skills/`, `schedules/`, `subagents/` | optional slots |\n\nIdentity comes from the path, not a `name` field. Aligns with [[feedback-docs-driven-development]]. Runtime host: [[tech-eve-runtime-vercel-nitro]].", "tech-eve-runtime-vercel-nitro": "Eve's durable loop (sessions, pause/resume, sandbox) deploys to **Vercel Workflow** or a **self-hosted Nitro Node** server (`eve build` \u2192 `.output/`).\n\nIt does not run inside a thin Cloudflare Worker that only serves static assets plus one `POST /api/chat`. `withEve()` for Next.js expects that Eve service (local eve-dev, Vercel service, or `EVE_NEXT_PRODUCTION_ORIGIN`).\n\nAuthoring files can still follow [[tech-eve-filesystem-agents]] on another host; the durable Eve runtime is a separate deploy choice.", "tech-flue-register-in-initializer": "Flue addresses models as `provider/model`. Register custom providers inside `defineAgent` initializer using `ctx.env`.\n\n`process.env` is empty at module load on workerd. Debug with Node target when errors hide. Related: [[reference-cloudflare-acquires-astro]], [[project-anyrouter]].", "tech-hermes-custom-provider": "Hermes-style agents: declare `custom_providers` then select `provider: custom` (or named id). Keep keys in env vars, not notes.\n\nRelated: [[tech-ai-agent-stack]], [[tech-cloudflare-ai-gateway-transparent]].", "tech-hermes-dashboard-auth-gate": "Generic lesson: localhost/insecure allowlists must not outrank real auth on exposed binds.\n\nPrefer explicit bind address + auth plugin order tests. Related: [[feedback-public-kb-only]], [[tech-forwardauth-preserve-status]].", "tech-hermes-steer-mode": "Steer mode: in-flight agent incorporates new user messages into the current task.\n\nRelated: [[tech-hermes-custom-provider]], [[tech-ai-agent-stack]].", "tech-llm-gateway-byok-sibling": "If user keys ride a platform backend path, add an explicit `-byok` (or equivalent) route before disabling that backend.\n\nLearned on multi-provider routers like [[project-anyrouter]]. Related: [[tech-llm-gateway-quota-as-retryable]].", "tech-llm-gateway-quota-as-retryable": "Some upstreams return `budget_exceeded` as HTTP 400. Classify as retryable/failover, not terminal client error.\n\nAlso: zero-byte full timeouts are terminal per backend per request \u2014 don't burn identical retries. See [[project-anyrouter]].", "tech-oma-credentials-out-of-sandbox": "Invariant for managed agent runtimes: tool sandboxes must not see raw credentials; an outbound proxy injects them.\n\nProject: [[project-open-managed-agents]]. Related: [[feedback-public-kb-only]].", "tech-prompt-cache-byte-sensitive": "Prompt caching keys on exact prefix bytes. Unstable timestamps, random IDs, or reordered system text kill hit rates.\n\nRelated: [[project-open-managed-agents]], [[tech-ai-agent-stack]].", "tech-rag-citation-guards": "Don't accept a citation because the URL exists. Require retrieved passage support for the claim.\n\nRelated: [[tech-rag-toc-pollution]], [[feedback-fail-loud]].", "tech-rag-metadata-key-drift": "If ingest writes `source_url` and query filters `url`, retrieval silently degrades.\n\nLock a schema; test filters. Related: [[tech-rag-toc-pollution]], [[tech-qdrant-config-at-create]].", "tech-rag-toc-pollution": "TOC/index pages often dominate vector search without answering the question.\n\nMitigate: exclude TOCs, chunk body-only, or metadata filters. Related: [[tech-rag-citation-guards]], [[tech-rag-metadata-key-drift]].", "tech-npx-scoped-package-bin": "`npx @scope/name` (and `npx --package @scope/name name`) looks up an executable named **`name`** \u2014 the unscoped last path segment. It does not automatically pick `anyr` just because that is the documented command.\n\nIf the package ships several bins (`anyr`, `anyrouter`, `ar`) and none is named `name`, some npx versions fail with `name: not found` (exit 127) or \"could not determine executable to run\". Newer npx may pick the first bin, so the bug can look machine-specific.\n\n**How to apply:** add a bin key that matches the last path segment, pointing at the same file as the documented command. Keep the documented aliases. Prove it with `npx --yes --package <tarball> <last-segment> --help`, not by reading `package.json` alone.", "tech-note-atomic": "Atomic = one concept per note, short body, dense wikilinks.\n\n**How to apply:** if >~25 lines or multiple independent claims, split. Index: MEMORY.md. See [[tech-note-frontmatter]], [[tech-okf-bundle]].", "tech-note-frontmatter": "Required: `name` (== filename), `description`, `type`, `tags`, `created`, `updated`, `timestamp` (ISO 8601).\n\nOptional: `title`, `category`, `aliases`, `related`, `sources`. No nested `metadata:`.\nLint: `kb lint`. Template: memory/_TEMPLATE.md. See [[tech-note-atomic]].", "tech-okf-bundle": "This repo follows an OKF-inspired layout: `memory/` concepts, generated `index.md`/`log.md`, required `timestamp`.\n\nTools: `kb gen` regenerates indexes + viz. Protocol: [[project-kb]], [[feedback-docs-kb-is-brain]].\nSpec pointer: https://github.com/GoogleCloudPlatform/knowledge-catalog", "tech-unit-suffix-vs-scale": "If a formatter shows `min`/`h`/`ms`, it must not convert magnitudes unless the multiplier is explicit.\n\nSmell: values that can never reach \"60 minutes\" if unit is wrong. Related: [[tech-flat-design-semantic-tokens]].", "tech-flat-design-hairline": "Flat/hairline look: borders over drop shadows; lucide (or Phosphor) icons; dark mode supported.\n\nRelated: [[tech-flat-design-semantic-tokens]], [[project-monorepo]], [[project-llm-timeline]].", "tech-flat-design-semantic-tokens": "Prefer semantic tokens (`bg-card`, `text-muted-foreground`) so themes/dark mode stay coherent.\n\nRelated: [[tech-flat-design-hairline]], [[tech-shadcn-base]], [[tech-unit-suffix-vs-scale]].", "tech-kumo-rsc-createcontext": "If a UI kit uses `createContext` at import time, every importer may need `\"use client\"` (RSC).\n\nPrefer kits that stay server-safe or isolate client entrypoints. Related: [[tech-shadcn-base]].", "tech-og-images-build-time": "One registry feeds both image generation (e.g. Satori) and route head links. Avoid dual sources of truth.\n\nRelated: [[tech-og-meta-in-prerender]], [[tech-tanstack-start-ssg]].", "tech-og-meta-in-prerender": "Put OG/Twitter meta into prerendered HTML. Client-only `useEffect` head injection is invisible to most crawlers.\n\nRelated: [[tech-og-images-build-time]], [[tech-tanstack-start-ssg]].", "tech-rust-wasm-when": "Prefer TypeScript for most UI/data shaping. Use Rust\u2192WASM when profiling shows >~1ms hot paths.\n\nCI trap: [[tech-wasm-prerender-ci]]. Language context: [[user-duyet-lang-rust]].", "tech-shadcn-base": "Default component kit for public apps: shadcn/ui with CVA variants. Pair with [[tech-flat-design-semantic-tokens]].\n\nUsed in [[project-anyrouter]], [[project-monorepo]]. RSC pitfall: [[tech-kumo-rsc-createcontext]].", "tech-tanstack-stale-chunks": "After deploy, old tabs may request deleted lazy chunks \u2192 runtime error on `component`.\n\nMitigations: soft reload on chunk load failure; keep critical shells prerendered. See [[tech-tanstack-start-ssg]], [[project-anyrouter]].", "tech-tanstack-start-ssg": "Prerender routes to static HTML so crawlers and edge hosts see real content without relying on client JS alone.\n\nPairs with [[tech-og-meta-in-prerender]], [[tech-tanstack-stale-chunks]], [[tech-cloudflare-pages-deploy]].\nUsed by [[project-monorepo]], [[project-llm-timeline]].", "tech-wasm-prerender-ci": "SSG pipelines that import WASM must build release WASM in CI before prerender. Silent empty pages are worse than hard fail.\n\nRelated: [[tech-rust-wasm-when]], [[tech-tanstack-start-ssg]], [[tech-cloudflare-pages-deploy]].", "tech-agent-loop-cheap-subagents": "Mechanical PR fixes and checklist reviews \u2192 cheaper models. Hard architecture stays on the main/high tier.\n\nPolicy: [[feedback-cheap-models-subagents]]. Cycle: [[tech-agent-loop-cycle]].", "tech-agent-loop-cycle": "Pattern: recurring cycle scans open PRs/issues, classifies, dispatches workers, merges when safe.\n\nCost control: [[tech-agent-loop-cheap-subagents]]. Related: [[project-duyetbot]], [[feedback-never-auto-merge-release-please]].", "tech-codebase-maintenance-loop": "Priority order often: build > tests > lint > deploy > quality > features.\n\nSafe dead-code removal only with proof. Related: [[tech-improvement-loop]], [[feedback-logic-change-update-tests]], [[project-duyetbot]].", "tech-cron-as-code-install-script": "Durable host jobs belong in the repo: a `cron.lines` (or equivalent) file plus\nan installer that wraps the block in `BEGIN`/`END` markers, replaces any prior\nblock, and can `--remove`. Hand-editing `crontab -e` is not reproducible on the\nnext machine.\n\n**How to apply:** new machine runs the installer; do not copy crontab lines from\nchat. When substituting command strings into crontab, do not use `sed` `s|||`\nif the replacement contains `&` (`2>&1`) \u2014 `sed` treats `&` as the match.\n\n**Why:** a missing or corrupted redirect silently drops job logs.", "tech-daily-manager-leaves-worktrees": "A morning manager that fans GitHub issues into isolated git worktrees should\n**not** close those worktrees when a child finishes. Persist a dated folder\n(`SUMMARY.md`, issue picks, per-child status) in the repo so the next morning\nis a review, not an archaeology pass.\n\n**How to apply:** cron starts the manager; nightly cron only refreshes the\nsummary; humans close or merge after reading the summary.\n\n**Why:** transcripts disappear; filesystem state plus open panes are the review\nsurface.", "tech-digest-local-date": "Key a once-per-local-day digest by the audience timezone date, not UTC. If the snapshot row uses UTC and the sender looks up local date, the lookup is null around midnight and the channel never posts.\n\nIf the LLM step that writes the snapshot fails, persist a non-invented fallback (e.g. existing titles) so the send path still has a row. Related: [[project-news]].", "tech-dotenv-unquoted-value-kills-source": "`set -a; source .env` is a common way to load config into a shell. It parses as\n**shell code**, not as a config format, so a value containing an unquoted\nmetacharacter (`<` `>` `|` `&` `;` `(` `)`) is a syntax error:\n\n```\nNAME=Some Product <noreply@example.com>\n    -> syntax error near unexpected token `newline'\n```\n\n**The damage is everything below it.** `source` aborts at that line, so every variable\ndefined *after* it is never set. There is no error at the point of use \u2014 the variable\nis simply empty, and a script continues with a blank URL, host, or password.\n\n**Why it survives for months:** dotenv-style loaders (Node, Python, Vite, wrangler)\ntokenize line-by-line and handle the same file without complaint. Only the shell path\nbreaks, so it fails for scripts and CI steps while the application works fine.\n\nDetect it \u2014 the error goes to stderr and is easy to swallow:\n\n```\nset -a; source .env            # do NOT redirect stderr away\ngrep -nE '^[A-Z_]+=[^\"'\"'\"']*[<>|&;()]' .env      # find unquoted offenders\n```\n\nFix by quoting the value. Prefer quoting **every** value in files that anything\nsources.\n\nTwo related traps:\n- `source` inside a pipeline (`source .env | head`) runs in a subshell, so the\n  variables vanish before the next command \u2014 a test harness bug that looks identical\n  to the real failure.\n- This is the same family as a database client accepting an empty connection string\n  and reporting success: the failure is the *absence* of a value, so nothing throws.", "tech-herdr-morning-issue-desk": "Unattended daily issue pass: a user-session terminal multiplexer (Herdr) is already running. Cron only talks to that socket.\n\n- Morning: start or nudge a **manager** agent on the `main` checkout. Manager does not implement on `main`.\n- Manager writes a **dated run folder** (queue, workers, summary) on disk; leave tabs/workspaces **open** for human review.\n- Children: one isolated git worktree + one agent each. Cap concurrency (default 3).\n- Nightly: if the manager is still live, ask it for a wrap file. Do not spawn a second evening manager.\n- Timers are **code in the repo** (crontab snippet + systemd user units + install script). Re-run install on a new machine.\n- If the multiplexer socket is missing, the cron job exits 0 and logs a skip.\n- Never auto-merge release-please PRs.\n\n**Why:** overnight GitHub triage without mixing work onto `main`.\n**How to apply:** install the repo's issue-desk script; review the latest run folder and open workspaces in the morning.", "tech-improvement-loop": "Loop: pick highest priority \u2192 implement \u2192 lint/test/build \u2192 commit \u2192 deploy \u2192 log.\n\nPersona: [[project-duyetbot]]. Deploy: [[tech-cloudflare-pages-deploy]]. Cheap fan-out: [[feedback-cheap-models-subagents]].", "tech-one-codebase-oss-saas": "Pattern: single high-level deployment mode (`oss|cloud`) that resolves auth/storage defaults. Unset/junk \u2192 OSS so open source never degrades.\n\nNever gate core product features behind cloud-only. Example product: [[project-clickhouse-monitoring]]. Env: [[tech-single-source-env]].", "tech-single-source-env": "Dual sources (hand-maintained wrangler vars vs Vite `VITE_*`) drift silently. Canonical names \u2192 derive client + deploy targets.\n\nSecrets never in committed env files. Related: [[tech-one-codebase-oss-saas]], [[feedback-public-kb-only]].", "tech-tmux-pane-labels": "Use tmux `pane-current-command` \u2192 icon mapping so multi-agent sessions are glanceable.\n\nGeneric DX only \u2014 no hostnames. Related: [[user-duyet-local-dev]], [[user-duyet-ai-claude-code]].", "user-duyet-active-projects": "Duyet builds **many products in parallel** (not single-app focus). Confirm repo before large edits ([[feedback-disambiguate-repo]]).\n\n| Area | Product | Public |\n|------|---------|--------|\n| ClickHouse | [[project-clickhouse-monitoring]] | chmonitor.dev \u00b7 dash.chmonitor.dev \u00b7 github.com/chmonitor/chmonitor |\n| LLM gateway | [[project-anyrouter]] | anyrouter.dev \u00b7 dash.anyrouter.dev \u00b7 docs.anyrouter.dev |\n| AnyRouter OS | [[project-anyrouter-os]] | os.anyrouter.dev |\n| Agent fleet state | [[project-agentstate]] | agentstate.app \u00b7 github.com/duyet/agentstate |\n| Local agent | [[project-anyworker]] | anyworker.dev \u00b7 github.com/duyet/anyworker |\n| Managed agents | [[project-open-managed-agents]] | public OSS |\n| Agent persona | [[project-duyetbot]] | agents.duyet.net |\n| Personal web | [[project-monorepo]] | duyet.net family |\n| Shared brain | [[project-kb]] | kb.duyet.net |\n| Timeline | [[project-llm-timeline]] | llm-timeline.duyet.net |\n| Homelab / charts | [[user-duyet-homelab]] \u00b7 [[project-charts]] | homelab.duyet.net |\n\nAlso: [[user-duyet-multi-project]], [[reference-duyet-github]], [[user-duyet-ai-stance]], [[user-duyet-web-presence]].", "user-duyet-ai-claude-code": "Claude Code is the daily driver after trying many tools. Tools remain disposable \u2014 [[user-duyet-ai-tools-disposable]]. Index: [[user-duyet-ai-stance]].", "user-duyet-ai-stance": "AI practice index:\n\n- [[user-duyet-ai-vibe-codes]] \u2014 agents drive production work\n- [[user-duyet-ai-claude-code]] \u2014 Claude Code as daily driver\n- [[user-duyet-ai-tools-disposable]] \u2014 tools change; don't lock dogma\n- [[tech-ai-agent-stack]] \u2014 SDK ecosystem\n- [[project-duyetbot]] \u2014 autonomous monorepo agent persona\n\nRelated: [[user-duyet-focus-llm-agents]], [[feedback-docs-driven-development]].", "user-duyet-ai-tools-disposable": "Do not enshrine one IDE/agent forever. Prefer portable patterns: [[feedback-docs-driven-development]], [[tech-ai-agent-stack]].", "user-duyet-ai-vibe-codes": "Public practice: vibe-codes for production; agents write more than hand-typed code. See [[user-duyet-ai-stance]], [[feedback-docs-driven-development]].", "user-duyet-data-clickhouse": "Primary analytics engine in public writing and tooling. Products: [[project-clickhouse-monitoring]]. Blog: [[reference-duyet-blog]].", "user-duyet-data-spark-airflow": "Public DE stack also includes Apache Spark and Apache Airflow (blog series). See [[user-duyet-focus-data-engineering]], [[reference-duyet-blog]].", "user-duyet-focus-clickhouse": "ClickHouse is a primary public specialty (blog volume + tooling). Flagship: [[project-clickhouse-monitoring]] / [[project-chmonitor-advisor]]. See [[reference-duyet-blog]], [[user-duyet-stack]], [[user-duyet-active-projects]].", "user-duyet-focus-data-engineering": "Public focus: large-scale data platforms, real-time analytics, Kafka/Spark/Airflow ecosystems.\n\nRelated: [[user-duyet-focus-clickhouse]], [[user-duyet-stack]], [[reference-duyet-blog]].", "user-duyet-focus-llm-agents": "Recurring public themes: coding agents, agent SDKs, RAG, self-improving loops, agent memory.\n\nProducts: [[project-anyrouter]], [[project-agentstate]], [[project-anyworker]], [[project-open-managed-agents]]. Stance: [[user-duyet-ai-stance]]. Stack: [[tech-ai-agent-stack]]. Pattern: [[feedback-docs-driven-development]].", "user-duyet-github": "https://github.com/duyet \u2014 public repos. Catalog: [[reference-duyet-github]]. Notable: [[project-anyrouter]], [[project-agentstate]], [[project-anyworker]], [[project-clickhouse-monitoring]], [[project-monorepo]], [[project-open-managed-agents]], [[project-kb]], [[project-homelab]].", "user-duyet-handle": "Public handle: **`@duyet`**. GitHub: https://github.com/duyet. Profile hub: [[user-duyet-profile]].", "user-duyet-homelab": "Duyet runs a **personal homelab** for self-host experiments and ops practice.\n\nPublic surface: [[project-homelab]] \u00b7 [[project-charts]] \u00b7 [[user-duyet-site-homelab]].\nStack overlap: [[user-duyet-infra-kubernetes]], [[user-duyet-data-clickhouse]].\n\n**Never store** hosts, IPs, VPN endpoints, or topology here ([[feedback-public-kb-only]]).", "user-duyet-infra-cloudflare": "Cloudflare Workers/Pages host many public apps. Patterns: [[tech-cloudflare-pages-deploy]], [[tech-workers-cache-enabled]], [[project-anyrouter]].", "user-duyet-infra-kubernetes": "Kubernetes appears in public blog series, Helm work, and personal lab practice. See [[project-charts]], [[project-homelab]], [[user-duyet-homelab]], [[user-duyet-stack]].", "user-duyet-lang-python": "Python is a core language for data engineering and agent tooling. See [[user-duyet-stack]], [[user-duyet-focus-data-engineering]].", "user-duyet-lang-rust": "Rust is a primary language on public GitHub (UDFs, data tools, WASM). See [[user-duyet-stack]], [[tech-rust-wasm-when]], [[reference-duyet-github]].", "user-duyet-lang-sql": "SQL is daily for analytics and ClickHouse. See [[user-duyet-focus-clickhouse]], [[user-duyet-data-clickhouse]].", "user-duyet-lang-typescript": "TypeScript/JS for public web apps and Cloudflare Workers. See [[user-duyet-stack]], [[project-monorepo]], [[project-anyrouter]].", "user-duyet-local-dev": "Local tools (public): macOS, Homebrew, `bun`, `uv`, neovim, Obsidian, tmux ([[tech-tmux-pane-labels]]). Prefers [[feedback-semantic-commits]] and [[feedback-concise-english]].", "user-duyet-multi-project": "Default assumption: Duyet is building **several products at once** (gateway, agent infra, ClickHouse tooling, personal sites, homelab).\n\n**How to apply:** disambiguate which repo/product a task is for; don't collapse everything into monorepo. Index: [[user-duyet-active-projects]]. Scope: [[feedback-public-kb-only]].", "user-duyet-profile": "**Duyet Le** (handle `@duyet`) \u2014 senior data engineer and open-source contributor.\n\nHandle: [[user-duyet-handle]]. Active portfolio: [[user-duyet-active-projects]]. Homelab: [[user-duyet-homelab]]. Focus areas: [[user-duyet-focus-data-engineering]], [[user-duyet-focus-clickhouse]], [[user-duyet-focus-llm-agents]].\nStack: [[user-duyet-stack]]. Presence: [[user-duyet-web-presence]]. Style: [[feedback-working-style]].", "user-duyet-site-blog": "https://blog.duyet.net \u2014 digital garden. Themes: [[reference-duyet-blog]]. Feed: https://blog.duyet.net/feed. Index: [[user-duyet-web-presence]].", "user-duyet-site-homelab": "https://homelab.duyet.net \u2014 public overview page for the personal lab.\n\nRelated: [[user-duyet-homelab]], [[user-duyet-web-presence]], [[project-homelab]].", "user-duyet-site-kb": "https://kb.duyet.net renders [[project-kb]]. Implements [[feedback-docs-driven-development]].", "user-duyet-stack": "Stack index (public blog/GitHub). Drill into atoms:\n\n- Languages: [[user-duyet-lang-rust]], [[user-duyet-lang-python]], [[user-duyet-lang-typescript]], [[user-duyet-lang-sql]]\n- Data: [[user-duyet-data-clickhouse]], [[user-duyet-data-spark-airflow]]\n- Infra: [[user-duyet-infra-kubernetes]], [[user-duyet-infra-cloudflare]]\n- AI: [[user-duyet-ai-stance]], [[tech-ai-agent-stack]]\n- Local: [[user-duyet-local-dev]]\n- Homelab: [[user-duyet-homelab]]\n- Products: [[user-duyet-active-projects]]", "user-duyet-web-presence": "Public sites (prefer `/llms.txt` when present):\n\n| Site | URL |\n|------|-----|\n| Profile / blog / CV | https://duyet.net \u00b7 https://blog.duyet.net \u00b7 https://cv.duyet.net (+ `/llms.txt`) |\n| GitHub / X | https://github.com/duyet \u00b7 https://x.com/_duyet |\n| Personal products | https://llm-timeline.duyet.net \u00b7 https://news.duyet.net \u00b7 https://agents.duyet.net \u00b7 https://kb.duyet.net \u00b7 https://homelab.duyet.net |\n| AnyRouter | https://anyrouter.dev \u00b7 https://os.anyrouter.dev \u00b7 https://docs.anyrouter.dev |\n| Agent / CH | https://agentstate.app \u00b7 https://anyworker.dev \u00b7 https://chmonitor.dev |\n\nAtoms: [[user-duyet-site-blog]], [[user-duyet-github]], [[user-duyet-site-kb]], [[user-duyet-site-homelab]]. Portfolio: [[user-duyet-active-projects]]. Profile: [[user-duyet-profile]]."}, "types": ["feedback", "project", "tech", "reference", "user"], "palette": {"feedback": "#ec4899", "project": "#3b82f6", "tech": "#f59e0b", "reference": "#10b981", "user": "#8b5cf6"}};
(function(){
  const b=window.BUNDLE, byId={}; b.nodes.forEach(n=>byId[n.data.id]=n.data);
  const back={}; b.edges.forEach(e=>{(back[e.data.target]=back[e.data.target]||[]).push(e.data.source)});
  const leg=document.getElementById("legend");
  b.types.forEach(t=>{const s=document.createElement("span");s.innerHTML='<i style="background:'+b.palette[t]+'"></i>'+t;leg.appendChild(s)});
  const cy=cytoscape({container:document.getElementById("graph"),elements:[...b.nodes,...b.edges],style:[
    {selector:"node",style:{"label":"data(label)","background-color":"data(color)","width":"data(size)","height":"data(size)","color":"#334155","font-size":10,"text-valign":"bottom","text-margin-y":4,"text-wrap":"wrap","text-max-width":80}},
    {selector:"node:selected",style:{"border-width":3,"border-color":"#0f172a"}},
    {selector:"edge",style:{"width":1,"line-color":"#cbd5e1","curve-style":"bezier","opacity":.55}}
  ],layout:{name:"cose",animate:false,idealEdgeLength:90,nodeRepulsion:9000,padding:20}});
  function select(id){
    cy.nodes().unselect(); const el=cy.getElementById(id); if(el&&el.length)el.select();
    const n=byId[id]; if(!n) return;
    const bodyMd=b.bodies[id]||"";
    const tags=(n.tags||[]).map(t=>'<span>'+t+'</span>').join("");
    const bl=(back[id]||[]).map(s=>'<li><a data-id="'+s+'">'+((byId[s]||{}).label||s)+'</a></li>').join("");
    document.getElementById("detail").innerHTML=
      '<h1>'+n.label+'</h1>'+
      '<span class="badge" style="background:'+(b.palette[n.type]||'#64748b')+'">'+n.type+'</span>'+
      (n.resource?' <a class="muted" href="'+n.resource+'" target="_blank" rel="noopener">source ↗</a>':'')+
      '<p class="desc">'+(n.description||'')+'</p>'+
      (tags?'<div class="tags">'+tags+'</div>':'')+
      '<div class="body">'+marked.parse(bodyMd)+'</div>'+
      (bl?'<div id="backlinks"><h2>Linked from</h2><ul>'+bl+'</ul></div>':'');
    document.querySelectorAll('#backlinks a').forEach(a=>a.onclick=()=>select(a.dataset.id));
  }
  cy.on("tap","node",e=>select(e.target.id()));
  if(b.nodes.length) select(b.nodes[0].data.id);
})();
</script>
