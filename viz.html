uest because a model is \"unsupported\" by Cloudflare \u2014 it only resolves which\n**upstream/provider** to route to and forwards the model string unchanged. So you\ncan serve a brand-new model the moment the **upstream provider** hosts it; no\nwaiting on Cloudflare.\n\n- **Custom & per-provider endpoints** (`.../<gateway>/custom-{slug}/...`): the\n  model is never parsed \u2014 everything after `custom-{slug}/` is appended to the\n  registered `base_url` and forwarded verbatim. Creating a custom provider needs\n  only `name`/`slug`/`base_url` \u2014 no model registration.\n- **Universal / `compat` endpoint** (`model: \"provider/model\"`): AI Gateway parses\n  only the **provider prefix** to pick a route. The error `\"X is not a valid model\n  ID\"` here means an **unknown provider prefix**, never an unsupported model.\n- A `\"... is not a valid model ID\"` in the AIG dashboard is the **upstream's**\n  rejection (the model isn't hosted there), not AI Gateway's. Debug upstream\n  availability, not gateway config.\n\n**Proven:** routing `nvidia/cosmos3-nano-reasoner` through a custom NVIDIA provider\nreached `integrate.api.nvidia.com` and NVIDIA rejected it (model is self-host\nNIM/HF-weights only, not on the hosted API). AIG passed it through fine.", "tech-cloudflare-pages-deploy": "Each [[project-duyet-net]] app deploys to Cloudflare Pages\n(`scripts/cf-deploy-prod.sh`, per-app `pnpm run cf:deploy:prod`,\n`pages_build_output_dir = \"dist/client\"`).\n\n**Per-task convention:** semantic commit \u2192 push to `master` \u2192 background-deploy\nthe changed app, then continue; verify production (`curl` \u2192 200) after the\ncompletion notification.\n\n**Hazard:** never run two background deploys in parallel \u2014 the script renames\n`.env.local` \u2192 `.env.local.deploy-bak` mid-run, so parallel runs collide and lose\nthe CF API token.\n\n**CI (`cf-deploy.yml`):** matrix over apps on push to `master`; the blog entry\nadds rust-toolchain + wasm-pack + `wasm:build:release` before build (see\n[[tech-rust-wasm-prerender]]); other apps skip it.\n\n**commitlint:** `subject-case` lowercase, `body-max-line-length` 100. Pre-commit\nhook runs `pnpm run test`. Root checks before completing a multi-file task:\n`pnpm run lint` (Biome) + `pnpm run check-types` + `pnpm run test`. Aligns with\n[[feedback-working-style]]; run autonomously by [[project-duyetbot]].", "tech-cloudflare-workers-cache": "**Workers Cache** (launched 2026-07-06) is a tiered cache that sits **in front of\na Worker**, belonging to the Worker (not the zone). On a cache HIT the Worker\nnever runs \u2014 no CPU billing, response served from the nearest tier. This is the\nmissing piece for SSR-on-Workers (TanStack Start / Astro / Next / Hono are *the\norigin*, so every request used to re-render).\n\n## Enable (one line, per worker)\n\n```jsonc\n// wrangler.jsonc            // wrangler.toml\n\"cache\": { \"enabled\": true } // [cache]\\nenabled = true\n```\n\nEnabling is **safe by default**: only responses with an explicit **public**\n`Cache-Control` are stored; everything else is a MISS/BYPASS. Requests carrying\nan `Authorization` header **auto-bypass** (great for authed APIs \u2014 inference /\n`Bearer` / `ak_` keys never cache).\n\n## Control with standard headers (no rules engine, no zone config)\n\n```ts\nreturn new Response(body, { headers: {\n  \"Cache-Control\": \"public, max-age=300, stale-while-revalidate=3600\",\n  \"Cache-Tag\": \"products,product:123\",     // tag-based purge\n  \"Vary\": \"Accept, Accept-Language\",        // one URL \u2192 many cached variants\n}})\n```\n\n- **`max-age`** = fresh window (served from cache, Worker idle).\n- **`stale-while-revalidate`** = serve stale instantly (`Cf-Cache-Status:\n  UPDATING`) while a background refresh runs \u2014 *no user ever waits*. This is what\n  makes it \"feel static\".\n- **`Vary: *`** disables caching. Normalize headers in a gateway before `Vary` to\n  avoid variant fan-out.\n\n## Purge / multi-tenant / per-entrypoint\n\n- Purge from the **owning entrypoint**: `await ctx.cache.purge({ tags: [...] })`\n  / `{ prefix: \"/x\" }` / `{ purgeEverything: true }` (scoped to that entrypoint\n  only).\n- **Per-user safety:** identity passed via `ctx.props` is part of the cache key,\n  so an authed API caches per-user with no cross-tenant leaks. Pattern:\n  gateway authenticates \u2192 strips `Authorization` \u2192 sets `ctx.props.userId` \u2192\n  calls a cached inner entrypoint.\n- **Per-entrypoint control** in wrangler `exports`: disable cache on the\n  gateway/router entrypoint (must always run), enable on the expensive inner one.\n  The cache becomes a *layer inside one Worker*, between `ctx.exports` calls.\n\n## How to apply (rules I use)\n\n1. Enable `cache.enabled` on every public-facing Worker \u2014 it's a no-op until you\n   add public `Cache-Control`.\n2. Add `Cache-Control: public, \u2026` **only** to genuinely public, non-user-specific\n   GET responses: SSR marketing/docs/blog pages, static datasheets/catalogs,\n   sitemaps/robots/llms.txt, public read-only list APIs, health.\n3. **Never** public-cache authed / per-user / personalized / mutating routes \u2014\n   leave them uncacheable (Authorization auto-bypasses anyway).\n4. TTL rule of thumb: content pages `max-age=300, swr=86400`; near-static\n   (cv/photos/model datasheets) `max-age=3600, swr=604800`; volatile list APIs\n   `max-age=60, swr=300`.\n5. **Billing gotcha:** once cache is enabled, static-asset requests and\n   worker-to-worker (service binding / `ctx.exports`) calls bill at the standard\n   *request* rate (each consults the cache); HITs still cost 0 CPU.\n\nRolled out across duyet's CF fleet 2026-07: [[project-anyrouter]],\n[[project-chmonitor-one-codebase-saas]], [[project-duyet-net]] monorepo, and\nagentstate \u2014 see each repo's own `workers-cache` KB note for the endpoint map.", "tech-traefik-forwardauth-oauth2-proxy": "Pattern for protecting k8s services behind GitHub OAuth2 via Traefik forwardAuth.\n\n## Architecture\n\n```\nRequest \u2192 Traefik IngressRoute\n  \u2192 forwardAuth middleware (points to auth-redirector:9190/auth)\n    \u2192 auth-redirector (nginx) proxies to oauth2-proxy:4180/oauth2/auth\n      \u2192 200: pass through (authenticated)\n      \u2192 401: nginx intercepts \u2192 302 to oauth2-proxy login\n```\n\n## Key insight: why nginx redirector is needed\n\nTraefik's `ErrorPages` middleware replaces the response body but **keeps the original status code**. When oauth2-proxy returns 302 on unauthenticated requests, ErrorPages rewrites it \u2014 the redirect never reaches the browser. The nginx redirector intercepts the 401 from oauth2-proxy and returns its own 302 with the correct `Location` header. This is a known Traefik limitation, not a bug.\n\n## OAuth2 Proxy callback URL\n\nMust use the proxy prefix path `/oauth2/callback`, not `/callback`:\n\n```\nredirect-url: \"https://auth.example.com/oauth2/callback\"\nlogin URL:     \"https://auth.example.com/oauth2/start?rd=<original-url>\"\n```\n\n## Traefik Middleware config\n\n```yaml\napiVersion: traefik.io/v1alpha1\nkind: Middleware\nspec:\n  forwardAuth:\n    address: http://auth-redirector.<ns>.svc.cluster.local:9190/auth\n    authResponseHeaders:\n      - X-Auth-Request-Email\n      - X-Auth-Request-User\n    trustForwardHeader: true\n```\n\nApply to IngressRoute via `middlewares` annotation or CRD middleware chain.", "tech-qdrant-hnsw-tuning": "## What Qdrant is\nVector database: stores embeddings + payload (metadata), does approximate\nnearest-neighbour (ANN) search by vector similarity, optionally pre-filtered by\npayload. A \"collection\" = one vector space (fixed dimension + distance metric).\n\n## HNSW \u2014 the ANN index\n**Hierarchical Navigable Small World**: a multi-layer proximity graph. Each\npoint links to its nearest neighbours; upper layers are sparse \"express lanes\",\nlower layers dense. Search greedily hops toward the query \u2014 **logarithmic**, not\na full scan. Key params:\n- `m` \u2014 links per node (graph density). Higher = better recall, more RAM. 16 is a good default.\n- `ef_construct` \u2014 candidate list size at build time. Higher = better index quality, slower build. 200 is solid.\n- `full_scan_threshold` \u2014 below this many points (or post-filter subset), Qdrant does brute force instead of HNSW. **A tight payload filter can drop you under this \u2192 silent full scan.**\n\n## Why high-dim collections time out\nCost scales with **dimension \u00d7 points searched**. A 4096-d float32 vector is\n2.67\u00d7 a 1536-d one. With default HNSW (`ef_construct=100`) **or** a filter that\nforces full scan, search over full-precision 4096-d vectors blows past a tool's\ntimeout. Symptom: *some* queries return, others time out on the *same*\ncollection (the slow ones are filtered/borderline \u2192 full scan).\n\n## The fix: quantization\n**INT8 scalar quantization** stores a 1-byte proxy per dimension (4\u00d7 smaller\nthan float32), kept in RAM (`always_ram=true`). HNSW traverses the cheap int8\nvectors, then **rescores** the top candidates at full precision (kept on disk).\nThis is the dominant speedup at high dimensions. Combine with `on_disk=true`\nvectors so RAM holds only the quantized index.\n\n## Gotchas\n- **Config applies only at `create_collection`.** Changing creation code does\n  NOT retro-fit an existing collection. Apply in-place with `update_collection`\n  (sets `hnsw_config` / `quantization_config` \u2014 re-optimizes, **no re-embed**),\n  or recreate/reindex.\n- **Payload indexes are separate.** Filtered search (`language=en`, category\u2026)\n  needs a payload index per field or it scans. Create explicitly.\n- **Centralize creation config** in one helper so every collection (and future\n  blue-green swaps) inherits HNSW + quantization, instead of bare `VectorParams`.\n\n## Verify / remediate a live collection\n- `client.get_collection(name)` \u2192 inspect `config.hnsw_config`, `quantization_config`.\n- `client.update_collection(name, quantization_config=..., hnsw_config=...)` \u2014 in-place.\n- List payload indexes via `get_collection(...).payload_schema`.", "lessons-oma-selfhost-deploy": "Companion to [[tech-oma-k3s-deploy]] (the how-to). This is the **what-bit-us** list, in the order it bit.\n\n## 1. The self-host binary is a DIFFERENT app than the docs imply\nThe Cloudflare/full build is `apps/main`; the Node self-host is `apps/main-node`, a *separately assembled* Hono app that mounts routes one-by-one. It runs from **source** via `tsx src/index.ts` (no bundle) \u2014 so you can read the exact live routing with `kubectl exec ... grep app.route /app/apps/main-node/src/index.ts`. Several `apps/main` features are only **stubbed** in main-node:\n- `GET /v1/model_cards` \u2192 hardcoded `{data:[]}`; **no POST/PUT/DELETE, no ModelCardsService, no table**. So BYOK model cards can't be created on self-host at all.\n- `GET /v1/integrations/*/credentials` \u2192 `{data:[]}` stubs.\nLesson: when a self-host endpoint 404s or returns empty, **read the actually-listening app's source**, don't assume the documented/full-build behavior. A 404 with `{\"error\":\"not found\"}` was the app's global `app.notFound`, not a routing-order bug \u2014 I initially mis-diagnosed it as the latter.\n\n## 2. BYOK + uncapped max_tokens = every turn 502s\nSymptom: agent runs fail `finish_reason:\"error\", \"Failed after 3 attempts. Last error: Bad Gateway\"`. Root cause chain:\n- OMA's default harness calls `streamText()` with **no `maxOutputTokens`** \u2192 AI SDK defaults to provider max (4096 for Anthropic).\n- AnyRouter routed the model to an **openrouter-byok** upstream (bills the user's *OpenRouter* account, NOT AnyRouter's own credit balance).\n- BYOK upstreams reject when the **requested** max exceeds the affordable balance \u2014 regardless of how tiny the real output is.\nProof: same in-pod key + model at `max_tokens:16` \u2192 HTTP 200; at 4096 \u2192 502. And a fat AnyRouter `monthly_balance` (e.g. $162) does **not** help \u2014 BYOK bills elsewhere.\nFixes (any one): (a) add `maxOutputTokens` cap to the harness \u2014 shipped as opt-in env `OMA_MAX_OUTPUT_TOKENS` (duet PR #4); (b) top up the BYOK upstream account; (c) disable BYOK so requests bill AnyRouter credit.\nLesson: \"upstream 502 after retries\" from a gateway usually means the *upstream* rejected the request params (here: unaffordable max_tokens), not a transient network blip. Check the `anyrouter_metadata.upstream.provider` field \u2014 `*-byok` changes who pays.\n\n## 3. pnpm v11 `strictDepBuilds` hard-fails the Docker build\nThe ghcr image workflow failed at `pnpm install --frozen-lockfile` with `[ERR_PNPM_IGNORED_BUILDS]` on `@google/genai`, `@mongodb-js/zstd`, `node-liblzma`. pnpm v11 refuses to *silently* skip a dependency's postinstall script \u2014 every script-bearing dep must be **explicitly listed** in `allowBuilds` (the v11 map that replaced the `onlyBuiltDependencies` array; v11 reads it from `pnpm-workspace.yaml`, and **ignores** the `pnpm` block in package.json). `true`=run the build (needs a toolchain in the image), `false`=explicitly skip. A local build with an older, lenient pnpm hid this \u2014 CI on a fresh runner (corepack pinned `pnpm@11.0.8`) surfaced it. Fix: add the three as `false` (they ship prebuilt binaries; the live image runs fine without their gyp rebuilds), avoiding pulling build-essential into the image.\nLesson: pin `packageManager` AND keep `allowBuilds` complete, or the image build breaks the moment a new script-bearing transitive dep appears. `.pnpm-approve-builds.json` in this repo is legacy/unused by v11 \u2014 the yaml `allowBuilds` is authoritative.\n\n## 4. GitOps / k8s propagation gotchas\n- **ConfigMap changes don't reach a running pod** \u2014 env is injected at container start. After Argo syncs a ConfigMap edit, you still need `kubectl -n oma rollout restart deploy/oma`.\n- Initial deploy used **locally-built images imported to containerd** (`k3s ctr images import`) with `imagePullPolicy: Never`. Fast to bootstrap, but every code change then needs a rebuild+reimport. Migrating to `ghcr.io` pull (CI-published) removes that, at the cost of an image-source + pullPolicy change in the deployment.\n- Building images on the Mac (OrbStack buildx) then `docker save | ssh | ctr import` **filled the node disk** once and restarted OrbStack mid-cleanup. Build only the image you need, prune aggressively, prefer CI\u2192registry over local\u2192ctr for anything repeated.\n\n## 4b. LIVE WIN \u2014 Phase-E tool-use demonstrated\nAchieved a green agentic completion on k3s: an OMA agent on `google/gemini-2.5-flash` routed through **AnyRouter `/chat/completions`**, executed a **bash tool** (`echo \u2026 && uname -sm` \u2192 `hello-from-OMA / Linux x86_64`), and returned a final message \u2014 trajectory `is_error:false`, `finish_reason:tool-calls` then `stop`, billed to AnyRouter credit (used +$0.45). What unblocked it:\n- **BYOK is a dead end for Anthropic here.** All `anthropic/*` route to `openrouter-byok` (exhausted \u2192 502); AnyRouter's $160 credit does NOT cover BYOK. Only non-Anthropic models (gemini/deepseek) work, via `/chat/completions`, on credit.\n- **Node self-host was hardwired to Anthropic `/messages`** (`buildModel` in `apps/main-node/src/index.ts` passed `compat=undefined`). Added env `OMA_API_COMPAT=oai` (duet PR #6) so it uses the OpenAI-compatible wire format; also had to keep the FULL `provider/model` id (not strip the prefix) for the oai branch, else AnyRouter 404s `model_unavailable`.\n\n## 4c. Building the image ourselves (no CI) \u2014 gotchas\nBuilt `openma/main-node:dev` locally and imported to k3s (docker on the node is **masked** deliberately; OrbStack on the Mac was down \u2014 `orb start`).\n- **Cross-arch (ARM Mac \u2192 amd64 node) via qemu emulation is flaky:** the console `vite build` fails `MODULE_NOT_FOUND` under emulation \u2192 use `--build-arg SKIP_CONSOLE=1` for an API-only bridge image (CI on native amd64 doesn't hit this). apt-get in the runtime stage also intermittently fails \u2014 just retry.\n- **`--load` into the docker daemon can OOM/crash OrbStack** on a big emulated image \u2192 export straight to a tar: `--output type=docker,dest=img.tar`, and pass `-t name:tag` or the tar's `RepoTags` is null and `ctr import` lands it unnamed.\n- Import: `scp` the tar, then `k3s ctr -n k8s.io images import img.tar` (k8s.io namespace, needs sudo).\n- **THE BIG TRAP \u2014 `imagePullPolicy: Never` + a mutable tag caches the OLD image.** After re-importing `:dev`, `ctr images ls` shows the new digest but **`crictl images` (what kubelet uses) still maps the tag to the old config digest**, so `rollout restart` keeps launching the old code. `scale 0` + `crictl rmi` + re-import didn't fully clear it either. **What worked:** import under a NEW unique tag (`:v5`) and `kubectl set image deploy/oma main-node=\u2026:v5` \u2014 a fresh tag has no stale kubelet cache. (For real, use CI\u2192ghcr with immutable/digest tags and `pullPolicy: IfNotPresent`.)\n\n## 5. Process / guardrail lessons\n- The auto-mode classifier blocks: materializing secrets into tool output (print response bodies, never key bytes \u2014 use `node -e` with the key kept in `process.env`), self-merging your own fresh PRs with `--admin`, and shared-cluster mutations. Don't launder around these \u2014 surface and hand off.\n- Verify credentials/plumbing with the **smallest** possible direct call (`max_tokens:16`) before blaming credit/quota \u2014 it isolates \"key works\" from \"request too big for budget\".", "tech-oma-k3s-deploy": "**What OMA is:** self-hosted Claude Managed Agents API (Anthropic-compatible `/v1/agents` + `/v1/sessions`) with sessions, sandboxes, tools, memory, integrations, crash recovery. Node self-host (sqlite/postgres + FS) or Cloudflare (D1/KV/R2). **For k8s use the Node self-host path.**\n\n## Deploy on k3s via ArgoCD (Node self-host)\n- If the cluster already runs ArgoCD with an app-of-apps, add OMA as a new `Application` matching that repo layout; commit+push manifests so Argo syncs. Namespace-isolate as `oma`.\n- Workloads: `main-node` (API + Console) + `oma-vault`, plus postgres (or sqlite on a PVC). Images `openma/main-node` / `openma/oma-vault` \u2014 confirm they're published; if dev-only, build from the compose `build:` Dockerfiles and push to a registry the cluster can pull (or `k3s ctr images import` on-node).\n- Reuse the cluster's existing cert-manager + ingress convention to expose it rather than inventing one.\n\n## Required secrets (k8s Secret \u2014 never commit to git)\n- `ANTHROPIC_API_KEY` \u2014 any Anthropic-compatible key (an AnyRouter key works).\n- `ANTHROPIC_BASE_URL` \u2014 optional proxy base, e.g. `https://anyrouter.dev/api/v1` (SDK appends `/messages`).\n- `BETTER_AUTH_SECRET` = `openssl rand -hex 32` (signs Console sessions).\n- `PLATFORM_ROOT_SECRET` = `openssl rand -base64 32` (at-rest encryption). **Back it up** \u2014 lose it and every encrypted row (credentials, model-card keys) is unreadable.\n\n## Use it \u2014 spawn an agent (AnyRouter as the model plane)\nAnthropic-compatible; auth via `x-api-key`. Route models through AnyRouter with a BYOK **model card** (no code change):\n1. `POST /v1/model_cards` with `provider:\"oai-compatible\"`, `base_url:\"https://anyrouter.dev/api/v1\"`, `model:\"stepfun-ai/step-3.7-flash\"`, and the AnyRouter key as the card credential \u2014 the card's `base_url` overrides upstream and custom headers propagate.\n2. `POST /v1/agents` \u2014 create the agent (OMA-specific fields like `harness`/`runtime_binding` nest under `_oma:` so stock Anthropic SDKs ignore them).\n3. `POST /v1/sessions`, then post a message \u2192 SSE stream of the turn. That spawns the agent run.\n\n## Verified run flow + gotchas (node self-host)\nOrder that actually works against a live node self-host:\n1. **Bootstrap a user** \u2014 no default admin; email/password signup requires verification but self-host has no SMTP (`sendEmail` no-ops when `SEND_EMAIL` unset \u2014 the code isn't even logged). Seed one: POST `/auth/sign-up/email`, then set `emailVerified=1` in `/app/data/auth.db` (`node:sqlite`, table `user`). Then sign-in works.\n2. **Mint an API key** \u2014 POST `/v1/api_keys` with the better-auth session cookie \u2192 returns an `oma_\u2026` key once. Use it as `x-api-key` for `/v1/*`.\n3. **Create agent** \u2014 POST `/v1/agents` `{name,model,system,tools}`; OMA-only fields nest under `_oma:` (e.g. `runtime_binding`).\n4. **Create session** \u2014 body field is **`agent`** (not `agent_id`, despite older self-host.md), and a non-local-runtime agent needs **`environment_id`** \u2014 main-node accepts ANY id (returns a synthetic local-runtime env), e.g. `\"env-local-runtime\"`.\n5. **Drive** \u2014 POST `/v1/sessions/:id/events` `{events:[{type:\"user.message\",content:[{type:\"text\",text:\"\u2026\"}]}]}`; read `/v1/sessions/:id/trajectory` or `/events/stream`.\n\nBugs / friction found \u2014 root-caused live (the running pod serves **`apps/main-node`** from source via `tsx`, NOT the full `apps/main` Hono app):\n- **Model cards write-path is UNIMPLEMENTED in the Node self-host.** `main-node/src/index.ts` only registers a read stub `v1.get(\"/model_cards\", c => c.json({data:[]}))` \u2014 no POST/PUT/DELETE, no `ModelCardsService`, likely no `model_cards` table. So `POST /v1/model_cards` matches nothing and falls through to that app's global `app.notFound \u2192 {\"error\":\"not found\"}` (404). (Earlier theory that a routing-order/integrations bug swallowed it was WRONG \u2014 it's just an unported feature. Integrations are stubbed the same way: `v1.get(\"/integrations/*/credentials\")` only.) Registering BYOK oai-compatible / free models therefore needs the feature built, not a route reorder.\n- **Uncapped output tokens \u2192 BYOK 502.** Harness `streamText` (default-loop.ts:408) sets no `maxOutputTokens` \u2192 SDK default **4096**. When AnyRouter routes to an **openrouter-byok** upstream (bills the user's OpenRouter account, NOT AnyRouter's own credit balance), it rejects when the *requested* max exceeds the affordable budget \u2014 surfaces in OMA as `finish_reason:\"error\", \"Failed after 3 attempts. Last error: Bad Gateway\"` after 3 retries. **Confirmed:** same in-pod key + model at `max_tokens:16` \u2192 HTTP 200; at 4096 (OMA default) \u2192 502. Note AnyRouter `monthly_balance` (e.g. $162) does NOT cover BYOK upstreams \u2014 BYOK bills elsewhere. **Fix shipped:** PR #4 `duyet/open-managed-agents` adds opt-in `OMA_MAX_OUTPUT_TOKENS` env cap; set it (e.g. `1024`) in the OMA ConfigMap for BYOK/low-budget self-hosts. Alternative: turn off BYOK so requests bill AnyRouter credit.\n- Default provider uses AnyRouter's Anthropic-native `/messages` \u2192 only `anthropic/*` model ids route cleanly; non-anthropic ids get their `provider/` prefix mangled. Reaching free `/chat/completions` models needs the (unimplemented) model-cards write-path above.\n\n## Flue / sandbox interop\n- The real harness contract is a class `implements HarnessInterface` (`apps/agent/src/harness/interface.ts`), NOT the README's unimplemented `defineHarness`. Register with `registerHarness(\"name\", \u2026)`; mirror the `AcpProxyHarness` meta-harness pattern to embed another framework's loop.\n- Sandbox port `SandboxExecutor.exec` returns a **string** with an `[exit N]` suffix (not structured) \u2014 parse it when adapting to a framework that wants `{stdout,stderr,exitCode}`. Adapters live in `packages/sandbox/src/adapters/`.\n- k8s agent code-exec sandboxes: the kubernetes-sigs **agent-sandbox** CRD (Sandbox/SandboxWarmPool/SandboxClaim) is the standard building block; pair with gVisor/Kata for untrusted-code isolation.", "tech-ai-agent-stack": "The 2026 stack for building LLM agents, by layer:\n\n- **Orchestration (Python):** LangGraph (graph/state machines), LlamaIndex\n  (RAG + agents), PydanticAI, CrewAI, AutoGen, OpenAI Agents SDK, Google ADK.\n- **Orchestration (TS/JS):** Vercel **AI SDK** (streaming, tools, `ToolLoopAgent`),\n  Mastra, LangGraph.js, Cloudflare Agents (Durable Objects), OpenAI Agents SDK,\n  Claude Agent SDK.\n- **Model gateways:** OpenRouter, AnyRouter, LiteLLM \u2014 swap providers without code churn.\n- **Interop protocol:** **MCP** (Model Context Protocol) for tools/resources; A2A\n  for agent-to-agent.\n- **Memory / RAG:** vector stores (Qdrant, pgvector), LlamaIndex; explicit\n  short/long-term + reflection memory for agentic loops.\n- **Eval / observability:** LangSmith, Langfuse, Braintrust.\n- **Runtime / deploy:** Cloudflare Workers + Durable Objects, Vercel.\n\n**Duyet uses** (see [[user-duyet-ai-stance]]): Claude Code as driver; Claude Agent\nSDK, OpenAI Agents SDK, Cloudflare Agents, Vercel AI SDK, LlamaIndex, LangChain;\nOpenRouter/AnyRouter for routing; MCP (mcp.duyet.net). Core pattern: plan \u2192\nexecute \u2192 test \u2192 reflect with persistent memory.", "tech-eve-framework": "**eve** = Vercel's filesystem-first framework for durable backend AI agents (npm `eve`,\nNode 24+). An agent is a directory under `agent/`; eve compiles + runs it, persists every\nsession, serves it over HTTP. Docs ship in `node_modules/eve/docs/` \u2014 read these, they\nmatch the installed version.\n\n## File layout (everything is a file)\n- `agent/agent.ts` \u2014 `defineAgent({ model, modelContextWindowTokens })`.\n- `agent/instructions.md` \u2014 always-on system prompt (identity/rules).\n- `agent/connections/<name>.ts` \u2014 `defineMcpClientConnection({url,description,auth?,tools?,approval?})`\n  or `defineOpenAPIConnection`. Name = filename. Model calls `connection__<name>__<tool>`\n  via `connection__search`; creds never reach the model.\n- `agent/skills/<name>/SKILL.md` (or flat `.md`) \u2014 load-on-demand procedures (`load_skill`);\n  `description` frontmatter is the routing hint. `defineSkill` for typed/packaged.\n- `agent/tools/<snake_case>.ts` \u2014 `defineTool({description, inputSchema: zod, execute})`.\n  Filename = tool name. Gate side effects with `needsApproval: always()/once()` (`eve/tools/approval`).\n- `agent/channels/eve.ts` \u2014 `eveChannel({ auth: [...] })`. Auth is **fail-closed**;\n  `placeholderAuth()` blocks browsers in prod \u2014 use `none()` (`eve/channels/auth`) as the\n  last entry for a public web chat.\n- State: `defineState(name, initial)` from `eve/context` \u2014 durable but **session-scoped**\n  (get/update). Cross-session data \u2192 a connection or external store.\n- HITL: built-in `ask_question` tool (model asks the user); approvals via `needsApproval`.\n\n## Gotchas (learned building eved)\n- **Imports between agent modules must use the real `.ts` extension** (`./model.ts`, not\n  `./model.js`). eve runs raw TS via Node 24 native type-stripping, which does NOT rewrite\n  `.js`\u2192`.ts`; the docs' `.js` convention fails the dev runtime (`ERR_MODULE_NOT_FOUND`).\n  Set `allowImportingTsExtensions: true` so tsgo accepts it. eve's generated\n  `module-map.mjs` uses `.ts` \u2014 that's the tell.\n- Commands: `eve dev|build|start|info`; typecheck via `tsgo`. `eve info` = quick compile check.\n- **Frontend**: `eve/next` `withEve(nextConfig)` + `eve/react` `useEveAgent()`; same dir,\n  `agent/` at root. assistant-ui bridges cleanly via `useExternalStoreRuntime`.\n- `npx skills add <gh-repo>` vendors the WHOLE source repo (incl. its own CLAUDE.md/AGENTS.md\n  \u2192 pollutes your agent's context). Prefer a self-contained `.claude/skills/<n>/SKILL.md`.\n\nFirst used building **eved** (github.com/duyet/eved): a public Duyet-assistant agent on eve\n+ AnyRouter, with duyet / firecrawl / clickhouse-monitor MCP connections.", "tech-flue-provider-registration": "Flue addresses models as `provider/model`. A custom gateway (AnyRouter, OpenRouter, any OpenAI-compatible endpoint) is a provider you register with `registerProvider(id, { api:'openai-completions', baseUrl, apiKey })`. Model then = `anyrouter/stepfun-ai/step-3.7-flash` (provider id + upstream path).\n\n**The gotcha (verified):** the API key must be a real value **at the moment `registerProvider` runs**. Flue's `getProviderApiKey` reads ONLY the registration's stored `apiKey` \u2014 no env-var fallback. And Flue does NOT populate `process.env` from `.env.local` at module-eval time:\n- Node target: initializer `env` is the shell `process.env`; `.env.local` is not loaded there at all (it's a wrangler/Cloudflare mechanism).\n- Cloudflare target: `.env.local` becomes the worker `env` binding, available in the initializer \u2014 not in module-scope `process.env`.\n\nSo registering in `app.ts` / module top-level with `process.env.X` gets `undefined` \u2192 runtime error `No API key for provider: <id>`.\n\n**Fix:** register inside `defineAgent`'s initializer, from `ctx.env` (idempotent / last-write-wins, so per-init is fine):\n```ts\nexport default defineAgent(({ env }) => {\n  registerProvider('anyrouter', {\n    api: 'openai-completions',\n    baseUrl: 'https://anyrouter.dev/api/v1',\n    apiKey: env.ANYROUTER_API_KEY,\n  });\n  return { model: 'anyrouter/stepfun-ai/step-3.7-flash', instructions: '...' };\n});\n```\n\n**Debugging note:** the Cloudflare/workerd target swallows errors as an opaque `500 internal_error`. Reproduce with `flue run <agent> --target node` \u2014 node surfaces the real error (`No API key\u2026`, `401 Invalid API key`, etc.). Also: `AgentRuntimeConfig` has no `output` field \u2014 structured output is per-call via `session.prompt({ result: schema })`, not an agent-level option. Channel modules (e.g. `createGitHubChannel({ webhookSecret })`) hit the same env-timing issue since they construct at module load \u2014 the secret must be present in the process env when the module evaluates.", "tech-hermes-agent-custom-provider": "Hermes agent configuration for custom OpenAI-compatible LLM providers.\n\n## Custom provider registration\n\nTwo-part config in `hermes.yaml`:\n\n1. **`custom_providers` list** \u2014 registers the provider by name, base_url, model, and api_key\n2. **`model.provider: custom`** \u2014 tells Hermes to look up from custom_providers instead of built-in\n\n```yaml\nmodel:\n  api_key : ${API_KEY}\n  base_url: ${API_BASE}\n  default: 'provider-name/model-name'\n  provider: custom          # <-- required to use custom_providers\ncustom_providers:\n  - api_key : ${API_KEY}\n    base_url: https://example.com/api/v1\n    model: actual-model-id\n    name: provider-name     # referenced in default as \"provider-name/model\"\nproviders: {}               # clear built-in providers if not needed\n```\n\n**Gotcha:** `providers` must be set to `{}` if you don't want built-in providers loaded. Leaving it out may cause conflicts.\n\n## Steer mode (busy_input_mode)\n\n```yaml\ndisplay:\n  busy_input_mode: steer\n  busy_ack_enabled: true\n```\n\n- `steer`: when the agent is busy processing, new user messages are queued and the agent adjusts its current task to incorporate them (rather than ignoring or queuing blindly)\n- `busy_ack_enabled: true`: sends a brief acknowledgment so the user knows the message was received\n- Alternative values: `reject`, `queue` (agent-specific)", "tech-hermes-dashboard-auth": "Hermes (`nousresearch/hermes-agent`) ships a bundled **`nous`** dashboard-auth\nplugin (OAuth 2.0 auth-code + PKCE vs Nous Portal `portal.nousresearch.com`).\nSource of truth when docs are scarce: read the bundled plugin at\n`/opt/hermes/plugins/dashboard_auth/nous/` inside the running image.\n\n- **Gate is independent of providers.** `web_server.should_require_auth(host, allow_public)`\n  decides if the in-app auth gate engages: **loopback host \u2192 off**; **non-loopback\n  + `insecure`/`--insecure` \u2192 off**; **non-loopback + not insecure \u2192 ON**. A\n  registered provider (nous/OIDC/basic) is only *consulted* when the gate is ON.\n  `allow_public` = `HERMES_DASHBOARD_INSECURE=1`.\n- **nous activation \u2014 two gates, both required (on the `main` build):**\n  (1) **opt-in allow-list** \u2014 `main` made bundled plugins opt-in; `nous` loads\n  only if listed in `plugins.enabled` (config.yaml; set via `hermes plugins enable`\n  OR, for chart-managed deploys, in `config.values`). (2) **client_id** \u2014 env\n  `HERMES_DASHBOARD_OAUTH_CLIENT_ID` (chart `dashboard.auth.oauthClientId`) wins\n  over config.yaml `dashboard.oauth.client_id`; shape `agent:{instance_id}`; empty\n  \u2192 provider skipped (no-op). See [[tech-hermes-agent-custom-provider]].\n- **Overwrite trap:** the chart's `config.overwrite: true` rewrites config.yaml\n  from the ConfigMap every boot, so a runtime `hermes plugins enable` is wiped on\n  restart. Put `plugins.enabled: [nous]` in `config.values` instead (deep-merge\n  keeps it over the default `[]`). Verified: log line\n  `dashboard-auth-nous: registered provider (client_id=\u2026, portal=https://portal.nousresearch.com)`.\n- **Redirect-URI tiers** (`dashboard_auth/routes.py:_redirect_uri`):\n  `dashboard.public_url`/`HERMES_DASHBOARD_PUBLIC_URL` \u2192 else `X-Forwarded-Host`+`Proto`\n  \u2192 else request URL. The **Portal allowlist is authoritative** (plugin's local\n  check allows any `http(s)://\u2026/auth/callback`).\n- **Homelab gotcha:** instance runs `insecure: true` behind Traefik forwardAuth\n  (see [[tech-traefik-forwardauth-oauth2-proxy]]), so the gate never engages \u2192\n  registering nous is **dormant** (no effect). The default Portal allowlist is\n  `http://localhost:<port>/auth/callback` only, so it can't authenticate an\n  Ingress URL \u2014 to make nous the real dashboard auth you must: turn insecure OFF,\n  set `dashboard.public_url`, and add the public callback to the Portal allowlist.", "tech-rag-retrieval-pollution": "Failure signature: doc search links users to pages that don't exist or don't match the\nquestion (\"taxes\" \u2192 \"dashboard widgets\"). Four independent causes seen together in prod:\n\n- **Synthetic TOC/link-list documents poison retrieval.** A table-of-contents doc mentions\n  every topic, so it scores ~0.75+ against *any* query on a narrow corpus, and the LLM lifts\n  its links as if they were sources. Exclude at query time (`must_not is_toc`) AND ideally\n  never index them into the searchable collection.\n- **Citation guards that check \"URL appears verbatim in a tool result\" pass irrelevant real\n  URLs.** They only block *invented* links \u2014 a TOC's link list is a guard bypass by design.\n- **Metadata key drift between indexers** (`language` vs `lang`) silently hides half the\n  corpus when filters match only one key; an empty filtered result must retry, not conclude\n  \"no documentation exists\".\n- **Query embeddings must come from the collection's own registry version**, never a global\n  env default \u2014 a DB override switching collections otherwise queries a foreign vector\n  space with zero errors, only garbage neighbours.\n\nRelated lesson: punt/fallback detection by substring matching backfires the moment the\nsystem prompt mandates a boilerplate opener \u2014 every legitimate answer \"contains the punt\nmarker\". Strip mandated boilerplate first and test the residual.", "tech-okf-open-knowledge-format": "**Open Knowledge Format (OKF) v0.1** \u2014 Draft. Published by Google Cloud (Sam\nMcVeety, Amir Hormati) 2026-06-13. Canonical spec: `GoogleCloudPlatform/knowledge-catalog/okf/SPEC.md`.\n\nAn open, vendor-neutral standard for the **markdown + YAML-frontmatter\n\"LLM-wiki\"** pattern \u2014 the same pattern [[feedback-docs-driven-development]] and\nthis repo already use. \"Just markdown, just files, just YAML frontmatter.\" No\nruntime, no SDK, no compression.\n\n## Shape\n\n- **Bundle** = a directory tree of `.md` files. **Concept** = one `.md` file.\n  **Concept ID** = the file path with `.md` removed (the *path is the identity*).\n- **Reserved filenames** (MUST NOT be concepts): `index.md` (directory listing\n  for progressive disclosure), `log.md` (chronological change history, newest\n  first, ISO 8601).\n- Concepts link via **standard markdown links** (bundle-relative `/x.md` or\n  relative `x.md`) \u2192 a graph richer than the folder hierarchy. Consumers MUST\n  tolerate broken links.\n- **Frontmatter \u2014 REQUIRED: only `type`** (free-form string, not centrally\n  registered; e.g. `BigQuery Table`, `Metric`, `Playbook`, `Reference`).\n  Recommended: `title`, `description`, `resource` (URI of the asset), `tags`,\n  `timestamp` (ISO 8601). Producers MAY add custom keys; **consumers MUST\n  preserve unknown fields** and tolerate unknown `type`s.\n- Conventional body headings: `# Schema`, `# Examples`, `# Citations`.\n\n## Three design principles\n\n1. **Minimally opinionated** \u2014 only `type` is mandated; spec defines the\n   *interoperability surface*, not the content model.\n2. **Producer/consumer independence** \u2014 the format is the contract; tooling at\n   each end is swappable (human-authored \u2194 agent-consumed).\n3. **Format, not platform** \u2014 no cloud / DB / model / agent-framework lock-in.\n\n## Gotcha: the reference validator is stricter than the prose\n\nThe prose requires only `type`, but Google's reference `OKFDocument.validate()`\nrejects any doc missing **`type`, `title`, `description`, `timestamp`** (all four,\nnon-empty), and Google's own sample bundles (GA4, Stack Overflow, Bitcoin) carry\nall four. So *de facto* OKF = those 4 fields. Reference tooling: a BigQuery\nenrichment agent (producer) + a self-contained static HTML graph visualizer\n(consumer).\n\n## How this repo aligns\n\nThis repo **is** a strict-conformant OKF v0.1 bundle. `memory/` is the bundle\nroot; each concept is one `.md` carrying the required `type`. Field map:\n\n| OKF field | this repo | status |\n|-----------|-----------|--------|\n| `type` | `type` (user/feedback/project/reference/tech) | \u2705 |\n| `title` / `description` | same | \u2705 |\n| `tags` | `tags` | \u2705 |\n| `resource` | `sources` (URL array vs singular URI) | \u2248 |\n| `timestamp` | `timestamp` (ISO 8601) + `created`/`updated` (dates) | \u2705 |\n| path = ID | `name:` field (= filename) \u2014 permitted custom key | \u2705 |\n| `index.md` | `memory/index.md` (generated) + `MEMORY.md` (root index) | \u2705 |\n| `log.md` | `memory/log.md` (change history, newest-first) | \u2705 |\n\nConcepts are grouped into **nested topic dirs** by domain\n(`topics/cloudflare/`, `topics/llm-agents/`, `topics/web/`, `topics/ci/`, \u2026)\nalongside the memory-layer dirs (`user/`, `feedback/`, `reference/`,\n`projects/`). Cross-links use Obsidian wikilinks (the double-bracket form) \u2014 an\nOKF-compatible producer convention; the structured graph also rides in `related:`\nfrontmatter. The official validator treats non-`/path.md` text as plain prose, so\nthis is conformant with zero warnings. The monorepo `apps/kb` app is a live\n**consumer** \u2014 see [[project-kb-duyet-net]]; `kb viz` renders a self-contained\ngraph viewer (the OKF reference consumer pattern).", "tech-unit-suffix-vs-scale": "- A unit field on a chart config (\"km\", \"L\", \"\u00b0C\") must be a **display suffix only**. The\n  frontend cannot know a column's source unit \u2014 \"km\" doesn't say whether the data is metres\n  or already km \u2014 so conversion must be an **explicit per-column multiplier**\n  (`columnScales: {distance: 0.001}`), never inferred from the suffix. Otherwise you render\n  `853,020 km` for 853 km and the wrong number wears a correct-looking label.\n- Apply the scale everywhere values render (KPI value, comparison values, axis ticks,\n  tooltips), and only scale a shared axis when *every* series on it agrees \u2014 same rule as\n  shared-axis unit labels.\n- **Duration formatter diagnostic:** a display like `42:60:58` (60 in the minutes slot) is\n  impossible for a correct formatter \u2014 it proves the minutes field is computed independently\n  and *rounded* (`round(remainder/60)`) instead of floored. Test the hypothesis on a value\n  whose remainder rounds *down*: it should match the correct rendering exactly. Sisense\n  number masks with `decimals: 0` round to nearest \u2014 combined with per-slot MOD formulas\n  this produces the bug.", "tech-flat-design-system": "Flat editorial visual language across [[project-duyet-net]] (xAI-style reference,\nset 2026-05-25). [[project-llm-timeline]] PR #1003 is the reference implementation.\n\n**Flat rules:** hairline 1px border (`var(--hairline)`) is the only elevation cue.\nNo `shadow-*`, no glow, no `rounded-2xl` (use `rounded-none`/`rounded-md`). Hover\n= background tint (`var(--faint)`), not shadow. Divider grid: `gap-px\nbg-[var(--hairline)]` container with `bg-[var(--background)]` cells.\n\n**Tokens (3 additive CSS layers in `packages/components/styles.css`):** base\n(Tailwind v4 `@theme`) \u2192 warm (`#fbf7f0 / #1f1f1f`) \u2192 minimal (`--minimal-*` +\nutilities `.pill-outline`, `.eyebrow-mono`, `.display-tight`). shadcn primitives\n(badge/button/input/card, CVA + radix slot) use semantic tokens (`bg-card`,\n`text-foreground`, `border-border`) \u2014 zero hardcoded `neutral-*`/`dark:`.\n\n**Icons:** `lucide-react` everywhere (drop `weight` prop); migrate\n`@phosphor-icons/react` when touching a file. **Dark mode:** card tints\n`dark:bg-{color}/20`; badges invert shade pair; blog uses white `#ffffff` bg\n(distinct editorial identity) over the warm cream others use.", "tech-kumo-ui-nextjs-integration": "Hard-won facts from migrating the AgentState dashboard (Next 16 + Turbopack + `output:\"export\"`) to `@cloudflare/kumo@2.5` from shadcn/ui. See [[tech-flat-design-system]].\n\n**`createContext is not a function` is THE blocker.** Kumo (base-ui) AND `@phosphor-icons/react` (`IconContext`) call `React.createContext` at module top-level. RSC pre-render has no `createContext`, so **every file importing either must start with `\"use client\"`** \u2014 not just the obvious ones. `transpilePackages: [\"@cloudflare/kumo\",\"@base-ui/react\",\"@phosphor-icons/react\",\"echarts\"]` is necessary but NOT sufficient.\n\n**Tailwind v4 wiring** (`globals.css`): `@source \"../../node_modules/@cloudflare/kumo/dist/**/*.{js,jsx,ts,tsx}\";` then `@import \"@cloudflare/kumo/styles/tailwind\";` BEFORE `@import \"tailwindcss\";`. Without `@source`, Kumo utility classes silently vanish (e.g. dialogs not centered).\n\n**API differences vs shadcn:**\n- `Button` has **no `render`/`asChild`** \u2192 link buttons are `<Link href><Button>\u2026</Button></Link>`. Default `variant` is `secondary` (map shadcn `default`\u2192`primary`).\n- `Tabs` is **array-based** (`tabs={[{value,label}]}` + controlled `value`/`onValueChange`), no `Tabs.Content`.\n- **No `Chart`** \u2192 use `echarts` directly (it's a peer dep).\n- `Sidebar`: use named `SidebarProvider` (not `Sidebar.Provider`); `SidebarMenuButton` has `href`+`active`+`tooltip` but **no `render`**.\n- `Text` is a discriminated union: `heading1/2/3` REQUIRE matching `as=\"h1/2/3\"`; **`className` is not accepted** on `Text` at all.\n\n**Tokens:** Kumo ships `--color-kumo-*` (base, hairline, fill, danger, brand\u2026) AND the standard names (`muted`, `foreground`, `border`\u2026) resolve from your own `globals.css :root`. Don't invent `kumo-line`/`kumo-tint`/`kumo-subtle`/`kumo-strong` \u2014 they don't exist; only `kumo-base` does among the common ones.\n\n**Phosphor:** `Activity` does NOT exist (use `Pulse`/`ChartLine`); both bare (`House`) and `*Icon` (`HouseIcon`) forms export. `lucide\u2192phosphor`: Home\u2192House, Settings\u2192Gear, MessageSquare\u2192ChatCircle, ChevronsUpDown\u2192CaretUpDown, Building2\u2192Buildings.\n\n**Dark mode:** Kumo uses `data-mode=\"dark\"` attr; shadcn uses `.dark` class. During migration set BOTH. Local docs via `bunx kumo doc <Name>` / `kumo ls` (web docs often rate-limited).\n\n**Install:** `bun add @cloudflare/kumo @phosphor-icons/react echarts zod` (project uses Bun, not pnpm).", "tech-og-images-static-prerender": "**Goal:** unique 1200\u00d7630 social-share images per page on a static site, without\nadding a runtime image renderer.\n\n**Two flavours of \"dynamic\":**\n- *Build-time* \u2014 generate one committed `og-<slug>.png` per page; regenerate on\n  every deploy. No worker bundle cost. **Default choice** for static-first apps.\n- *Request-time* \u2014 a `/og?title=\u2026` worker route rendering live (Satori + resvg\n  WASM). Truly dynamic but adds WASM weight to the worker bundle; avoid unless\n  needed.\n\n**Pipeline (build-time):** [Satori](https://github.com/vercel/satori) (HTML/CSS\nobject tree \u2192 SVG) + `@resvg/resvg-js` (SVG \u2192 PNG). Make it **hermetic**: vendor\nthe TTF fonts in-repo so no network access \u2014 safe inside CI deploy jobs. It's\ndeterministic (no timestamps/random), so regenerating unchanged cards yields\n**byte-identical** PNGs \u2014 git diff = objective proof a refactor changed nothing.\n\n**Single registry = no drift.** One map `slug \u2192 {eyebrow, title, description}`\nfeeds *both* consumers: (1) the generator loops it to emit `og-<slug>.png`, and\n(2) a `pageOgHead(slug)` helper builds the route `<head>` meta. A standalone bun\nscript can import the app's TS registry directly \u2014 keep that file free of React /\npath-alias imports.\n\n**Crawler correctness \u2014 the check that matters:** social crawlers (Slack, X,\nFacebook) don't run JS. The OG meta MUST be in the *prerendered* HTML, not\ninjected client-side. With TanStack Start SSG the route `head()` runs at build\nand bakes tags into `dist/client/<route>/index.html`. Verify by grepping the\nbuilt HTML, and on prod check the image returns `200 image/png` with\n`cf-cache-status: MISS` right after deploy (proves fresh, not edge-cached).\n\nRoot layout holds the shared defaults (`og:type`, `og:image:width/height`,\n`twitter:card=summary_large_image`); per-route `head()` overrides title + image.\nPages without a registry entry fall back to the site-wide default image.\n\nShipped in chmonitor [[project-clickhouse-monitor]] (PRs #1614/#1615 base,\n#1617 extended to per-page query pages).", "tech-rust-wasm-prerender": "7 Rust crates compiled to WASM (`crate-type=[\"cdylib\"]`) replace TS in\n`@duyet/libs` ([[project-duyet-net]]). Apps import `@duyet/libs/*`, never WASM directly.\n\n**Migration rule:** only migrate a TS function to WASM if its TS mean > ~1 ms.\nJS\u2194WASM string marshaling costs ~30\u201340 \u00b5s/call, so sub-100 \u00b5s ops are parity or\nslower. Only `markdown-to-html` cleared it: 6.3 ms \u2192 0.08 ms (~79x). Slower\ncrates (normalizers, dedup, csv, exif, diff, string-utils) kept for consistency\n+ future batch APIs that amortize marshal cost.\n\n**CI trap:** `**/pkg/` is gitignored \u2192 WASM must be built in CI before the build\nstep. With `prerender.failOnError:false`, a missing binary makes `markdownToHtml`\nthrow, the route is silently skipped, no `index.html` written, and CF Pages\nserves the homepage at every post URL (looks like a routing bug; deploy logs green).\n**Fix:** CI runs rust-toolchain + wasm-pack + `wasm:build:release` before build,\ngated on the blog app. **Diagnose:** healthy blog build = 700+ `index.html` in\n`dist/client/`; grep build log for `markdownToHtml`/\"Failed to convert\".\nSee [[tech-tanstack-start-ssg]], [[tech-cloudflare-pages-deploy]].", "tech-tanstack-stale-route-chunks": "Post-deploy, users on an old main bundle may 404 a lazy route chunk (`pricing-*.js`). TanStack Router then throws **`Cannot read properties of undefined (reading 'component')`** \u2014 not caught by import-only preload handlers.\n\n## Fix pattern (AnyRouter 2026-06-14)\n\n1. Inline pre-import script: match import failures **and** router render errors; `sessionStorage` debounce (30s); listen `unhandledrejection`, `error`, `vite:preloadError`\n2. Root `errorComponent` calls same reload helper when patterns match\n3. Prerender public marketing routes so ASSETS HTML is hash-locked with current build (`<slug>.html`, not `index.html` \u2014 CF trailing-slash 307 trap)\n\n**Why:** Default TanStack error UI sticks; users blame the page, not their cached bundle.\n\n**How to apply:** On any TanStack Start + Vite code-split app with frequent deploys, extend stale-chunk recovery beyond dynamic-import strings; prerender high-traffic static shells in the two-deploy capture pass.", "tech-tanstack-start-ssg": "**Problem:** Cloudflare Rocket Loader rewrites `<script type=\"module\">` to a\ndeferred non-module script \u2192 Vite SPA entry never bootstraps \u2192 blank page.\n**Fix:** pre-render HTML so content exists before JS runs. (Also disable Rocket\nLoader per domain in the CF dashboard as belt-and-suspenders.)\n\n**Migrate Vite SPA \u2192 TanStack Start SSG** (~8 files/app):\n- `vite.config.ts`: swap `TanStackRouterVite()` for `tanstackStart({ prerender:\n  { enabled: true, crawlLinks: true, failOnError: false } })`; drop\n  `@vitejs/plugin-react`; do NOT pass `autoCodeSplitting` (not in schema).\n- Delete `index.html` + `main.tsx`; add `entry-client.tsx` (`hydrateRoot`),\n  `entry-server.tsx` (`createStartHandler`).\n- `router.tsx` must export a `getRouter()` factory, not a const.\n- `__root.tsx` renders full `<html>` doc; move `<meta>`/`<link>` into route `head()`.\n- Build output `dist` \u2192 `dist/client`; set `pages_build_output_dir` in `wrangler.toml`.\n\n**Gotchas:** paths in config are relative to `srcDirectory` (`src`); local\n`fetch('/data.json')` fails in SSR \u2014 use isomorphic loading (`fs.readFile` on\nSSR, `fetch()` on client); absolute API URLs work in both. `failOnError:false`\nhides prerender errors \u2014 see [[tech-rust-wasm-prerender]]. Deploy: [[tech-cloudflare-pages-deploy]].", "tech-agent-loop-autonomous-pr-management": "**Agent-loop** is a continuous, self-paced autonomous system that manages all open PRs without human context overhead.\n\n## Cycle Structure\n\nRuns indefinitely on 15-minute intervals (configurable):\n\n1. **Wait** \u2014 sleep for cycle interval (15 min)\n2. **Triage** \u2014 scan all open PRs across all repos, classify by status\n3. **Dispatch** \u2014 route work to parallel subagent threads\n4. **Monitor** \u2014 track thread progress and outcomes\n5. **Report** \u2014 log cycle summary to `.agent-loop/` state files\n\n## What It Triages\n\n- **Merge-ready**: PR is passing, approved, no conflicts \u2192 dispatch merge agent\n- **Review-ready**: PR is passing, needs review \u2192 dispatch code-review subagent\n- **Needs-fix**: PR is failing tests/lint/type-check \u2192 dispatch fix subagent\n- **Merge-blocked**: conflicts, failing checks, waiting on approval \u2192 log and defer\n- **Deferred**: previously seen, no change \u2192 skip\n\n## Subagent Dispatch Strategy\n\n**Cheap models only** (Sonnet/Haiku) \u2014 preserves main context:\n\n- **Haiku** \u2014 test failures, lint fixes, simple refactors\n- **Sonnet** \u2014 code reviews, complex refactors, multi-file changes\n- **Main context** \u2014 strategic decisions only (scope conflicts, architectural questions)\n\nMax 3 parallel threads per cycle (prevents queue overflow).\n\n## State & Recovery\n\n- **Persisted to** `.agent-loop/state.json` in repo root\n- **Recovers** cycle count, items processed, PRs merged, active thread list, thread history\n- **Backups** kept in `.agent-loop/backups/` (timestamped) for recovery from corruption\n- **Commands**: `/agent-loop:status` (quick), `/agent-loop:inspect` (full), `/agent-loop:stop` (graceful)\n\n## Effectiveness & Cost Savings\n\n**What it eliminates:**\n- Manual PR reviews (triaged by subagents in parallel)\n- Manual fix cycles (test failures \u2192 fix \u2192 re-run \u2192 merge in one agent call)\n- Context-switching cost (loop runs in background, main context for decisions only)\n- Duplicate work (state tracking prevents re-triaging)\n\n**Why cheap subagents work:**\n- PRs have clear status (passing/failing) \u2192 less ambiguity\n- Fixes are scoped (fix this test file, not \"improve the codebase\")\n- Reviews use heuristics (no duplicated code, type safety, naming) \u2192 Sonnet sufficient\n- Merge/CI tasks are deterministic (run test suite, merge, revert if fail)\n\n**Cost vs. value:**\n- Haiku @ 80 tokens/request \u00d7 20 fixes/cycle = 1.6k tokens\n- Sonnet @ 200 tokens/request \u00d7 5 reviews/cycle = 1k tokens\n- Per 15-min cycle: ~3k tokens (vs. Opus main-loop @ 10x cost)\n- 4 cycles/hr \u00d7 6 hrs/day = 24 cycles/day = 72k tokens/day (sustainable)\n\n## Setup & Configuration\n\n```bash\n# Resume with all-repos scope, 15-min cycle\n/agent-loop:resume --scope all --interval 900\n\n# Check status\n/agent-loop:status\n\n# Stop gracefully\n/agent-loop:stop\n```\n\nConfiguration persists in state.json; resume re-applies saved interval/scope.\n\n## Integration Points\n\n- **CI systems**: loop watches GitHub Actions status in real-time\n- **PR queue**: triages GitHub PR API endpoints (open, draft, status)\n- **Git operations**: merge via CLI, uses signed commits (GPG if configured)\n- **Logging**: appends to `.agent-loop/cycles/<YYYY-MM-DD>.log` + `state.json` metrics\n\n## Next: Scaling to Org Scope\n\nCurrently monitoring single project. Roadmap:\n- Fan out to multiple repos (`--scope all --repos org/repo1,org/repo2`)\n- Route complex PRs to senior-engineer agents when heuristics are uncertain\n- Auto-create follow-up issues for deferred PRs (merge-blockers, architecture questions)\n- Dashboard showing cycle health, merge velocity, average review time", "tech-codebase-maintenance-loop": "How [[project-duyetbot]] keeps [[project-duyet-net]] low-debt \u2014 extends\n[[feedback-working-style]] with concrete tooling.\n\n**Improvement cycles:** periodic scoped sweeps, one debt category each (security,\ndedup/shadcn, privacy/cache, data-sync, DB, design, tests). ~9 cycles / ~155\nfixes by early 2026; cycle 9 added 104 tests + unified the design system. Run a\ncycle: `git log --since=<date> --name-only` to scope \u2192 fix \u2192 test before/after \u2192\none semantic commit per logical change.\n\n**Safe dead-code removal:** before deleting a symbol, prove zero non-test refs:\n`rg -n \"<symbol>\" apps packages --glob '!**/*.test.*' --glob '!**/*.spec.*'`.\nEmpty output = safe. `pnpm why <pkg>` to check dep overrides. Record durable\nfindings in the core-memory doc \u2014 do NOT create dated review files.\n\n**Tests:** `pnpm run test` from root (also the pre-commit hook). A test must fail\nwhen business logic changes (encode WHY, not just WHAT). Priority by risk:\nsecurity/credentials \u2192 data transforms (normalizers, slugs, markdown) \u2192 render\ncorrectness \u2192 edge cases.", "tech-tmux-pane-status-labels": "## Problem\n\nWhen running multiple tmux windows with coding agents, you can't tell at a glance which tabs have an active agent session vs which are sitting idle at a shell prompt waiting for human review.\n\n## Solution\n\nCreate a `~/.local/bin/tmux-pane-label` script that maps `#{pane_current_command}` to a descriptive icon+label, then wire it into tmux's `automatic-rename-format`.\n\n### Script location\n\n`~/.local/bin/tmux-pane-label` (chmod +x, must be in `$PATH`)\n\n### Command \u2192 label mapping\n\n| Command | Tab label | Meaning |\n|---|---|---|\n| `opencode`, `claude`, `codex`, `cursor` | `\u27f3 name` | Agent actively running |\n| `bash`, `sh`, `zsh`, `fish` | `\u2304 name` | Idle at shell prompt |\n| `nvim`, `vim`, `nano` | `\u270e name` | Editor open |\n| `node`, `npm`, `bun`, `deno` | `\u26a1 name` | Dev tool running |\n| `python`, `python3` | `\ud83d\udc0d python` | Python process |\n| `ssh` | `\ud83c\udf10 ssh` | Remote session |\n| `htop`, `top`, `btm` | `\ud83d\udcca name` | System monitor |\n| `docker` | `\ud83d\udc33 docker` | Container tool |\n| `sudo` | `\ud83d\udd12 sudo` | Privileged command |\n| `make`, `cargo`, `go` | `\ud83d\udd28 name` | Build tool |\n| `less`, `more`, `man` | `\ud83d\udcc4 name` | Pager |\n| `tail`, `tailf`, `watch` | `\ud83d\udccb name` | Log follow |\n| `tmux` | `\u23ce` | Tmux internal |\n| anything else | raw command name | Fallback |\n\n### Tmux config (`~/.tmux.conf.local` for gpakosz/.tmux)\n\n```tmux\nset -g automatic-rename-format \\\n  \"#{?pane_in_mode,[tmux],#(tmux-pane-label #{pane_id})}#{?pane_dead,[dead],}\"\n\n# \u2303b + Shift+R re-enables dynamic naming on a manually-renamed window\nbind R set-window-option automatic-rename on \\; display \"Dynamic naming ON\"\n```\n\n### How it works\n\n- `automatic-rename-format` dynamically sets window names based on the active pane\n- The script calls `tmux display -t <pane_id> -p '#{pane_current_command}'` and classifies the result\n- When a coding agent is the foreground process, the tab shows \"\u27f3 agentname\"\n- When the agent exits and the shell returns, the tab switches to \"\u2304 bash\"\n- Previously renamed windows (`automatic-rename off` per-window) keep static names\n- **\u2303b + Shift+R** re-enables dynamic naming on per-window basis\n\n### Notes\n\n- Script must handle panes that no longer exist (`tmux display` fails \u2192 returns `\"?\"`)\n- The `#()` format expansion is fast (<10ms per call, runs per status-interval)\n- Manual window names (via `\u2303b + ,`) take precedence and disable automatic-rename\n- Tested with tmux 3.6a and gpakosz/.tmux config framework", "user-duyet-ai-stance": "Duyet's current AI practice (from his blog, ~2026):\n\n- **Vibe-codes for production.** Top Wakatime language is now **Markdown** \u2014\n  he drives agents more than he hand-writes code.\n- **Claude Code is his daily driver** and stated favorite (\"king\") after trying\n  100+ tools (Cursor, Codex, Copilot, Windsurf, Antigravity, opencode, etc.). He\n  treats specific tools as disposable \u2014 the field moves too fast to pick \"the best\".\n- **Builds with agent SDKs:** OpenAI Agents SDK, Claude Agent SDK, Cloudflare\n  Agents, Vercel AI SDK, LlamaIndex, LangChain. Deploys RAG for enterprise.\n- **Recurring interests:** self-improving/agentic loops (plan\u2192execute\u2192test\u2192reflect),\n  agent memory & consolidation, privacy-first personal agents, personal analytics\n  / life-logging. Personal agent project: `duyetbot`.\n\nSee [[user-duyet-stack]] for the broader toolset.", "user-duyet-profile": "**Duyet Le** (handle `@duyet`) \u2014 senior data engineer and technology enthusiast,\nbased in Vietnam. Owner of this knowledge base.\n\nFocus areas: large-scale data platforms, real-time analytics, ClickHouse, the\ndata-engineering ecosystem (Kafka, Spark, Airflow), Kubernetes/cloud infra, and\nLLM agents / AI integration. Active open-source contributor.\n\nPublic links and stack live in [[user-duyet-web-presence]] and [[user-duyet-stack]].\nWorking preferences in [[feedback-working-style]].", "user-duyet-stack": "Technical stack for [[user-duyet-profile]], drawn from public blog & GitHub.\n\n**Languages:** Rust (extensive), Python, TypeScript/JavaScript, SQL. Also R, PHP\nin older posts. Notably interested in data-engineering tools written in Rust.\n\n**Data & big data:** ClickHouse (deep expertise), Apache Spark, Apache Airflow,\nDuckDB, Kafka; PostgreSQL, MongoDB, Redis.\n\n**Cloud & infra:** Kubernetes, Docker, AWS, GCP, Azure, Cloudflare, GitHub Actions.\n\n**AI/ML:** LLM agents & coding agents (Claude, Codex, Hermes), PyTorch/TensorFlow,\nNLP, MCP servers.\n\n**Frontend/web:** Next.js, React, TypeScript (e.g. `clickhouse-monitoring`).\n\n**Local dev environment:** macOS (Apple Silicon), Homebrew, `bun`, `uv`, neovim,\nObsidian. Prefers semantic commits and simple, plain English in writing.\n\nBlog series worth knowing: ClickHouse on Kubernetes, Rust Fundamentals, Spark on\nKubernetes, Apache Airflow, Coding Agents. See [[user-duyet-web-presence]].", "user-duyet-web-presence": "Public web presence for [[user-duyet-profile]]. Sites ending in `/llms.txt`\nserve an LLM-friendly profile \u2014 prefer those for fresh facts.\n\n| What        | URL                          | llms.txt                         |\n|-------------|--------------------
